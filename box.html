<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>BOX</title>
<link rel="icon" type="image/png" href="icons/mmm-192.png"/>
<style>
/*
  WIN95/98 原汁原味复古主题
  颜色: #c0c0c0 银灰 / #000080 深蓝 / 白底宋体
*/

:root {
  --win-gray:   #c0c0c0;
  --win-light:  #dfdfdf;
  --win-dark:   #808080;
  --win-darker: #404040;
  --win-white:  #ffffff;
  --win-black:  #000000;
  --win-blue:   #000080;
  --win-blue2:  #1084d0;
  --win-red:    #ff0000;
  --win-green:  #008000;
  --win-teal:   #008080;

  /* aliases */
  --bg:       var(--win-gray);
  --surface:  var(--win-gray);
  --surface2: var(--win-light);
  --border:   var(--win-dark);
  --border-lt: var(--win-white);
  --border-dk: var(--win-darker);
  --accent:   var(--win-red);
  --gold:     var(--win-blue);
  --green:    var(--win-green);
  --blue:     var(--win-blue);
  --purple:   #800080;
  --gray:     var(--win-dark);
  --light:    var(--win-black);

  /* 系统字体栈：宋体/黑体系 */
  --font-ui:    "Unifont","MS Sans Serif","SimSun","宋体",Tahoma,Arial,"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
  --font-pixel: 'Press Start 2P', monospace;
  --font-mono:  "Unifont","Courier New","SimSun",monospace;
  --font-vt:    "Unifont","MS Sans Serif","SimSun","宋体",Tahoma,Arial,"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
}

/* ── Google Fonts (Press Start 2P only) ── */

/* GNU Unifont — 古早点阵字体 */
@font-face {
  font-family: 'Unifont';
  src: url('unifont.ttf') format('truetype');
  font-weight: normal;
  font-style: normal;
  font-display: swap;
}

/* ── reset ── */
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;}
body{
  background:var(--win-gray);
  color:var(--win-black);
  font-family:"Unifont","MS Sans Serif","SimSun","宋体",Tahoma,Arial,"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
  font-size:14px;
}
.app{display:flex;flex-direction:column;height:100vh;}

/* ══════════════════════════════════════
   WIN95 立体边框 mixin classes
   ══════════════════════════════════════ */
.w-raised{border:2px solid;border-color:var(--win-white) var(--win-darker) var(--win-darker) var(--win-white);}
.w-inset {border:2px solid;border-color:var(--win-darker) var(--win-white) var(--win-white) var(--win-darker);}

/* ══════════════════════════════════════
   TOP BAR — 蓝色标题栏风格
   ══════════════════════════════════════ */
.topbar{
  display:grid;grid-template-columns:1fr auto;gap:8px;
  padding:5px 8px;
  background:
    linear-gradient(180deg,rgba(255,255,255,.10) 0%,rgba(0,0,0,.28) 100%),
    linear-gradient(90deg,#101a4a 0%,#1b3a86 55%,#2a63b8 100%);
  border-bottom:2px solid #05082a;
  box-shadow:inset 0 -3px 0 rgba(0,0,0,.35);
  flex-shrink:0;
  min-height:62px;
  align-items:center;
}

/* 顶栏折叠 */
.topbar{position:relative;transition:min-height .18s ease,padding .18s ease;}
.hud-fold{
  position:absolute;right:6px;top:2px;z-index:5;
  width:20px;height:15px;line-height:1;padding:0;font-size:9px;cursor:pointer;
  background:rgba(0,0,0,.35);color:#ffe9b0;
  border:1px solid rgba(255,225,150,.45);
}
.hud-fold:hover{background:#ffe08a;color:#3a2400;}
.hud-mini{display:none;}
.topbar.folded{min-height:0;padding:0;}
.topbar.folded .char-panel,
.topbar.folded .pomo-panel{display:none;}
.topbar.folded .hud-fold{display:none;}
.topbar.folded .hud-mini{
  display:flex;align-items:center;gap:10px;
  grid-column:1 / -1;
  padding:2px 8px;cursor:pointer;font-family:var(--font-ui);font-size:11px;color:#dfe7f8;
}
.hud-mini-name{font-weight:bold;color:#fff;}
.hud-mini-cash{font-family:var(--font-mono);color:#ffe9b0;font-size:12px;}
.hud-mini-stat{color:#a8b6d8;}
.hud-mini-arrow{margin-left:auto;color:#ffe9b0;}
.hud-mini:hover .hud-mini-arrow{color:#fff;}

/* ══ 游戏化 HUD ══ */
.char-panel{display:flex;align-items:center;gap:9px;}
.hud-portrait{position:relative;flex-shrink:0;padding:3px;
  background:linear-gradient(160deg,#ffe9a8,#c9922f 45%,#7a5510);
  box-shadow:0 0 0 2px #2a1c04, 2px 2px 0 2px rgba(0,0,0,.35);
}
.hud-portrait::after{
  content:"";position:absolute;inset:3px;pointer-events:none;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.35);
}
.hud-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;}
.hud-line{display:flex;align-items:center;gap:6px;flex-wrap:nowrap;}
.hud-chip{
  display:inline-flex;align-items:center;gap:3px;flex-shrink:0;
  font-family:var(--font-ui);font-size:11px;color:#ffe9b0;
  padding:1px 7px;
  background:linear-gradient(180deg,rgba(0,0,0,.45),rgba(0,0,0,.2));
  border:1px solid rgba(255,225,150,.45);
  text-shadow:1px 1px 0 #000;
}
.hud-chip b{font-family:var(--font-mono);font-size:12px;color:#fff;}
.hud-chip.hot{color:#ffd0a0;border-color:rgba(255,150,80,.6);}

/* 钱包做成一块钱袋铭牌 */
.wallet-row{
  display:flex;align-items:center;gap:7px;cursor:pointer;
  padding:2px 6px 2px 3px;
  background:linear-gradient(180deg,rgba(0,0,0,.42),rgba(0,0,0,.16));
  border:1px solid rgba(255,225,150,.35);
}
.wallet-row:hover{border-color:#ffe08a;background:linear-gradient(180deg,rgba(0,0,0,.5),rgba(30,20,0,.3));}
.wallet-badge{
  font-family:var(--font-mono);font-size:15px;font-weight:bold;
  color:#fff3c4;text-shadow:1px 1px 0 #6a2000,0 0 6px rgba(255,190,60,.55);
  background:none;border:none;padding:0 2px;flex-shrink:0;letter-spacing:1px;
}
.wallet-stack{display:flex;align-items:center;gap:4px;flex:1;min-width:0;overflow:hidden;height:22px;}
.wallet-note{
  display:flex;align-items:center;gap:2px;flex-shrink:0;padding:0 3px;
  background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.26);
}
.wallet-total{font-size:10px;color:#b9c6e6;white-space:nowrap;flex-shrink:0;font-family:var(--font-ui);}
.wallet-row:hover .wallet-badge{color:#fff;}
.char-name{
  font-family:var(--font-ui);font-size:13px;font-weight:bold;color:#fff;
  background:transparent;border:none;outline:none;
  max-width:150px;cursor:pointer;text-shadow:1px 1px 0 #000040;flex-shrink:1;min-width:40px;
}

@media (max-width:640px){
  .wallet-total,.hud-chip.wide{display:none;}
  .char-name{max-width:90px;}
}
.avatar-frame{
  width:44px;height:44px;flex-shrink:0;cursor:pointer;
  border:2px solid;border-color:var(--win-darker) var(--win-white) var(--win-white) var(--win-darker);
  background:var(--win-gray);image-rendering:pixelated;overflow:hidden;
}
.avatar-default{width:100%;height:100%;display:flex;align-items:center;justify-content:center;}
.avatar-frame img{width:100%;height:100%;object-fit:cover;image-rendering:pixelated;}
.avatar-frame{position:relative;}
.avatar-edit,.avatar-clear{
  position:absolute;width:14px;height:14px;padding:0;line-height:1;font-size:9px;
  background:var(--win-gray,#c0c0c0);color:#000;cursor:pointer;
  border:1px solid;border-color:var(--win-white) var(--win-darker) var(--win-darker) var(--win-white);
  display:none;align-items:center;justify-content:center;
}
.avatar-edit{right:0;bottom:0;}
.avatar-clear{right:0;top:0;color:#cc0000;}
.avatar-frame:hover .avatar-edit{display:flex;}
.avatar-frame:hover .avatar-clear.has-avatar{display:flex;}
.char-info{flex:1;min-width:0;}
.char-name:focus{background:rgba(255,255,255,.15);outline:1px dotted #fff;}
/* ── 番茄钱包（原来的等级条位置） ── */
.wallet-row{display:flex;align-items:center;gap:6px;margin-top:3px;cursor:pointer;}
.wallet-badge{
  font-family:var(--font-mono);font-size:12px;font-weight:bold;
  background:var(--win-gray);color:#a00000;padding:1px 6px;flex-shrink:0;
  border:2px solid;border-color:var(--win-white) var(--win-darker) var(--win-darker) var(--win-white);
}
.wallet-stack{display:flex;align-items:center;gap:4px;flex:1;min-width:0;overflow:hidden;height:22px;}
.wallet-note{
  display:flex;align-items:center;gap:2px;flex-shrink:0;padding:0 3px;
  background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3);
}
.wallet-note img{width:17px;height:17px;object-fit:contain;display:block;}
.wallet-note .wn-emo{font-size:13px;line-height:1;}
.wallet-note .wn-x{font-family:var(--font-mono);font-size:10px;color:#fff;}
.wallet-total{font-size:10px;color:#c8d2e8;white-space:nowrap;flex-shrink:0;font-family:var(--font-ui);}
.wallet-row:hover .wallet-badge{background:#fff;}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:.3;}}

/* ── 商店 ── */
.shop-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px;}
.shop-purse{
  font-family:var(--font-mono);font-size:13px;font-weight:bold;color:#a00000;
  background:#fff;padding:3px 8px;
  border:2px solid;border-color:var(--win-darker) var(--win-white) var(--win-white) var(--win-darker);
}
.shop-hint{font-size:11px;color:#808080;font-family:var(--font-ui);}
.shop-sec-title{
  font-family:var(--font-ui);font-size:12px;font-weight:bold;color:#000080;
  margin:12px 0 6px;padding-bottom:3px;border-bottom:2px solid var(--win-dark);
}
.shop-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:8px;}
.shop-card{
  background:#fff;padding:6px;text-align:center;position:relative;
  border:2px solid;border-color:var(--win-white) var(--win-darker) var(--win-darker) var(--win-white);
}
.shop-card img{width:100%;height:84px;object-fit:contain;display:block;}
.shop-card .sc-name{
  font-family:var(--font-ui);font-size:12px;color:#000;margin-top:4px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.shop-card .sc-price{font-family:var(--font-mono);font-size:12px;color:#a00000;margin-top:2px;}
.shop-card .sc-ops{display:flex;gap:3px;margin-top:5px;}
.shop-card .sc-ops button{
  flex:1;font-size:11px;padding:2px 0;cursor:pointer;font-family:var(--font-ui);
  background:var(--win-gray);color:#000;
  border:2px solid;border-color:var(--win-white) var(--win-darker) var(--win-darker) var(--win-white);
}
.shop-card .sc-ops button:hover{background:var(--win-light);}
.shop-card .sc-ops button.buy{background:#008000;color:#fff;font-weight:bold;}
.shop-card .sc-ops button.buy:disabled{background:#b0b0b0;color:#606060;cursor:not-allowed;}
.shop-card .sc-own{
  position:absolute;top:2px;right:2px;background:#000080;color:#fff;
  font-size:10px;padding:0 4px;font-family:var(--font-mono);
}
.shop-card.just-bought{animation:pop .7s ease-out;border-color:#ffd700 #806000 #806000 #ffd700;}
@keyframes pop{0%{transform:scale(1);}35%{transform:scale(1.12);}100%{transform:scale(1);}}
.shelf-empty{font-size:12px;color:#909090;padding:16px 4px;line-height:1.7;font-family:var(--font-ui);}
.coll-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;}
.coll-item{
  background:linear-gradient(#fffdf5,#efe8d8);padding:5px;text-align:center;cursor:pointer;
  border:2px solid;border-color:#fff #8a7a55 #8a7a55 #fff;
}
.coll-item img{width:100%;height:62px;object-fit:contain;display:block;
  filter:drop-shadow(2px 2px 0 rgba(0,0,0,.18));}
.coll-item .ci-name{font-size:11px;color:#403020;margin-top:3px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--font-ui);}
.coll-item .ci-n{font-family:var(--font-mono);font-size:10px;color:#8a6a20;}
.coll-detail{text-align:center;margin:10px auto;width:460px;max-width:100%;}
.coll-detail img{max-width:100%;max-height:240px;object-fit:contain;
  filter:drop-shadow(3px 3px 0 rgba(0,0,0,.2));}
.coll-detail .cd-name{font-family:var(--font-ui);font-size:14px;font-weight:bold;color:#000;margin-top:8px;}
.coll-detail .cd-meta{font-size:12px;color:#606060;margin-top:5px;line-height:1.7;font-family:var(--font-ui);}

/* 被贴纸替换掉的 emoji */
.emo-img{
  width:1.15em;height:1.15em;object-fit:contain;display:inline-block;
  vertical-align:-.2em;pointer-events:none;
}
.emo-img.is-sm{width:.9em;height:.9em;vertical-align:-.12em;}
.emo-img.is-lg{width:1.5em;height:1.5em;vertical-align:-.32em;}
.emo-img.is-xl{width:2em;height:2em;vertical-align:-.5em;}
.ui-skin{display:inline;}

/* ── POMODORO ── */
.pomo-panel{
  display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:3px 8px;
  background:var(--win-gray);
  border:2px solid;border-color:var(--win-darker) var(--win-white) var(--win-white) var(--win-darker);
  min-width:180px;flex-shrink:0;
}
.pomo-display{font-family:"Courier New",monospace;font-size:18px;color:#cc0000;letter-spacing:2px;font-weight:bold;}
.pomo-display.running{color:#008000;}
.pomo-task-name{font-size:10px;color:#444;max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--font-ui);}
.pomo-btns{display:flex;gap:2px;flex-wrap:wrap;justify-content:center;max-width:190px;}
.pomo-btn{
  font-family:var(--font-ui);font-size:11px;
  padding:2px 6px;
  background:var(--win-gray);color:#000;
  border:2px solid;border-color:var(--win-white) var(--win-darker) var(--win-darker) var(--win-white);
  cursor:pointer;
}
.pomo-btn:hover{background:var(--win-light);}
.pomo-btn:active{border-color:var(--win-darker) var(--win-white) var(--win-white) var(--win-darker);}
.pomo-btn.active{background:#000080;color:#fff;border-color:var(--win-darker) var(--win-white) var(--win-white) var(--win-darker);}
.pomo-notify{font-size:10px;color:#444;font-family:var(--font-ui);}

/* ══════════════════════════════════════
   TABS — Win95 탭 스타일
   ══════════════════════════════════════ */
.tabs{
  display:flex;flex-wrap:nowrap;overflow-x:auto;
  touch-action:pan-x;
  background:var(--win-gray);
  border-bottom:2px solid var(--win-darker);
  padding:2px 4px 0;gap:1px;flex-shrink:0;
}
.tabs::-webkit-scrollbar{height:0;}
.tab{
  font-family:var(--font-ui);font-size:12px;
  padding:3px 10px 4px;cursor:pointer;
  background:var(--win-gray);color:#000;
  border:2px solid;
  border-color:var(--win-white) var(--win-darker) transparent var(--win-white);
  white-space:nowrap;flex-shrink:0;
  margin-bottom:-2px;user-select:none;
}
.tab:hover:not(.active){background:var(--win-light);}
.tab.active{
  background:var(--win-gray);font-weight:bold;
  border-color:var(--win-white) var(--win-darker) var(--win-gray) var(--win-white);
  z-index:1;position:relative;
}

/* ══════════════════════════════════════
   CONTENT AREA
   ══════════════════════════════════════ */
.content{flex:1;overflow:hidden;background:var(--win-gray);}
.section{display:none;height:100%;overflow-y:auto;padding:8px;}
.section.active{display:block;}

/* ══════════════════════════════════════
   BUTTONS
   ══════════════════════════════════════ */
.pxl-btn{
  font-family:var(--font-ui);font-size:12px;
  padding:3px 10px;
  background:var(--win-gray);color:#000;
  border:2px solid;border-color:var(--win-white) var(--win-darker) var(--win-darker) var(--win-white);
  cursor:pointer;white-space:nowrap;
}
.pxl-btn:hover{background:var(--win-light);}
.pxl-btn:active{border-color:var(--win-darker) var(--win-white) var(--win-white) var(--win-darker);transform:translate(1px,1px);}
.pxl-btn.primary{background:#000080;color:#fff;}
.pxl-btn.primary:hover{background:#0000a8;}
.pxl-btn.danger{color:#cc0000;}

/* ── inputs ── */
.search-bar,.form-input,.form-textarea{
  background:#fff;color:#000;
  border:2px solid;border-color:var(--win-darker) var(--win-white) var(--win-white) var(--win-darker);
  padding:4px 8px;font-family:var(--font-ui);font-size:13px;outline:none;
  width:440px;max-width:100%;display:block;
}
.search-bar::placeholder,.form-input::placeholder{color:#808080;}
.search-bar:focus,.form-input:focus,.form-textarea:focus{outline:1px dotted #000;outline-offset:-3px;}
.form-textarea{resize:vertical;}
.form-select{
  background:#fff;color:#000;
  border:2px solid;border-color:var(--win-darker) var(--win-white) var(--win-white) var(--win-darker);
  padding:2px 4px;font-family:var(--font-ui);font-size:13px;outline:none;
}

/* ── toolbar ── */
.toolbar{
  display:flex;gap:4px;margin-bottom:6px;flex-wrap:wrap;align-items:center;
}

/* ══════════════════════════════════════
   MODAL — Win95 대화창
   ══════════════════════════════════════ */
.overlay{
  display:none;position:fixed;inset:0;
  background:rgba(0,0,0,.4);
  z-index:100;align-items:center;justify-content:center;padding:16px;
}
.overlay.open{display:flex;}
.modal{
  background:var(--win-gray);
  border:3px solid;border-color:var(--win-white) var(--win-darker) var(--win-darker) var(--win-white);
  width:100%;max-width:480px;max-height:90vh;overflow-y:auto;position:relative;
  box-shadow:2px 2px 0 #000;
}
.modal-title{
  background:linear-gradient(90deg,#000080,#1084d0);
  color:#fff;font-family:var(--font-ui);font-size:12px;font-weight:bold;
  padding:3px 6px;
  display:flex;align-items:center;gap:6px;
}
.modal > .close-btn{
  position:absolute;top:3px;right:4px;
  background:var(--win-gray);
  border:2px solid;border-color:var(--win-white) var(--win-darker) var(--win-darker) var(--win-white);
  color:#000;font-size:10px;cursor:pointer;font-weight:bold;
  width:16px;height:14px;display:flex;align-items:center;justify-content:center;
  font-family:var(--font-ui);
}
.modal > .close-btn:hover{background:#c0c0c0;}
.modal > .close-btn:active{border-color:var(--win-darker) var(--win-white) var(--win-white) var(--win-darker);}
.form-row{margin:8px auto 0;width:460px;max-width:100%;}
.form-label{font-size:12px;color:#000;display:block;margin-bottom:3px;font-family:var(--font-ui);width:440px;max-width:100%;}
.modal .form-select{width:440px;max-width:100%;display:block;}
.modal-btns{display:flex;gap:6px;margin:10px auto;width:460px;max-width:100%;justify-content:flex-end;}

/* 宽弹窗（写卡片用）：内容跟着窗口撑满 */
.modal.wide{display:flex;flex-direction:column;}
.modal.wide .form-row{width:auto;max-width:none;margin:8px 16px 0;}
.modal.wide .form-label{width:auto;max-width:none;}
.modal.wide .modal-btns{width:auto;max-width:none;margin:10px 16px;}
.modal.wide #cardBodyRow{flex:1;display:flex;flex-direction:column;min-height:0;}
.modal.wide #cardBody{flex:1;width:100%;box-sizing:border-box;}

/* ── 专注模式：单任务大屏，屏蔽其它干扰 ── */
.focus-overlay{background:rgba(0,0,0,.72);}
.focus-modal{max-width:600px;}
.focus-task-name{font-size:18px;font-weight:bold;color:#000080;text-align:center;font-family:var(--font-ui);margin-top:4px;word-break:break-word;}
.focus-timer{
  font-family:'Courier New',monospace;font-size:52px;font-weight:bold;color:#cc0000;
  letter-spacing:3px;text-align:center;margin:6px 0;
}
.focus-hint{font-size:11px;color:#909090;text-align:center;margin-bottom:6px;font-family:var(--font-ui);}

/* ── 任务清理弹窗：危险区做得显眼一点，避免误触 ── */
.cleanup-safe{
  font-size:11px;color:#004000;line-height:1.7;background:#e4f0e4;
  border-left:3px solid #008000;padding:6px 8px;margin-bottom:10px;
}
.cleanup-danger{
  margin-top:14px;padding:8px;background:#fff4f4;
  border:2px solid #cc0000;
}
.cleanup-danger-title{font-size:12px;font-weight:bold;color:#cc0000;margin-bottom:5px;font-family:var(--font-ui);}
#cleanupDoBtn:disabled{opacity:.45;cursor:not-allowed;}
#cleanupDoBtn:not(:disabled){background:#cc0000;color:#fff;font-weight:bold;}

/* ══════════════════════════════════════
   TASKS
   ══════════════════════════════════════ */
.task-list{display:flex;flex-direction:column;gap:4px;}
.task-card{
  background:#fff;
  border:2px solid;border-color:var(--win-white) var(--win-darker) var(--win-darker) var(--win-white);
  border-left:4px solid #000080;
  padding:5px 8px;
}
.task-card[draggable="true"]{cursor:grab;}
.task-card.task-dragging{opacity:.35;}
.task-card.task-drag-over{outline:2px dashed #000080;outline-offset:-2px;}
.task-top{display:flex;align-items:flex-start;gap:6px;}
.task-check{
  width:13px;height:13px;
  border:2px solid;border-color:var(--win-darker) var(--win-white) var(--win-white) var(--win-darker);
  flex-shrink:0;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  margin-top:1px;font-size:9px;background:#fff;
}
.task-check.checked{background:#a0a0a0;color:#fff;border-color:#808080;}
.task-card.done-task{background:#f2f2f2;border-left-color:#a0a0a0 !important;}
.task-card.done-task .task-title{color:#909090;}
.task-card.done-task .task-note-editable{color:#a0a0a0;}
.task-title-wrap{flex:1;min-width:0;}
.task-title{font-size:13px;color:#000;word-break:break-word;font-family:var(--font-ui);}
.task-title.done-text{text-decoration:line-through;color:#808080;}
.task-meta{font-size:11px;color:#808080;margin-top:1px;font-family:var(--font-ui);}
.task-actions{display:flex;gap:1px;flex-shrink:0;}
.icon-btn{
  background:var(--win-gray);border:2px solid;border-color:var(--win-white) var(--win-darker) var(--win-darker) var(--win-white);
  color:#000;cursor:pointer;font-size:11px;padding:1px 4px;font-family:var(--font-ui);
}
.icon-btn:hover{background:var(--win-light);}
.icon-btn:active{border-color:var(--win-darker) var(--win-white) var(--win-white) var(--win-darker);}
/* ── 项目进度条：已完成段 + 番茄钟段 ── */
.prog-row{display:flex;align-items:center;gap:8px;margin:6px 0 2px;}
.prog-wrap{
  display:flex;flex:1;max-width:360px;height:12px;background:#fff;overflow:hidden;
  border:2px solid;border-color:var(--win-darker) var(--win-white) var(--win-white) var(--win-darker);
}
.prog-seg-done{height:100%;background:#000080;transition:width .3s;flex-shrink:0;}
.prog-seg-pomo{height:100%;background:#7fa8d9;transition:width .3s;flex-shrink:0;}
.prog-pct{
  font-family:var(--font-mono);font-size:12px;font-weight:bold;color:#000080;
  min-width:40px;text-align:right;
}
.prog-legend{font-size:11px;color:#707070;font-family:var(--font-ui);white-space:nowrap;}

/* ── 项目自定义设置行（目标时长 / 权重） ── */
.proj-cfg{
  display:flex;align-items:center;gap:6px;flex-wrap:wrap;
  background:var(--surface2);padding:4px 8px;margin:0 0 4px;
  border-left:3px solid #000080;font-family:var(--font-ui);font-size:11px;color:#000080;
}
.proj-cfg input{
  width:56px;background:#fff;color:#000;font-family:var(--font-mono);font-size:12px;
  border:2px solid;border-color:var(--win-darker) var(--win-white) var(--win-white) var(--win-darker);
  padding:1px 4px;outline:none;
}
.proj-cfg .sep{width:1px;height:14px;background:var(--win-dark);margin:0 2px;}

/* ── 任务卡上的番茄钟条 ── */
.pomo-strip{display:flex;align-items:center;gap:6px;margin-top:4px;}
.pomo-ico{font-size:11px;flex-shrink:0;}
.pomo-mini{
  flex:1;max-width:150px;height:8px;background:#fff;
  border:2px solid;border-color:var(--win-darker) var(--win-white) var(--win-white) var(--win-darker);
  overflow:hidden;
}
.pomo-mini-fill{height:100%;background:#7fa8d9;transition:width .3s;}
.pomo-mini-fill.done{background:#a0a0a0;}
.pomo-strip-txt{font-family:var(--font-mono);font-size:11px;color:#707070;white-space:nowrap;}
.pomo-goal{color:#000080;cursor:pointer;border-bottom:1px dotted #000080;}
.pomo-goal:hover{background:#000080;color:#fff;}
.pomo-live{
  font-size:10px;color:#008000;background:#e4f0e4;padding:0 4px;
  border:1px solid #008000;font-family:var(--font-ui);
}

/* ── 任务卡：大号进度条 + 时间轴打点（目标时长 与 自我觉察 的平衡区） ── */
.tl-widget{margin-top:6px;}
.tl-bar-row{display:flex;align-items:center;gap:6px;}
.tl-bar{
  position:relative;flex:1;max-width:none;height:18px;background:#fff;
  border:2px solid;border-color:var(--win-darker) var(--win-white) var(--win-white) var(--win-darker);
  overflow:visible;cursor:crosshair;
}
.tl-bar-fill{position:absolute;left:0;top:0;bottom:0;height:100%;background:#7fa8d9;transition:width .3s;}
.tl-bar-fill.done{background:#a0a0a0;}
.tl-mark{
  position:absolute;top:-3px;width:10px;height:24px;margin-left:-5px;
  background:#ff9900;border:1px solid #804d00;cursor:pointer;z-index:2;
  clip-path:polygon(50% 0%,100% 30%,100% 100%,0% 100%,0% 30%);
}
.tl-mark:hover{background:#ffb84d;}
.tl-mark.imported{background:#a0a0a0;border-color:#707070;}
.tl-mark.has-img{
  width:18px;height:18px;margin-left:-9px;top:-4px;
  background-color:transparent;background-size:contain;background-repeat:no-repeat;background-position:center;
  border:none;clip-path:none;
}
.tl-mark.has-img.imported{filter:grayscale(1) opacity(.55);}
.tl-add-row{display:flex;gap:6px;margin-top:4px;flex-wrap:wrap;}
.tl-mark-btn{font-size:11px;}
.tl-draft{
  margin-top:4px;padding:6px;background:#fffff0;
  border:2px solid;border-color:var(--win-darker) var(--win-white) var(--win-white) var(--win-darker);
}
.tl-draft-meta{font-size:11px;color:#000080;font-weight:bold;margin-bottom:3px;font-family:var(--font-ui);}
.tl-draft-text{width:100%;min-height:52px;resize:vertical;box-sizing:border-box;font-size:12px;}
.tl-draft-btns{display:flex;justify-content:flex-end;gap:6px;margin-top:4px;}
.tl-list{margin-top:6px;display:flex;flex-direction:column;gap:4px;max-height:220px;overflow-y:auto;padding-right:2px;}
.tl-item{
  display:flex;align-items:flex-start;gap:6px;padding:4px 6px;
  background:var(--surface2);border-left:3px solid #ff9900;
}
.tl-item.imported{border-left-color:#a0a0a0;opacity:.75;}
.tl-item-body{flex:1;min-width:0;}
.tl-item-meta{font-size:10px;color:#808080;font-family:var(--font-mono);}
.tl-item-text{font-size:12px;color:#000;white-space:pre-wrap;word-break:break-word;cursor:text;}
.tl-item-text:empty:before{content:'（点击补充想法/自我调节记录…）';color:#b4b4b4;font-style:italic;}
.tl-item-actions{display:flex;gap:1px;flex-shrink:0;}

/* ── 任务卡上的番茄格子表 ── */
.pg-icon{display:inline-block;vertical-align:-1px;}
.pomo-grid-wrap{
  margin-top:6px;padding:6px;background:#f4f4f4;
  border:2px solid;border-color:var(--win-darker) var(--win-white) var(--win-white) var(--win-darker);
}
.pomo-grid-hd{
  display:flex;align-items:center;gap:6px;flex-wrap:wrap;
  font-family:var(--font-ui);font-size:11px;color:#404040;margin-bottom:5px;
}
.pomo-grid-hd .pg-count{font-family:var(--font-mono);color:#000080;font-weight:bold;}
.pomo-grid-hd .pg-tip{color:#909090;font-size:10px;}
.pg-slot-btn{
  width:18px;height:18px;line-height:1;padding:0;cursor:pointer;
  background:var(--win-gray);font-family:var(--font-mono);font-size:11px;
  border:2px solid;border-color:var(--win-white) var(--win-darker) var(--win-darker) var(--win-white);
}
.pg-slot-btn:active{border-color:var(--win-darker) var(--win-white) var(--win-white) var(--win-darker);}
/* 格子大小统一由 --pcell 控制，头部的 ⤢ 按钮循环切换 */
.pomo-grid-wrap{--pcell:68px;}
.pomo-grid-wrap[data-psz="s"]{--pcell:48px;}
.pomo-grid-wrap[data-psz="m"]{--pcell:68px;}
.pomo-grid-wrap[data-psz="l"]{--pcell:88px;}
.pomo-grid-wrap[data-psz="xl"]{--pcell:112px;}
.pomo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--pcell),1fr));gap:5px;}
.pomo-cell{
  position:relative;height:var(--pcell);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:2px;cursor:pointer;background:#fff;overflow:hidden;
  border:2px solid;border-color:var(--win-white) var(--win-darker) var(--win-darker) var(--win-white);
}
.pomo-cell .pg-t{font-size:calc(var(--pcell) * .40);line-height:1;}
.pomo-cell .pg-m{
  font-family:var(--font-mono);font-size:calc(9px + var(--pcell) * .012);
  color:#707070;line-height:1;
}
/* 格子底图（可在贴纸库里换成自己的图） */
.pomo-cell{background-size:100% 100%;background-repeat:no-repeat;background-position:center;}
.pomo-cell.filled.has-skin{background-color:transparent;border-color:transparent;}
.pomo-cell.empty.has-skin{background-color:transparent;border-color:transparent;}
.pomo-cell.live.has-skin{background-color:transparent;border-color:transparent;}
.pomo-grid-wrap.has-headskin .pomo-grid-hd{
  background-size:100% 100%;background-repeat:no-repeat;
}

/* 自己抠的透明底贴纸 */
.pg-img{
  width:calc(var(--pcell) * .70);height:calc(var(--pcell) * .58);
  object-fit:contain;display:block;pointer-events:none;
  image-rendering:auto;filter:drop-shadow(1px 1px 0 rgba(0,0,0,.18));
}
.pomo-cell.empty{background:#e8e8e8;color:#b0b0b0;font-size:calc(var(--pcell) * .28);}
.pomo-cell.empty:hover{background:#fff;color:#000080;}
.pomo-cell.empty .pg-img{opacity:.16;filter:grayscale(1);}
.pomo-cell.empty:hover .pg-img{opacity:.34;filter:grayscale(.4);}
.pomo-cell.empty .pg-plus{
  position:absolute;right:3px;bottom:2px;font-family:var(--font-mono);
  font-size:11px;color:#b0b0b0;line-height:1;
}
.pomo-cell.empty:hover .pg-plus{color:#000080;}
.pomo-cell.filled{background:#fffaf5;}
.pomo-cell.filled:hover{border-color:#cc0000;}
.pomo-cell.part .pg-t,.pomo-cell.part .pg-img{opacity:.5;}
.pomo-cell.live{background:#e4f0e4;border-color:#008000;color:#008000;}

/* ── 贴纸库（自己抠的透明底图，存本机） ── */
.stk-body{margin:8px auto 0;width:460px;max-width:100%;font-family:var(--font-ui);}
.stk-drop{
  border:2px dashed var(--win-dark);background:#fff;padding:14px 10px;text-align:center;
  font-size:12px;color:#404040;
}
.stk-drop.over{border-color:#000080;background:#eaf0fb;}
.stk-hint{font-size:11px;color:#909090;margin-top:6px;line-height:1.5;}
.stk-bar{
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  font-size:11px;color:#404040;margin:8px 0 5px;
}
.stk-bar .stk-tip{color:#909090;}
.stk-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:6px;
  max-height:44vh;overflow-y:auto;padding:2px;
}
.stk-item{
  position:relative;background:#fff;padding:4px 3px 3px;text-align:center;cursor:pointer;
  border:2px solid;border-color:var(--win-white) var(--win-darker) var(--win-darker) var(--win-white);
}
.stk-item:hover{background:#fffaf5;}
.stk-item img{width:100%;height:52px;object-fit:contain;display:block;pointer-events:none;}
.stk-item .stk-name{
  font-size:10px;color:#606060;margin-top:2px;line-height:1.2;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.stk-item .stk-del{
  position:absolute;top:1px;right:1px;width:15px;height:14px;line-height:1;
  background:var(--win-gray);color:#000;font-size:9px;cursor:pointer;
  border:2px solid;border-color:var(--win-white) var(--win-darker) var(--win-darker) var(--win-white);
}
.stk-item .stk-del:hover{background:#cc0000;color:#fff;}
.stk-empty{font-size:12px;color:#909090;padding:14px 4px;text-align:center;line-height:1.6;}
.stk-tabs{display:flex;gap:3px;flex-wrap:wrap;margin-top:8px;}
.stk-tabs button{
  font-family:var(--font-ui);font-size:11px;padding:3px 9px;cursor:pointer;
  background:var(--win-gray);color:#000;
  border:2px solid;border-color:var(--win-white) var(--win-darker) var(--win-darker) var(--win-white);
}
.stk-tabs button.on{
  background:#000080;color:#fff;font-weight:bold;
  border-color:var(--win-darker) var(--win-white) var(--win-white) var(--win-darker);
}
.stk-item.off{opacity:.4;}
.stk-item.off::after{
  content:"停用";position:absolute;left:2px;bottom:16px;font-size:9px;
  background:#808080;color:#fff;padding:0 3px;
}
.stk-src{
  position:absolute;top:1px;left:1px;font-size:9px;padding:0 3px;line-height:14px;
  background:#000080;color:#fff;font-family:var(--font-ui);
}
.stk-src.local{background:#008000;}
.stk-ops{display:flex;gap:2px;justify-content:center;margin-top:2px;}
.stk-ops button{
  flex:1;font-size:9px;line-height:14px;padding:0;cursor:pointer;
  background:var(--win-gray);color:#000;font-family:var(--font-ui);
  border:2px solid;border-color:var(--win-white) var(--win-darker) var(--win-darker) var(--win-white);
}
.stk-ops button:hover{background:var(--win-light);}
.stk-note{font-size:11px;color:#606060;line-height:1.6;margin:6px 0 0;}

/* ── 贴纸库：总库分配（多柜子归属）、拖拽指示 ── */
.stk-item .stk-name{cursor:text;}
.stk-item[draggable="true"]{cursor:grab;}
.stk-item.stk-dragging{opacity:.4;}
.stk-tabs button.stk-tab-drop{outline:2px dashed #000080;outline-offset:1px;background:#eaf0fb;}
.stk-cat-chips{display:flex;flex-wrap:wrap;gap:2px;justify-content:center;margin-top:2px;}
.stk-chip{
  font-size:8px;line-height:12px;padding:0 3px;background:#000080;color:#fff;
  font-family:var(--font-ui);white-space:nowrap;
}
.stk-chip.empty{background:#a0a0a0;}
.stk-chip.add{background:var(--win-gray);color:#000;cursor:pointer;border:1px solid var(--win-dark);}
.stk-chip.add:hover{background:var(--win-light);}
.stk-chip-x{cursor:pointer;margin-left:2px;}
.stk-chip-x:hover{color:#ffcccc;}
.stk-assign-menu{
  display:flex;flex-direction:column;gap:2px;margin-top:2px;padding:3px;
  background:#fffff0;border:2px solid;border-color:var(--win-darker) var(--win-white) var(--win-white) var(--win-darker);
}
.stk-assign-menu button{
  font-size:9px;padding:2px 3px;cursor:pointer;background:var(--win-gray);color:#000;
  border:1px solid var(--win-dark);font-family:var(--font-ui);text-align:left;
}
.stk-assign-menu button:hover{background:var(--win-light);}
.stk-assign-menu button:disabled{opacity:.4;cursor:default;background:#000080;color:#fff;}

/* ── 自定义 CSS 实验室 ── */
.css-lab{margin:8px auto 0;width:460px;max-width:100%;font-family:var(--font-ui);}
.css-lab textarea{
  width:100%;height:190px;background:#fff;color:#000;font-family:var(--font-mono);
  font-size:12px;line-height:1.5;padding:6px;outline:none;resize:vertical;
  border:2px solid;border-color:var(--win-darker) var(--win-white) var(--win-white) var(--win-darker);
}
.css-lab .css-tip{font-size:11px;color:#707070;line-height:1.7;margin-top:6px;}
.css-lab .css-tip code{
  background:#eee;padding:0 3px;font-family:var(--font-mono);font-size:11px;color:#000080;
}
.css-lab .css-bar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:6px;}
.css-lab .css-state{font-size:11px;color:#008000;}

/* ── 任务卡上的能量标签（字号跟随各自标签的设置） ── */
/* 这个状态下已经绑定了几条 Log */
.etag-n{
  font-family:var(--font-mono);font-size:9px;font-weight:bold;line-height:12px;
  min-width:12px;padding:0 2px;text-align:center;
  background:rgba(0,0,0,.55);color:#fff;
}
.etag-n.zero{background:rgba(0,0,0,.2);}

/* ── 状态标签选择浮层（任务卡 / Log 条目共用） ── */
.tagpop{
  position:fixed;z-index:320;display:none;width:250px;padding:4px;
  background:var(--win-gray);box-shadow:2px 2px 0 #000;
  border:2px solid;border-color:var(--win-white) var(--win-darker) var(--win-darker) var(--win-white);
  font-family:var(--font-ui);font-size:12px;color:#000;
}
.tagpop.open{display:block;}
.tagpop-search{
  width:100%;box-sizing:border-box;font-family:var(--font-ui);font-size:12px;
  padding:3px 5px;background:#fff;color:#000;outline:none;
  border:2px solid;border-color:var(--win-darker) var(--win-white) var(--win-white) var(--win-darker);
}
.tagpop-list{max-height:210px;overflow-y:auto;margin-top:4px;}
.tagpop-row{
  display:flex;align-items:center;gap:6px;padding:3px 4px;cursor:pointer;
}
.tagpop-row:hover{background:#000080;color:#fff;}
.tagpop-row.on{background:var(--win-light);}
.tagpop-row.on:hover{background:#000080;color:#fff;}
.tagpop-dot{
  width:14px;height:14px;flex-shrink:0;
  border:2px solid;border-color:var(--win-white) var(--win-darker) var(--win-darker) var(--win-white);
}
.tagpop-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.tagpop-n{font-family:var(--font-mono);font-size:10px;opacity:.7;}
.tagpop-ck{width:12px;text-align:center;font-weight:bold;}
.tagpop-empty{font-size:11px;color:#606060;padding:6px 4px;line-height:1.5;}
.tagpop-hint{font-size:10px;color:#606060;padding:3px 4px 1px;line-height:1.4;}

/* Log 弹窗里的一排状态标签，点一下就绑定 */
.jtagchips{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin-top:5px;}
.jtagchip{
  font-size:11px;font-weight:bold;padding:1px 6px;cursor:pointer;user-select:none;
  border:2px solid;border-color:var(--win-white) var(--win-darker) var(--win-darker) var(--win-white);
  font-family:var(--font-ui);opacity:.55;
}
.jtagchip:hover{opacity:.85;}
.jtagchip.on{opacity:1;border-color:var(--win-darker) var(--win-white) var(--win-white) var(--win-darker);}
/* ── 右键弹出菜单（标签改色 / 改字号） ── */
.ctx-menu{
  position:fixed;z-index:300;display:none;min-width:200px;padding:4px;
  background:var(--win-gray);box-shadow:2px 2px 0 #000;
  border:2px solid;border-color:var(--win-white) var(--win-darker) var(--win-darker) var(--win-white);
  font-family:var(--font-ui);font-size:12px;color:#000;
}
.ctx-menu.open{display:block;}
.ctx-title{
  background:linear-gradient(90deg,#000080,#1084d0);color:#fff;
  font-size:11px;font-weight:bold;padding:2px 6px;margin:-4px -4px 4px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.ctx-row{display:flex;align-items:center;gap:4px;padding:3px 4px;flex-wrap:wrap;}
.ctx-label{font-size:11px;color:#000080;min-width:30px;}
.ctx-sw{
  width:16px;height:16px;cursor:pointer;flex-shrink:0;
  border:2px solid;border-color:var(--win-white) var(--win-darker) var(--win-darker) var(--win-white);
}
.ctx-sw:hover{outline:1px solid #000;outline-offset:1px;}
.ctx-sw.sel{outline:2px solid #000;outline-offset:1px;}
.ctx-custom{
  position:relative;display:inline-block;width:16px;height:16px;cursor:pointer;flex-shrink:0;
  border:2px solid;border-color:var(--win-white) var(--win-darker) var(--win-darker) var(--win-white);
  background:linear-gradient(135deg,#ff0000,#ffff00 25%,#00ff00 50%,#00ffff 70%,#0000ff 85%,#ff00ff);
}
.ctx-custom input{position:absolute;left:0;top:0;width:100%;height:100%;opacity:0;padding:0;border:0;margin:0;cursor:pointer;}
.ctx-sep{height:0;border-top:1px solid var(--win-dark);border-bottom:1px solid var(--win-white);margin:4px 0;}
.ctx-item{padding:3px 6px;cursor:pointer;}
.ctx-item:hover{background:#000080;color:#fff;}
.ctx-item.danger{color:#cc0000;}
.ctx-item.danger:hover{background:#cc0000;color:#fff;}
.ctx-hint{font-size:10px;color:#606060;padding:2px 4px 1px;}
.wt-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;padding:2px;}
.wt-btn{
  background:var(--win-gray);color:#000;cursor:pointer;
  border:2px solid;border-color:var(--win-white) var(--win-darker) var(--win-darker) var(--win-white);
  font-family:var(--font-mono);font-size:12px;padding:3px 0;
}
.wt-btn:hover{background:var(--win-light);}
.wt-btn:active{border-color:var(--win-darker) var(--win-white) var(--win-white) var(--win-darker);}
.wt-btn.sel{background:#000080;color:#fff;font-weight:bold;border-color:#000080;}

/* ── 任务权重 ── */
.task-weight{
  background:var(--win-gray);color:#606060;cursor:pointer;
  border:2px solid;border-color:var(--win-white) var(--win-darker) var(--win-darker) var(--win-white);
  font-family:var(--font-mono);font-size:10px;padding:0 4px;
}
.task-weight:hover{background:var(--win-light);}
.task-weight.set{color:#fff;background:#000080;border-color:#000080;font-weight:bold;}

.pxl-btn.on{background:#000080;color:#fff;}
.pxl-btn.on:hover{background:#0000a8;}

/* ── 任务工具栏：让输入框与按钮等高对齐 ── */
#sec-tasks .toolbar{gap:6px;align-items:stretch;}
#sec-tasks .toolbar .search-bar,
#sec-tasks .toolbar .pxl-btn{
  height:30px;display:inline-flex;align-items:center;box-sizing:border-box;
}
#sec-tasks .toolbar .pxl-btn{justify-content:center;padding:0 10px;}
/* 切换按钮固定宽度，两种状态不再抖动 */
#hideDoneBtn{width:38px;padding:0;font-size:14px;}

.task-title{cursor:text;}
.task-title-input{
  font-family:var(--font-ui);font-size:13px;color:#000;width:100%;
  background:#fff;border:2px solid;border-color:var(--win-darker) var(--win-white) var(--win-white) var(--win-darker);
  padding:1px 4px;outline:none;
}
.task-title-input:focus{outline:1px dotted #000;outline-offset:-2px;}
.task-note-editable{
  margin-top:6px;font-size:14px;color:#333;line-height:1.6;white-space:pre-wrap;
  border-left:2px solid var(--border);padding:4px 8px;outline:none;cursor:text;
  min-height:1.4em;word-break:break-word;
}
/* 空笔记只留一条细提示，不再占掉大半张卡片 */
.task-note-editable:empty{
  margin-top:3px;font-size:11px;line-height:1.3;min-height:0;padding:1px 8px;
  border-left-color:#dcdcdc;
}
.task-note-editable:empty:before{content:attr(data-placeholder);color:#b4b4b4;font-style:italic;}
.task-note-editable:focus{background:#fffff0;border-left-color:#000080;}
#energyTagBar{
  display:flex;background:var(--win-gray);
  border:2px solid;border-color:var(--win-white) var(--win-darker) var(--win-darker) var(--win-white);
  padding:5px 8px;margin-bottom:8px;align-items:center;gap:6px;flex-wrap:wrap;
}
#energyTagBar.collapsed{display:none;}
/* 长按拖动排位 */
.etag-chip{touch-action:manipulation;}
.etag-chip.dragging{opacity:.55;outline:2px dashed #000;outline-offset:1px;}
body.tag-dragging{cursor:grabbing;user-select:none;}
body.tag-dragging .etag-chip{cursor:grabbing;}
.etag-chip{
  display:inline-flex;align-items:center;gap:6px;padding:1px 6px;
  border:2px solid;border-color:var(--win-white) var(--win-darker) var(--win-darker) var(--win-white);
  color:#000;font-weight:bold;font-size:12px;
  cursor:context-menu;font-family:var(--font-ui);user-select:none;
}
.etag-chip{cursor:pointer;}
.etag-chip:active{border-color:var(--win-darker) var(--win-white) var(--win-white) var(--win-darker);}
.tagedit-colors{display:flex;flex-wrap:wrap;gap:5px;align-items:center;}
/* 字色里的「自动」格：底色是当前自动算出来的黑或白 */
.etag-auto-sw{
  display:inline-flex;align-items:center;justify-content:center;
  font-family:var(--font-mono);font-size:9px;font-weight:bold;
  color:#808080;mix-blend-mode:difference;
}
.tagedit-pv-box{
  padding:10px;background:var(--surface2);
  border:2px solid;border-color:var(--win-darker) var(--win-white) var(--win-white) var(--win-darker);
}
.task-section-hdr{
  display:flex;align-items:center;gap:6px;padding:4px 8px;margin:8px 0 4px;
  border:2px solid;border-color:var(--win-white) var(--win-darker) var(--win-darker) var(--win-white);
  color:#fff;font-family:var(--font-ui);font-size:12px;font-weight:bold;
}
.task-section-hdr.task-drag-over{outline:2px dashed #fff;outline-offset:-2px;}
.task-section-hdr .icon-btn{
  background:rgba(255,255,255,.15);color:#fff;
  border-color:rgba(255,255,255,.6) rgba(0,0,0,.4) rgba(0,0,0,.4) rgba(255,255,255,.6);
}
.task-section-hdr .icon-btn:hover{background:rgba(255,255,255,.3);}
.section-title{flex:1;cursor:text;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

/* ── Tasks: workspace layout (main list + directory sidebar) ── */
#tasks-app{display:flex;height:100%;overflow:hidden;}
.tasks-main{flex:1;min-width:0;overflow-y:auto;padding:8px;display:flex;flex-direction:column;}

.tasks-sidebar{
  width:220px;flex-shrink:0;background:var(--win-gray);
  border-right:2px solid var(--win-darker);
  display:flex;flex-direction:column;min-height:0;
}
.tasks-sidebar-head{
  background:linear-gradient(90deg,#000080,#1084d0);color:#fff;
  padding:3px 6px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;
}
.tasks-sidebar-title{font-family:var(--font-ui);font-size:12px;font-weight:bold;}
.tasks-sidebar-toggle{
  font-family:var(--font-ui);font-size:11px;line-height:1;
  background:var(--win-gray);color:#000;
  border:2px solid;border-color:var(--win-white) var(--win-darker) var(--win-darker) var(--win-white);
  cursor:pointer;padding:1px 6px;white-space:nowrap;
}
.tasks-sidebar-toggle:hover{background:var(--win-light);}
.tasks-sidebar-toggle:active{border-color:var(--win-darker) var(--win-white) var(--win-white) var(--win-darker);}
.tasks-sidebar-search{padding:4px;border-bottom:1px solid var(--win-dark);flex-shrink:0;}
.tasks-sidebar-search input{
  width:100%;font-family:var(--font-ui);font-size:11px;background:#fff;color:#000;
  border:2px solid;border-color:var(--win-darker) var(--win-white) var(--win-white) var(--win-darker);
  padding:2px 6px;outline:none;
}
.tasks-sidebar-filter{padding:3px 6px;border-bottom:1px solid var(--win-dark);flex-shrink:0;background:var(--win-light);}
.tasks-sidebar-filter label{
  display:flex;align-items:center;gap:5px;cursor:pointer;
  font-family:var(--font-ui);font-size:11px;color:#000;user-select:none;
}
.tasks-sidebar-filter input{margin:0;cursor:pointer;flex-shrink:0;}
.tasks-sidebar-tree{flex:1;overflow-y:auto;padding:4px 2px 8px;}

.tasks-sidebar-rail{
  width:24px;flex-shrink:0;background:var(--win-gray);
  border:none;border-right:2px solid var(--win-darker);cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:8px;
  padding:6px 0;color:var(--win-darker);font-family:var(--font-ui);font-size:11px;
}
.tasks-sidebar-rail:hover{background:var(--win-light);color:#000080;}
.tasks-sidebar-rail .rail-label{writing-mode:vertical-rl;letter-spacing:3px;font-weight:bold;}

/* tree rows */
.ttoc-group{display:flex;align-items:center;gap:2px;padding:2px 2px;margin-top:4px;}
.ttoc-group:first-child{margin-top:0;}
.ttoc-group-name{
  font-size:11px;font-weight:bold;color:var(--win-darker);cursor:pointer;flex:1;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.ttoc-group-name:hover{color:#000080;text-decoration:underline;}
.ttoc-group-name.muted{color:var(--win-dark);font-weight:normal;cursor:default;}
.ttoc-group-name.muted:hover{text-decoration:none;color:var(--win-dark);}
.ttoc-count{font-size:9px;color:var(--win-dark);flex-shrink:0;padding:0 2px;}
.ttoc-item{
  display:flex;align-items:center;gap:4px;cursor:pointer;
  padding:2px 4px 2px 18px;font-size:11px;color:#000;
  white-space:nowrap;overflow:hidden;
}
.ttoc-item:hover{background:#000080;color:#fff;}
.ttoc-item:hover .ttoc-dot{color:#fff;}
.ttoc-dot{font-size:9px;color:#000080;flex-shrink:0;width:10px;text-align:center;}
.ttoc-item.done .ttoc-dot{color:#008000;}
.ttoc-item.done .ttoc-item-text{color:var(--win-dark);}
.ttoc-item:hover.done .ttoc-item-text{color:#fff;}
.ttoc-item-text{flex:1;overflow:hidden;text-overflow:ellipsis;}
.ttoc-empty{padding:10px 8px;color:var(--win-dark);font-size:11px;line-height:1.5;}
.ttoc-project-item{padding-left:8px;font-weight:bold;cursor:grab;}
.ttoc-item.sel{background:#000080;color:#fff;}
.ttoc-item.sel .ttoc-dot,.ttoc-item.sel .ttoc-count{color:#fff;}
.ttoc-item.sel.done .ttoc-item-text{color:#fff;}
.ttoc-sub{margin:2px 0 6px 10px;border-left:2px solid var(--win-dark);padding-left:2px;}
.ttoc-sub .ttoc-item{padding-left:10px;}
.ttoc-sub-sec{padding:2px 0 2px 6px;margin:4px 0 2px;}
.ttoc-sub-sec span{font-size:10px;font-weight:bold;}
.ttoc-project-item.task-dragging{opacity:.35;}
.ttoc-project-item.task-drag-over{outline:2px dashed #000080;outline-offset:-2px;}

/* flash highlight when navigating from the directory */
.ttoc-flash{animation:ttocflash 1.5s ease-out;}
@keyframes ttocflash{
  0%,20%{box-shadow:0 0 0 2px #cc0000,0 0 0 5px rgba(204,0,0,.35);}
  100%{box-shadow:0 0 0 0 rgba(204,0,0,0);}
}

.dream-group-card{
  border:2px solid;border-color:var(--win-white) var(--win-darker) var(--win-darker) var(--win-white);
  margin-bottom:8px;background:#fff;
}
.dream-group-hdr{
  display:flex;align-items:center;gap:5px;padding:3px 6px;
  background:linear-gradient(90deg,#000080,#1084d0);cursor:default;
}
.dream-group-tog{cursor:pointer;font-size:11px;color:#fff;font-family:var(--font-ui);}
.dream-group-body{padding:6px;background:#fff;display:flex;flex-direction:column;gap:5px;}

/* ══════════════════════════════════════
   ENTRIES (journal / notes)
   ══════════════════════════════════════ */
.entry-card{
  background:#fff;
  border:2px solid;border-color:var(--win-darker) var(--win-white) var(--win-white) var(--win-darker);
  border-left:4px solid #000080;
  padding:6px 10px;margin-bottom:6px;
}
.entry-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:5px;}
.entry-ts{font-size:10px;color:#808080;font-family:var(--font-ui);}
.entry-body{font-size:13px;color:#000;line-height:1.6;white-space:pre-wrap;word-break:break-word;font-family:var(--font-ui);}
/* 从任务时间轴导进来的 Log：来源信息放得很淡，不抢正文 */
.entry-src{font-size:10px;color:#b0b0b0;margin-top:4px;font-family:var(--font-ui);}
.entry-img{margin-top:6px;max-width:100%;max-height:200px;border:2px solid;border-color:var(--win-darker) var(--win-white) var(--win-white) var(--win-darker);}
.tags{display:flex;flex-wrap:wrap;gap:3px;margin-top:4px;}
.tag{
  font-size:11px;background:#000080;color:#fff;
  padding:1px 6px;font-family:var(--font-ui);
  border:1px solid #000060;
}
/* 与任务卡上的状态标签同名的，直接用它的颜色，并且点一下就抽同状态的旧记录 */
.tag.state{cursor:pointer;font-weight:bold;}
.tag.state:hover{outline:1px solid #000;outline-offset:1px;}
.archive-row{display:flex;flex-wrap:wrap;gap:3px;margin-bottom:8px;}
.arch-btn{
  font-size:11px;padding:2px 7px;font-family:var(--font-ui);
  background:var(--win-gray);color:#000;
  border:2px solid;border-color:var(--win-white) var(--win-darker) var(--win-darker) var(--win-white);
  cursor:pointer;
}
.arch-btn:hover{background:var(--win-light);}
.arch-btn.selected{background:#000080;color:#fff;}

/* ══════════════════════════════════════
   SETTINGS
   ══════════════════════════════════════ */
#sec-settings{overflow-y:auto;}
.settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
@media(max-width:480px){.settings-grid{grid-template-columns:1fr;}}
.setting-card{
  background:var(--win-gray);
  border:2px solid;border-color:var(--win-darker) var(--win-white) var(--win-white) var(--win-darker);
  padding:8px;
}
.setting-title{font-size:11px;font-weight:bold;color:#000080;margin-bottom:8px;font-family:var(--font-ui);}
.color-row{display:flex;align-items:center;gap:6px;margin-bottom:6px;}
.color-label{font-size:12px;color:#000;flex:1;font-family:var(--font-ui);}

/* ══════════════════════════════════════
   FINANCE (记账理财)
   ══════════════════════════════════════ */
.fin-cur-badge{background:#c9a13b;border-color:#7a5a00;color:#fff;}
.fin-cur-badge.gbp{background:#3b6bc9;border-color:#00317a;}
.fin-totals-panel{
  background:#fff;border:2px solid;border-color:var(--win-darker) var(--win-white) var(--win-white) var(--win-darker);
  padding:8px 10px;font-size:13px;font-family:var(--font-ui);
}
.fin-totals-row{display:flex;justify-content:space-between;padding:2px 0;}
.fin-totals-row.grand{font-weight:bold;border-top:1px dashed #808080;margin-top:4px;padding-top:4px;font-size:15px;color:#000080;}
.fin-totals-row.warn{color:#cc0000;}
.fin-sub{font-size:11px;color:#555;}
.fin-type-badge{font-size:11px;padding:1px 7px;border-radius:10px;border:1px solid;vertical-align:middle;}
.fin-type-badge.income{border-color:var(--green);color:var(--green);}
.fin-type-badge.expense{border-color:#cc0000;color:#cc0000;}

/* ══════════════════════════════════════
   TOAST
   ══════════════════════════════════════ */
.toast{
  position:fixed;top:60px;right:12px;
  background:#000080;color:#fff;
  border:2px solid;border-color:var(--win-white) var(--win-darker) var(--win-darker) var(--win-white);
  padding:5px 12px;font-family:var(--font-ui);font-size:12px;
  z-index:200;pointer-events:none;box-shadow:2px 2px 0 #000;
  animation:toastIn .2s,toastOut .3s 2.2s forwards;
}
@keyframes toastIn{from{opacity:0;transform:translateX(10px);}to{opacity:1;transform:none;}}
@keyframes toastOut{to{opacity:0;}}

/* ══════════════════════════════════════
   UNDO BAR
   ══════════════════════════════════════ */
.undo-bar{
  display:none;position:fixed;bottom:10px;left:50%;transform:translateX(-50%);
  background:var(--win-gray);
  border:2px solid;border-color:var(--win-white) var(--win-darker) var(--win-darker) var(--win-white);
  box-shadow:2px 2px 0 #000;
  padding:5px 14px;font-family:var(--font-ui);font-size:12px;
  z-index:200;gap:10px;align-items:center;white-space:nowrap;
}
.undo-bar.show{display:flex;}

/* ══════════════════════════════════════
   EMPTY STATE
   ══════════════════════════════════════ */
.empty-state{text-align:center;padding:40px 20px;color:#808080;font-size:13px;font-family:var(--font-ui);}
.empty-icon{font-size:32px;margin-bottom:10px;}

/* ══════════════════════════════════════
   PWA BANNER
   ══════════════════════════════════════ */
.install-banner{
  display:none;background:#000080;border-bottom:1px solid #000040;
  padding:4px 10px;font-family:var(--font-ui);font-size:12px;color:#fff;
  align-items:center;gap:8px;flex-shrink:0;
}
.install-banner.show{display:flex;}
.install-banner button{
  font-family:var(--font-ui);font-size:11px;padding:2px 8px;
  background:var(--win-gray);color:#000;
  border:2px solid;border-color:var(--win-white) var(--win-darker) var(--win-darker) var(--win-white);
  cursor:pointer;
}

/* ══════════════════════════════════════
   CARD NOTES (Zettelkasten)
   ══════════════════════════════════════ */
#sec-notes{background:#fff;}
#sec-notes .toolbar{background:var(--win-gray);}
.card-note{
  background:#fff;
  border:2px solid;border-color:var(--win-darker) var(--win-white) var(--win-white) var(--win-darker);
  border-left:4px solid #000080;
  padding:10px 12px;margin-bottom:8px;
  font-family:var(--font-ui);color:#000;font-size:13px;line-height:1.7;
}
.card-note-type{display:none;}
.card-body{color:#000;margin-bottom:6px;white-space:pre-wrap;word-break:break-word;font-size:14px;line-height:1.8;}
.card-tags{display:flex;flex-wrap:wrap;gap:3px;margin-top:5px;}
.card-tag{
  font-size:11px;background:#000080;color:#fff;padding:1px 6px;
  border:1px solid #000060;cursor:pointer;
}
.card-tag:hover{background:#1084d0;}
.card-tag.on{background:#cc0000;border-color:#900;}
.card-actions{display:flex;gap:4px;align-items:center;margin-top:6px;border-top:1px solid #c0c0c0;padding-top:6px;flex-wrap:wrap;}
.card-action-btn{
  font-size:11px;padding:2px 7px;font-family:var(--font-ui);
  background:var(--win-gray);color:#000;
  border:2px solid;border-color:var(--win-white) var(--win-darker) var(--win-darker) var(--win-white);
  cursor:pointer;
}
.card-action-btn:hover{background:var(--win-light);}
.card-ts{font-size:10px;color:#808080;margin-left:auto;font-family:var(--font-ui);}
/* ── 随机回溯卡片 ── */
.recall-btn{
  background:linear-gradient(180deg,#f3e8ff,#dcc4f5);
  border-color:#fff #6a3a92 #6a3a92 #fff;color:#4a1d6e;font-weight:bold;
}
.recall-btn:hover{background:linear-gradient(180deg,#fff,#e9d6fb);}
.rc-card{
  position:relative;margin-bottom:16px;background:#fff;
  border:2px solid;border-color:var(--win-white) var(--win-darker) var(--win-darker) var(--win-white);
  box-shadow:3px 3px 0 rgba(74,29,110,.25);
}
.rc-head{
  display:flex;align-items:center;gap:6px;padding:4px 8px;
  background:linear-gradient(90deg,#4a1d6e,#8a4fb8);
  color:#fff;font-family:var(--font-ui);font-size:11px;font-weight:bold;letter-spacing:1px;
}
.rc-head .rc-when{margin-left:auto;font-family:var(--font-mono);font-weight:normal;opacity:.85;letter-spacing:0;}
.rc-head .rc-x{
  cursor:pointer;padding:0 5px;line-height:1;background:rgba(255,255,255,.15);
  border:1px solid rgba(255,255,255,.4);
}
.rc-head .rc-x:hover{background:#cc0000;}
.rc-body{
  padding:14px 16px 12px;font-size:16px;color:#111;line-height:1.85;
  white-space:pre-wrap;word-break:break-word;font-family:var(--font-ui);
}
.rc-quotemark{color:#b088d0;font-size:22px;line-height:0;vertical-align:-4px;margin-right:4px;}
.rc-meta{padding:0 16px 10px;}
.rc-foot{
  display:flex;align-items:center;gap:6px;flex-wrap:wrap;
  padding:7px 12px;background:#f2ecf8;border-top:1px solid #d8c8ea;
}
.rc-foot .spacer{flex:1;}
.rc-like{
  display:inline-flex;align-items:center;gap:4px;cursor:pointer;user-select:none;
  font-family:var(--font-ui);font-size:12px;color:#8a6a9a;padding:2px 8px;
  background:#fff;border:2px solid;border-color:var(--win-white) var(--win-darker) var(--win-darker) var(--win-white);
}
.rc-like:hover{background:#ffeef4;}
.rc-like.on{color:#cc0044;border-color:#cc0044;background:#fff0f5;}
.rc-like .rc-heart{font-size:13px;}
.rc-tagrow{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.rc-tool{font-size:11px;padding:1px 7px;}
.rc-edit-ta{
  width:100%;box-sizing:border-box;resize:vertical;outline:none;
  font-family:var(--font-ui);font-size:15px;line-height:1.8;color:#111;padding:8px 10px;
  background:#fffff8;border:2px solid;border-color:var(--win-darker) var(--win-white) var(--win-white) var(--win-darker);
}
.rc-replies{padding:0 12px 10px;}
.rc-rtoggle{
  font-family:var(--font-ui);font-size:12px;color:#4a1d6e;cursor:pointer;user-select:none;
  padding:4px 0;display:inline-block;
}
.rc-rtoggle:hover{text-decoration:underline;}
.rc-reply{
  background:#faf7fd;border-left:3px solid #a878d0;padding:7px 10px;margin-bottom:6px;position:relative;
}
.rc-reply .rc-rt{font-family:var(--font-mono);font-size:10px;color:#9a8aaa;margin-bottom:3px;}
.rc-reply .rc-rx{position:absolute;top:5px;right:5px;color:#cc0000;font-size:11px;}
.rc-rinput{
  width:100%;background:#fff;color:#000;padding:8px 10px;font-size:14px;line-height:1.7;
  outline:none;resize:vertical;font-family:var(--font-ui);
  border:2px solid;border-color:var(--win-darker) var(--win-white) var(--win-white) var(--win-darker);
}

/* ── HIGHLIGHTS ── */
.hl-yellow{background:#ffff80;padding:0 1px;}
.hl-green{background:#80ff80;padding:0 1px;}
.hl-pink{background:#ffb0c8;padding:0 1px;}
.hl-blue{background:#80c0ff;padding:0 1px;}
.hl-toolbar{
  display:none;position:fixed;
  background:var(--win-gray);
  border:2px solid;border-color:var(--win-white) var(--win-darker) var(--win-darker) var(--win-white);
  box-shadow:2px 2px 0 #000;
  padding:3px 4px;gap:3px;z-index:500;align-items:center;
}
.hl-toolbar.show{display:flex;}
.hl-swatch{width:16px;height:16px;cursor:pointer;border:2px solid;border-color:var(--win-white) var(--win-darker) var(--win-darker) var(--win-white);}
.hl-swatch:hover{border-color:#000;}
.hl-clear{font-size:11px;color:#cc0000;cursor:pointer;padding:0 3px;border-left:1px solid #a0a0a0;margin-left:2px;font-family:var(--font-ui);}

/* ══════════════════════════════════════
   TASKS layout
   ══════════════════════════════════════ */
#sec-tasks{padding:0;overflow:hidden;height:100%;}

/* ══════════════════════════════════════
   BOX tab
   ══════════════════════════════════════ */
#sec-box{padding:0;overflow:hidden;height:100%;}
#box-app{display:flex;height:100%;overflow:hidden;}
.btoc-folder{display:flex;align-items:center;gap:2px;padding:2px 2px;margin-top:4px;}
.btoc-folder-name{
  font-size:11px;font-weight:bold;color:var(--win-darker);cursor:text;flex:1;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.btoc-caret{
  font-size:9px;width:14px;height:14px;flex-shrink:0;padding:0;
  background:none;border:none;cursor:pointer;color:var(--win-darker);
  display:flex;align-items:center;justify-content:center;
}
.btoc-caret:hover{color:#000080;}
.btoc-file{
  display:flex;align-items:center;gap:4px;cursor:pointer;
  padding:2px 4px 2px 20px;font-size:11px;color:#000;
  white-space:nowrap;overflow:hidden;
}
.btoc-file:hover{background:#000080;color:#fff;}
.btoc-file.active{background:#000080;color:#fff;}
.btoc-file.task-dragging{opacity:.35;}
.btoc-file.task-drag-over{outline:2px dashed #000080;outline-offset:-2px;}
.btoc-folder.task-drag-over{outline:2px dashed #000080;outline-offset:-2px;background:rgba(0,0,128,.10);}
.btoc-folder.box-drop-before,.btoc-file.box-drop-before{border-top:3px solid #cc0000;}
.btoc-folder.box-drop-after,.btoc-file.box-drop-after{border-bottom:3px solid #cc0000;}
.box-root-zone{min-height:60px;}
.box-root-zone.box-root-drop{outline:2px dashed #000080;outline-offset:-4px;background:rgba(0,0,128,.07);}
.btoc-file-text{flex:1;overflow:hidden;text-overflow:ellipsis;cursor:pointer;}
.btoc-folder-name{cursor:pointer;}
.btoc-folder.task-dragging,.btoc-file.task-dragging{opacity:.35;}

/* 右键菜单（Win95 风格） */
.box-ctx-menu{
  position:fixed;z-index:9999;min-width:200px;padding:2px;
  background:var(--win-gray,#c0c0c0);
  border:2px solid;border-color:var(--win-white) var(--win-darker) var(--win-darker) var(--win-white);
  box-shadow:2px 2px 5px rgba(0,0,0,.4);font-family:var(--font-ui);
}
.box-ctx-item{
  display:flex;align-items:center;gap:7px;padding:4px 12px 4px 6px;
  font-size:12px;color:#000;cursor:pointer;white-space:nowrap;
}
.box-ctx-item:hover{background:#000080;color:#fff;}
.box-ctx-item.disabled{color:var(--win-dark);cursor:default;}
.box-ctx-item.disabled:hover{background:none;color:var(--win-dark);}
.box-ctx-ico{width:14px;text-align:center;flex-shrink:0;}
.box-ctx-sep{height:2px;margin:2px 4px;border-top:1px solid var(--win-darker);border-bottom:1px solid var(--win-white);}

.bsearch-file{
  display:flex;align-items:center;gap:4px;cursor:pointer;
  background:linear-gradient(90deg,#000080,#1084d0);color:#fff;
  font-family:var(--font-ui);font-size:11px;font-weight:bold;
  padding:3px 6px;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.bsearch-file:hover{background:#000080;}
.bsearch-file .ttoc-count{color:#c0e0ff;margin-left:auto;}
.btoc-q{padding-left:16px;}
.btoc-q.answered .ttoc-dot{color:#008000;}
.btoc-sec-row{
  display:flex;align-items:center;gap:4px;padding:3px 4px 2px;margin-top:4px;cursor:pointer;
}
.btoc-sec-row:hover{background:#000080;}
.btoc-sec-row:hover .btoc-sec-name,.btoc-sec-row:hover .ttoc-count{color:#fff;}
.btoc-sec-name{
  flex:1;font-size:11px;font-weight:bold;color:var(--win-darker);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.box-doc-titlebar{
  display:flex;align-items:center;gap:6px;margin-bottom:8px;flex-wrap:wrap;
}
.box-doc-title-input{
  font-family:var(--font-ui);font-size:14px;font-weight:bold;
  background:#fff;color:#000;flex:1;min-width:160px;
  border:2px solid;border-color:var(--win-darker) var(--win-white) var(--win-white) var(--win-darker);
  padding:3px 8px;outline:none;
}
.box-sec-hdr{
  background:#000080;color:#fff;padding:4px 10px;margin:8px 0 4px;
  display:flex;align-items:center;gap:6px;
  border:2px solid;border-color:var(--win-white) var(--win-darker) var(--win-darker) var(--win-white);
  font-family:var(--font-ui);font-size:12px;font-weight:bold;
}
.box-sec-title{flex:1;cursor:text;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.box-sec-hdr .icon-btn{
  background:rgba(255,255,255,.15);color:#fff;
  border-color:rgba(255,255,255,.6) rgba(0,0,0,.4) rgba(0,0,0,.4) rgba(255,255,255,.6);
}
.box-sec-hdr .icon-btn:hover{background:rgba(255,255,255,.3);}
.box-q-card{
  background:#fff;margin-bottom:6px;
  border:2px solid;border-color:var(--win-white) var(--win-darker) var(--win-darker) var(--win-white);
  border-left:4px solid #000080;padding:5px 8px;
}
.box-q-card.answered{border-left-color:#008000;}
.box-q-title{font-family:var(--font-ui);font-size:13px;font-weight:bold;color:#000;cursor:text;word-break:break-word;}

/* item drag reordering */
.box-drag-handle{
  font-size:11px;color:var(--win-dark);cursor:grab;padding:0 3px;
  flex-shrink:0;user-select:none;align-self:flex-start;margin-top:2px;
}
.box-drag-handle:active{cursor:grabbing;}
.box-sec-hdr .box-drag-handle{color:rgba(255,255,255,.7);margin-top:0;align-self:center;}
.box-item-dragging{opacity:.35;}
.box-drop-before{border-top:3px solid #cc0000 !important;}
.box-drop-after{border-bottom:3px solid #cc0000 !important;}

/* answers — ported from box.html: numbered exam-style blocks */
.box-field-label{font-size:10px;color:var(--win-dark);font-family:var(--font-ui);margin:6px 0 2px;font-weight:bold;}
.box-answers-list{display:flex;flex-direction:column;gap:6px;margin-bottom:4px;}
.box-answers-empty{font-size:11px;color:var(--win-dark);padding:6px 2px;}
.box-answer-block{display:flex;gap:6px;align-items:stretch;}
.box-answer-num{
  flex-shrink:0;width:26px;display:flex;align-items:center;justify-content:center;
  font-family:var(--font-ui);font-size:11px;font-weight:bold;color:#fff;background:#000080;
  border:2px solid;border-color:var(--win-white) var(--win-darker) var(--win-darker) var(--win-white);
}
.box-answer-input{
  flex:1;width:100%;font-family:var(--font-ui);font-size:13px;color:#000;
  background:#fff;border:2px solid;border-color:var(--win-darker) var(--win-white) var(--win-white) var(--win-darker);
  padding:5px 7px;outline:none;line-height:1.6;min-height:44px;
  white-space:pre-wrap;word-break:break-word;overflow-wrap:break-word;
}
.box-answer-input:focus{outline:1px dotted #000;outline-offset:-2px;}
.box-answer-input:empty:before{content:attr(data-placeholder);color:var(--win-dark);}
.box-answer-del{flex-shrink:0;align-self:flex-start;margin-top:1px;}

/* format toolbar — ported from box.html, acts on the focused answer box */
.box-main-wrap{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden;}
#boxDocHeader{flex-shrink:0;}
#boxDocHeader:not(:empty){
  padding:8px 8px 0;background:var(--surface);
  border-bottom:2px solid var(--win-darker);
}
.box-fmt-toolbar{
  padding:4px 6px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;
  background:var(--win-gray,#c0c0c0);border:2px solid;
  border-color:var(--win-white) var(--win-darker) var(--win-darker) var(--win-white);
  margin-bottom:8px;
}
.box-fmt-group{display:flex;gap:3px;align-items:center;}
.box-fmt-group-label{font-family:var(--font-ui);font-size:11px;color:var(--win-dark);margin-right:1px;white-space:nowrap;}
.box-fmt-sep{width:1px;align-self:stretch;background:var(--win-darker);margin:1px 0;flex-shrink:0;}
.box-fmt-btn{
  font-family:var(--font-ui);font-size:12px;color:#000;
  width:24px;height:22px;line-height:1;box-sizing:border-box;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  background:var(--win-gray,#c0c0c0);
  border:2px solid;border-color:var(--win-white) var(--win-darker) var(--win-darker) var(--win-white);
  cursor:pointer;padding:0;
}
.box-fmt-btn:hover{background:var(--win-light,#dfdfdf);}
.box-fmt-btn:active{border-color:var(--win-darker) var(--win-white) var(--win-white) var(--win-darker);transform:translate(1px,1px);}
.box-fmt-btn-wide{width:auto;padding:0 8px;font-size:12px;}
.box-fmt-swatch{
  width:18px;height:18px;box-sizing:border-box;flex-shrink:0;padding:0;cursor:pointer;
  border:2px solid;border-color:var(--win-white) var(--win-darker) var(--win-darker) var(--win-white);
}
.box-fmt-swatch:hover{outline:1px solid #000080;outline-offset:1px;}
.box-fmt-swatch.box-fmt-clear{
  background:
    linear-gradient(to top right, transparent calc(50% - 1px), #cc0000 calc(50% - 1px), #cc0000 calc(50% + 1px), transparent calc(50% + 1px)),
    #fff;
}

/* ══════════════════════════════════════
   CHECKIN
   ══════════════════════════════════════ */
#sec-checkin{overflow-y:auto;background:var(--win-gray);}
#ci-calendar{padding-bottom:16px;}

/* ── 面板栏（统计 / 事件 / 清单，默认全收起） ── */
#ci-panel-bar{
  display:flex;gap:6px;flex-wrap:wrap;align-items:center;
  padding:7px 10px;background:var(--surface);border-bottom:1px solid var(--border);
}
#ci-panel{background:var(--win-gray);}
#ci-panel:not(:empty){padding:8px 10px;border-bottom:1px solid var(--win-dark);}
.ci-panel-head{
  display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:6px;
  font-family:var(--font-ui);font-size:12px;color:#404040;
}

/* ── 统计条 ── */
.ci-stat-card{
  background:#fff;
  border:2px solid;border-color:var(--win-darker) var(--win-white) var(--win-white) var(--win-darker);
  padding:6px 8px;margin-bottom:6px;font-family:var(--font-ui);font-size:12px;
}
.ci-stat-head{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:4px;}
.ci-stat-name{font-weight:bold;font-size:13px;}
.ci-badge{
  display:inline-flex;align-items:center;gap:3px;
  padding:1px 6px;font-size:11px;background:var(--win-gray);
  border:1px solid var(--win-dark);
}
.ci-badge.fire{background:#ffe8c0;border-color:#c07000;color:#803000;}
.ci-badge.ok{background:#d8f0d8;border-color:#008000;color:#005000;}
.ci-bar{height:10px;background:var(--win-gray);border:1px solid var(--win-dark);position:relative;overflow:hidden;}
.ci-bar > i{display:block;height:100%;background:#000080;}
.ci-bar > i.full{background:#008000;}
.ci-makeup{display:flex;gap:4px;flex-wrap:wrap;margin-top:5px;align-items:center;}
.ci-makeup-chip{
  font-family:var(--font-ui);font-size:11px;padding:1px 6px;cursor:pointer;
  background:var(--win-gray);color:#000;
  border:2px solid;border-color:var(--win-white) var(--win-darker) var(--win-darker) var(--win-white);
}
.ci-makeup-chip:hover{background:var(--win-light);}
.ci-makeup-chip:active{border-color:var(--win-darker) var(--win-white) var(--win-white) var(--win-darker);}

/* ── 事件与清单 ── */
.ci-card{
  background:#fff;
  border:2px solid;border-color:var(--win-darker) var(--win-white) var(--win-white) var(--win-darker);
  padding:6px 8px;margin-bottom:6px;font-family:var(--font-ui);font-size:13px;
}
.ci-card-head{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:4px;}
.ci-card-name{font-weight:bold;font-size:13px;flex:1;min-width:90px;}
.ci-date-hdr{
  font-family:var(--font-ui);font-size:12px;font-weight:bold;color:#000080;
  margin:8px 0 3px;padding-bottom:2px;border-bottom:1px solid var(--win-dark);
}
.ci-date-hdr.today{color:var(--win-red);}
.ci-line{
  display:flex;align-items:flex-start;gap:6px;padding:3px 0;
  border-bottom:1px dotted #d0d0d0;
}
.ci-line:last-child{border-bottom:none;}
.ci-line.done .ci-line-text{text-decoration:line-through;color:#909090;}
.ci-line-text{flex:1;min-width:60px;font-size:13px;line-height:1.4;word-break:break-word;cursor:text;}
.ci-line-time{font-size:11px;color:#000080;flex-shrink:0;padding-top:2px;}
.ci-check{
  width:16px;height:16px;flex-shrink:0;cursor:pointer;margin-top:1px;
  background:#fff;display:flex;align-items:center;justify-content:center;
  font-size:11px;line-height:1;color:#008000;
  border:2px solid;border-color:var(--win-darker) var(--win-white) var(--win-white) var(--win-darker);
}
.ci-mini-btn{
  font-family:var(--font-ui);font-size:11px;padding:1px 5px;cursor:pointer;flex-shrink:0;
  background:var(--win-gray);color:#000;
  border:2px solid;border-color:var(--win-white) var(--win-darker) var(--win-darker) var(--win-white);
}
.ci-mini-btn:hover{background:var(--win-light);}
.ci-mini-btn:active{border-color:var(--win-darker) var(--win-white) var(--win-white) var(--win-darker);}
.ci-add-inp{
  width:100%;background:#fff;color:#000;margin-top:5px;
  border:2px solid;border-color:var(--win-darker) var(--win-white) var(--win-white) var(--win-darker);
  padding:3px 6px;font-family:var(--font-ui);font-size:12px;outline:none;
}
.ci-empty{font-family:var(--font-ui);font-size:12px;color:#606060;padding:6px 2px;}

/* ── 日历格子 ── */
.ci-cell-line{font-size:13px;line-height:1.25;display:flex;align-items:center;gap:2px;white-space:nowrap;overflow:hidden;}
.ci-cell-val{font-family:var(--font-ui);font-size:10px;color:#000080;}
.ci-cell-ev{
  font-family:var(--font-ui);font-size:10px;line-height:1.35;color:#000080;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.ci-cell-ev.done{color:#a0a0a0;text-decoration:line-through;}
.ci-cell-ev.list{color:#800080;}
.ci-cell-note{
  position:absolute;right:2px;bottom:1px;font-size:10px;line-height:1;opacity:.85;
}

/* ── 当日编辑弹窗 ── */
.ci-day-row{
  margin:8px auto 0;width:460px;max-width:100%;
  background:#fff;
  border:2px solid;border-color:var(--win-darker) var(--win-white) var(--win-white) var(--win-darker);
  padding:7px 8px;font-family:var(--font-ui);
}
.ci-day-row-top{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.ci-day-row-name{flex:1;font-size:13px;min-width:80px;}
.ci-num{
  width:70px;text-align:center;font-family:var(--font-ui);font-size:14px;
  background:#fff;color:#000;padding:3px 4px;
  border:2px solid;border-color:var(--win-darker) var(--win-white) var(--win-white) var(--win-darker);
  outline:none;
}
.ci-step-btn{
  font-family:var(--font-ui);font-size:12px;min-width:34px;padding:2px 6px;cursor:pointer;
  background:var(--win-gray);color:#000;
  border:2px solid;border-color:var(--win-white) var(--win-darker) var(--win-darker) var(--win-white);
}
.ci-step-btn:hover{background:var(--win-light);}
.ci-step-btn:active{border-color:var(--win-darker) var(--win-white) var(--win-white) var(--win-darker);}
.ci-day-hint{font-size:11px;color:#606060;margin-top:4px;}
.ci-tip{
  margin:8px auto 0;width:460px;max-width:100%;
  font-family:var(--font-ui);font-size:11px;color:#404040;
  background:var(--win-light);border:1px solid var(--win-dark);padding:5px 7px;
}

/* ══════════════════════════════════════
   SCROLLBARS — Win95 style
   ══════════════════════════════════════ */
::-webkit-scrollbar{width:16px;height:16px;}
::-webkit-scrollbar-track{background:var(--win-gray);}
::-webkit-scrollbar-thumb{
  background:var(--win-gray);
  border:2px solid;border-color:var(--win-white) var(--win-darker) var(--win-darker) var(--win-white);
}
::-webkit-scrollbar-button{
  background:var(--win-gray);
  border:2px solid;border-color:var(--win-white) var(--win-darker) var(--win-darker) var(--win-white);
  display:block;width:16px;height:16px;
}

.ci-panel{font-family:var(--font-ui);}

/* Emoji 专用字体回退——确保 emoji 始终使用系统彩色字体渲染 */
@font-face {
  font-family: 'Unifont';
  src: local('Apple Color Emoji'), local('Segoe UI Emoji'), local('Noto Color Emoji');
  unicode-range: U+1F000-1FFFF, U+2600-27FF, U+2300-23FF, U+2B00-2BFF,
                 U+E000-F8FF, U+FE00-FE0F, U+1F900-1F9FF, U+1FA00-1FAFF;
}

/* ── BOX 独立版外壳 ── */
.app{display:flex;flex-direction:column;height:100%;}
#sec-box{flex:1;min-height:0;padding:0;overflow:hidden;}
.box-file-bar{display:flex;gap:4px;align-items:center;flex-wrap:wrap;}
.box-file-btn{font-size:11px !important;padding:2px 4px !important;white-space:nowrap;}
.box-file-note{font-size:11px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

</style>
</head>
<body>
<div class="app" id="app">
    <div class="section active" id="sec-box">
      <div id="box-app">
        <!-- File directory sidebar -->
        <aside class="tasks-sidebar" id="boxSidebar">
          <div class="tasks-sidebar-head">
            <span class="tasks-sidebar-title" id="boxSidebarTitle">文件目录</span>
            <div style="display:flex;gap:4px;flex-shrink:0;">
              <button class="tasks-sidebar-toggle" id="boxLockBtn" onclick="toggleBoxLockMode()" title="开启锁定模式">🔓</button>
              <button class="tasks-sidebar-toggle" id="boxSidebarCycleBtn" onclick="boxSidebarCycle()" title="切换面板 / 收起">盒子目录 ▸</button>
            </div>
          </div>
          <div class="tasks-sidebar-search" id="boxFilesToolbar" style="display:flex;flex-wrap:wrap;gap:4px;">

function normaliseBoxFiles(){
  if(!Array.isArray(S.boxFiles)) S.boxFiles=[];
  // BOX 目录：由“位置分组”迁移到显式 parentId 树（支持任意层级 + 任意层放文件）
  // 幂等：已经有 parentId 字段的条目不再处理
  if(S.boxFiles.some(en => en && en.parentId === undefined)){
    const stack = []; // 保存当前打开的各级文件夹 {id, level}
    S.boxFiles.forEach(en=>{
      if(!en) return;
      if(en.type === 'folder'){
        const lvl = en.level || 1;
        while(stack.length && stack[stack.length-1].level >= lvl) stack.pop();
        if(en.parentId === undefined) en.parentId = stack.length ? stack[stack.length-1].id : null;
        stack.push({id: en.id, level: lvl});
      } else {
        if(en.parentId === undefined) en.parentId = stack.length ? stack[stack.length-1].id : null;
      }
      delete en.level; // 层级现在由 parentId 推导，不再单独存
    });
  }
  // 清理坏数据：父级不存在、自己指向自己、以及成环的父子关系
  {
    const ids = new Set(S.boxFiles.map(x=>x && x.id));
    S.boxFiles.forEach(en=>{
      if(!en) return;
      if(en.parentId != null && (!ids.has(en.parentId) || en.parentId === en.id)) en.parentId = null;
    });
    const byId = {}; S.boxFiles.forEach(x=>{ if(x) byId[x.id]=x; });
    S.boxFiles.forEach(en=>{
      if(!en) return;
      const seen=new Set([en.id]);
      let cur = en.parentId!=null ? byId[en.parentId] : null, n=0;
      while(cur && n++<50){
        if(seen.has(cur.id)){ en.parentId = null; break; } // 成环，拉回根目录
        seen.add(cur.id);
        cur = cur.parentId!=null ? byId[cur.parentId] : null;
      }
    });
  }
}

const IDB_NAME='mmm-box', IDB_STORE='h';
function idb(){ return new Promise((res,rej)=>{ const r=indexedDB.open(IDB_NAME,1); r.onupgradeneeded=()=>r.result.createObjectStore(IDB_STORE); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
async function idbSet(k,v){ const db=await idb(); return new Promise(r=>{ const t=db.transaction(IDB_STORE,'readwrite'); t.objectStore(IDB_STORE).put(v,k); t.oncomplete=()=>r(); t.onerror=()=>r(); }); }
async function idbGet(k){ const db=await idb(); return new Promise(r=>{ const t=db.transaction(IDB_STORE); const q=t.objectStore(IDB_STORE).get(k); q.onsuccess=()=>r(q.result); q.onerror=()=>r(null); }); }

async function writeBoundFile(){

async function readFileData(h){

function adoptFileData(d){

  const fileT = Date.parse(d.savedAt||'')||0, localT = Date.parse(S.savedAt||'')||0;
  if(fileT >= localT){
    S.boxFiles = d.boxFiles; S.nextId = Math.max(Number(S.nextId)||1, Number(d.nextId)||1); S.savedAt = d.savedAt;

  return false;
}
async function bindNewFile(){

// ══════════════════════════════════════════════════
// BOX 文件目录：显式父子关系树（像电脑文件夹一样）
// 每个条目有 parentId，文件夹和盒子都可以出现在任意层级
// ══════════════════════════════════════════════════
const BOX_MAX_DEPTH = 4;

function boxEntry(id){ return (S.boxFiles||[]).find(x=>x.id==id) || null; }
function boxChildren(parentId){
  const pid = parentId==null ? null : parentId;
  return (S.boxFiles||[]).filter(x=> (x.parentId==null?null:x.parentId) === pid);
}
// 根目录为第 1 层
function boxDepth(id){
  let d=1, e=boxEntry(id), n=0;
  while(e && e.parentId!=null && n++<20){ e=boxEntry(e.parentId); d++; }
  return d;
}
function boxDescendantIds(id){
  const out=[], seen=new Set([id]);
  (function walk(pid){
    boxChildren(pid).forEach(c=>{
      if(seen.has(c.id)) return; // 数据异常成环时直接停下，不让页面卡死
      seen.add(c.id); out.push(c.id); walk(c.id);
    });
  })(id);
  return out;
}
// 判断 ancId 是否是 id 的祖先（或它自己）——用于阻止把文件夹移进自己内部
function boxIsSelfOrAncestor(ancId, id){
  let e=boxEntry(id), n=0;
  while(e && n++<20){ if(e.id==ancId) return true; e = e.parentId!=null ? boxEntry(e.parentId) : null; }
  return false;
}
// 锁只绑定「盒子 ↔ 它的上一级文件夹」这层关系：
//   · 被固定的盒子不能移动、不能删除（离不开当前文件夹）
//   · 文件夹本身照常可以移动、改名、排序，盒子跟着一起走，关系不变
//   · 但删除文件夹会连带销毁里面被固定的盒子，所以删除仍然拦截
function boxFolderHasLockedChild(folderId){   // 直接子级里有被固定的盒子
  return boxChildren(folderId).some(c=>c.type==='file' && c.locked);
}
function boxSubtreeHasLockedFile(folderId){   // 子树任意深度有被固定的盒子
  return boxDescendantIds(folderId).some(id=>{
    const e=boxEntry(id); return e && e.type==='file' && e.locked;
  });
}
function boxFolderFileCount(folderId){
  return boxDescendantIds(folderId).filter(id=>{
    const e=boxEntry(id); return e && e.type==='file';
  }).length;
}
function boxCanMove(en){
  return !!en && !(en.type==='file' && en.locked);
}
function boxCanDelete(en){
  if(!en) return false;
  return en.type==='file' ? !en.locked : !boxSubtreeHasLockedFile(en.id);
}

function renderBoxFilesTree(tree){
  const lockBtn = document.getElementById('boxLockBtn');

    lockBtn.textContent = _boxLockMode ? '🔒' : '🔓';
    lockBtn.style.background = _boxLockMode ? '#ffff00' : '';
    lockBtn.title = _boxLockMode ? '锁定模式已开启：点击盒子上的锁固定/解锁' : '开启锁定模式';
  }
  if(!(S.boxFiles||[]).length){
