    return;
  }
  tree.innerHTML = boxRenderLevel(null, 0)
    + '<div class="box-root-zone" oncontextmenu="boxCtxMenuRoot(event)"'
    + ' ondragover="boxRootDragOver(event)" ondragleave="boxRootDragLeave(event)" ondrop="boxRootDrop(event)"></div>';
}

function boxRenderLevel(parentId, depth, seen){
  seen = seen || new Set();
  if(depth > 12) return ''; // 兜底：数据异常时不至于无限递归
  let html='';
  boxChildren(parentId).forEach(en=>{
    if(seen.has(en.id)) return;
    seen.add(en.id);
    const pad = 4 + depth*13;
    if(en.type==='folder'){
      const locked = boxFolderHasLockedChild(en.id);
      const caret = en.collapsed ? '▶' : '▼';
      const kids = boxChildren(en.id).length;
      html += '<div class="btoc-folder" style="padding-left:'+pad+'px;"'
        + ' oncontextmenu="boxCtxMenu(event,\'' + en.id + '\')"'
        + ' draggable="true" ondragstart="boxDragStart(event,\''+en.id+'\')" ondragend="boxDragEnd(event)"'
        + ' ondragover="boxDragOver(event,\''+en.id+'\')" ondragleave="boxDragLeave(event)" ondrop="boxDrop(event,\''+en.id+'\')">'
        + '<button class="btoc-caret" onclick="boxToggleFolder(\''+en.id+'\')">'+(kids?caret:'　')+'</button>'
        + '<span class="btoc-folder-name" onclick="boxToggleFolder(\''+en.id+'\')" title="右键打开菜单">'
          + (en.collapsed?'📁':'📂') + ' ' + escHtml(en.name||'新文件夹') + (locked?' 🔒':'') + '</span>'
        + '<span class="ttoc-count">'+boxFolderFileCount(en.id)+'</span>'
        + '</div>';
      if(!en.collapsed) html += boxRenderLevel(en.id, depth+1, seen);
    } else {
      const active = _boxOpenId===en.id;
      const locked = !!en.locked;
      const lockToggle = _boxLockMode
        ? '<button class="icon-btn" onclick="event.stopPropagation();boxToggleFileLock(\''+en.id+'\')" style="font-size:9px;padding:0 3px;" title="'+(locked?'解锁':'固定，禁止移动和删除')+'">'+(locked?'🔒':'🔓')+'</button>'
        : '';
      html += '<div class="btoc-file'+(active?' active':'')+'" style="padding-left:'+(pad+14)+'px;"'
        + ' oncontextmenu="boxCtxMenu(event,\''+en.id+'\')"'
        + (locked ? '' : ' draggable="true" ondragstart="boxDragStart(event,\''+en.id+'\')" ondragend="boxDragEnd(event)"')
        + ' ondragover="boxDragOver(event,\''+en.id+'\')" ondragleave="boxDragLeave(event)" ondrop="boxDrop(event,\''+en.id+'\')">'
        + '<span class="ttoc-dot">'+(locked?'🔒':'📦')+'</span>'
        + '<span class="btoc-file-text" onclick="boxOpenFile(\''+en.id+'\')" title="点击打开，右键打开菜单">'+escHtml(en.name||'（未命名）')+'</span>'
        + lockToggle
        + '</div>';
    }
  });
  return html;
}

// ── 右键菜单 ──
function boxCloseCtxMenu(){
  const m=document.getElementById('boxCtxMenu');
  if(m && m.parentNode) m.parentNode.removeChild(m);
}
document.addEventListener('click', boxCloseCtxMenu);
document.addEventListener('keydown', e=>{ if(e.key==='Escape') boxCloseCtxMenu(); });

function boxShowMenu(x, y, items){
  boxCloseCtxMenu();
  const m=document.createElement('div');
  m.id='boxCtxMenu';
  m.className='box-ctx-menu';
  m.innerHTML = items.map(it=>{
    if(it.sep) return '<div class="box-ctx-sep"></div>';
    const dis = it.disabled ? ' disabled' : '';
    return '<div class="box-ctx-item'+dis+'"'+(it.disabled?'':' data-act="'+it.act+'"')+'>'
      + '<span class="box-ctx-ico">'+(it.icon||'')+'</span>'+escHtml(it.label)+'</div>';
  }).join('');
  m.addEventListener('click', ev=>{
    const el=ev.target.closest('.box-ctx-item[data-act]');
    if(!el) return;
    ev.stopPropagation();
    const fn=items.find(i=>i.act===el.getAttribute('data-act'));
    boxCloseCtxMenu();
    if(fn && fn.run) fn.run();
  });
  document.body.appendChild(m);
  // 贴边时自动翻转，避免菜单跑到屏幕外
  const r=m.getBoundingClientRect();
  m.style.left = Math.min(x, window.innerWidth  - r.width  - 6) + 'px';
  m.style.top  = Math.min(y, window.innerHeight - r.height - 6) + 'px';
}

function boxCtxMenuRoot(e){
  e.preventDefault(); e.stopPropagation();
  boxShowMenu(e.clientX, e.clientY, [
    {act:'nf', icon:'📁', label:'在根目录新建文件夹', run:()=>boxCreateFolder(null)},
    {act:'nb', icon:'📦', label:'在根目录新建盒子',   run:()=>boxCreateFile(null)},
    {sep:true},
    {act:'imp', icon:'📥', label:'导入 JSON 到根目录', run:()=>{ _boxImportTarget=null; document.getElementById('boxImportInput').click(); }},
  ]);
}

function boxCtxMenu(e, id){
  e.preventDefault(); e.stopPropagation();
  const en=boxEntry(id); if(!en) return;
  const canDel=boxCanDelete(en);
  const items=[];
  if(en.type==='folder'){
    const deep = boxDepth(en.id) >= BOX_MAX_DEPTH;
    items.push({act:'nb', icon:'📦', label:'在此文件夹内新建盒子', run:()=>boxCreateFile(en.id)});
    items.push({act:'nf', icon:'📁', label: deep ? '已达最深 '+BOX_MAX_DEPTH+' 层，无法再建子文件夹' : '在此文件夹内新建子文件夹',
                disabled: deep, run:()=>boxCreateFolder(en.id)});
    items.push({act:'imp', icon:'📥', label:'导入 JSON 到此文件夹', run:()=>{ _boxImportTarget=en.id; document.getElementById('boxImportInput').click(); }});
    items.push({sep:true});
    items.push({act:'tog', icon:en.collapsed?'▶':'▼', label:en.collapsed?'展开':'折叠', run:()=>boxToggleFolder(en.id)});
  } else {
    items.push({act:'open', icon:'📂', label:'打开', run:()=>boxOpenFile(en.id)});
    items.push({sep:true});
    items.push({act:'lock', icon:en.locked?'🔓':'🔒', label:en.locked?'解除固定':'固定（禁止移动和删除）', run:()=>boxToggleFileLock(en.id)});
  }
  items.push({act:'ren', icon:'✎', label:'重命名', run:()=>boxPromptRename(en.id)});
  items.push({sep:true});
  items.push({act:'del', icon:'✕', label: canDel ? '删除' : '内含已固定的盒子，无法删除', disabled: !canDel, run:()=>boxDeleteEntry(en.id)});
  boxShowMenu(e.clientX, e.clientY, items);
}

// ── 新建 / 重命名 ──
function boxCreateFolder(parentId){
  if(parentId!=null && boxDepth(parentId) >= BOX_MAX_DEPTH){
    alert('最多支持 '+BOX_MAX_DEPTH+' 层目录'); return;
  }
  const fd={ id:boxUid(), type:'folder', name:'新文件夹', parentId:parentId??null, collapsed:false };
  S.boxFiles.push(fd);
  const par=boxEntry(parentId); if(par) par.collapsed=false;
  saveState(); renderBoxSidebar();
  setTimeout(()=>boxPromptRename(fd.id), 30);
}

function boxCreateFile(parentId){
  const f={ id:boxUid(), type:'file', name:'新盒子', parentId:parentId??null,
    doc:{ project:'新盒子', createdAt:new Date().toISOString(), items:[] } };
  S.boxFiles.push(f);
  const par=boxEntry(parentId); if(par) par.collapsed=false;
  _boxOpenId=f.id;
  saveState(); renderBoxTab();
  setTimeout(()=>boxPromptRename(f.id), 30);
}

function boxPromptRename(id){
  const en=boxEntry(id); if(!en) return;
  const val=prompt(en.type==='folder'?'文件夹名称：':'盒子名称：', en.name||'');
  if(val===null) return;
  const name=val.trim();
  if(!name) return;
  en.name=name;
  if(en.type==='file' && en.doc) en.doc.project=name;
  saveState();
  renderBoxTab();
}

// ── 新建（工具栏按钮，落在根目录）──
function boxNewFolder(){ boxCreateFolder(null); }
function boxNewFile(){ boxCreateFile(null); }

let _boxImportTarget=null;
function onBoxImportSelected(e){
  const file = e.target.files[0];
  const target = _boxImportTarget; _boxImportTarget=null;
  if(!file) return;
  const r = new FileReader();
  r.onload = ev=>{
    try{
      const data = JSON.parse(ev.target.result);
      if(!data.items && !data.aps) throw new Error('不是 BOX 格式的 JSON');
      if(!data.items){
        data.items = (data.aps||[]).map(ap=>({
          id:ap.id, type:'task', text:ap.text,
          answers:[], createdAt:ap.createdAt, collapsed:!!ap.collapsed,
          _note:ap.note||'', _msgs:ap.msgs||[]
        }));
        delete data.aps;
      }
      data.items.forEach(it=>{
        if(it.type==='section' && it.collapsed===undefined) it.collapsed=false;
        if(it.type==='task' && !Array.isArray(it.answers)){
          const arr=[];
          if(it._note && String(it._note).trim()) arr.push({id:boxUid(), text:it._note});
          (it._msgs||[]).forEach(m=>{ if(m && m.text && String(m.text).trim()) arr.push({id:boxUid(), text:m.text}); });
          it.answers = arr;
        }
        delete it._note; delete it._msgs;
        (it.answers||[]).forEach(a=>{ if(a.html) a.html = boxSanitizeAnswerHtml(a.html); });
      });
      const f = { id: boxUid(), type:'file', parentId: target==null?null:target,
        name: data.project || file.name.replace(/\.json$/i,''),
        doc: data };
      S.boxFiles.push(f);
      const par=boxEntry(target); if(par) par.collapsed=false;
      _boxOpenId = f.id;
      saveState();
      renderBoxTab();
      showToast('已导入: '+f.name);
    }catch(err){ alert('导入失败: '+err.message); }
  };
  r.readAsText(file);
  e.target.value='';
}

function boxOpenFile(id){
  if(_boxOpenId===id) return;
  _boxOpenId = id;
  renderBoxTab();
}

function boxDeleteEntry(id){
  const en = boxEntry(id); if(!en) return;
  if(en.type==='file'){
    if(en.locked){ alert('该盒子已固定，请先在锁定模式中解锁再删除。'); return; }
    if(!confirm('删除盒子「'+(en.name||'')+'」？')) return;
  } else {
    if(boxSubtreeHasLockedFile(id)){ alert('该文件夹内有已固定的盒子，无法删除。\n（固定只限制盒子被移出或删除，文件夹本身仍可自由移动和改名）'); return; }
    const n = boxFolderFileCount(id);
    const msg = n ? ('删除文件夹「'+(en.name||'')+'」及其中的 '+n+' 个盒子？')
                  : ('删除文件夹「'+(en.name||'')+'」？');
    if(!confirm(msg)) return;
  }
  pushUndo();
  const doomed = new Set([id, ...boxDescendantIds(id)]);
  markDeleted('boxFiles', [...doomed]);
  S.boxFiles = S.boxFiles.filter(x=>!doomed.has(x.id));
  if(doomed.has(_boxOpenId)) _boxOpenId=null;
  saveState();
  renderBoxTab();
  showUndoBar('已删除');
}

function boxToggleFolder(id){
  const fd = boxEntry(id);
  if(!fd || fd.type!=='folder') return;
  fd.collapsed = !fd.collapsed;
  saveState();
  renderBoxSidebar();
}

function toggleBoxLockMode(){
  _boxLockMode = !_boxLockMode;
  renderBoxSidebar();
}

function boxToggleFileLock(id){
  const en = boxEntry(id);
  if(!en || en.type!=='file') return;
  en.locked = !en.locked;
  saveState();
  renderBoxSidebar();
}

// ── 拖拽：拖到文件夹上=移入该文件夹；拖到盒子上=移到它前面（同一父级内排序）──
function boxDragStart(e, id){
  const en=boxEntry(id);
  if(!boxCanMove(en)){ e.preventDefault(); return; }
  _boxDragId = id;
  e.dataTransfer.effectAllowed = 'move';
  try{ e.dataTransfer.setData('text/plain', String(id)); }catch(err){}
  e.currentTarget.classList.add('task-dragging');
}
function boxDragEnd(e){
  e.currentTarget.classList.remove('task-dragging');
  document.querySelectorAll('.task-drag-over').forEach(el=>el.classList.remove('task-drag-over'));
  _boxDragId = null;
}
// 投放区判定：文件夹上/下缘 = 同级排序，中间 = 移入文件夹；
// 盒子只有上下两半 = 同级排序。这样最高一级文件夹也能自由调前后顺序。
function boxDropZone(e, targetId){
  const en=boxEntry(targetId);
  const r=e.currentTarget.getBoundingClientRect();
  const y=r.height ? (e.clientY-r.top)/r.height : 0.5;
  if(en && en.type==='folder'){
    if(y<0.30) return 'before';
    if(y>0.70) return 'after';
    return 'inside';
  }
  return y<0.5 ? 'before' : 'after';
}

function boxClearDropMarks(){
  document.querySelectorAll('.task-drag-over,.box-drop-before,.box-drop-after')
    .forEach(el=>el.classList.remove('task-drag-over','box-drop-before','box-drop-after'));
}

function boxDragOver(e, targetId){
  if(_boxDragId==null || _boxDragId===targetId) return;
  const dragged=boxEntry(_boxDragId);
  if(dragged && dragged.type==='folder' && boxIsSelfOrAncestor(_boxDragId, targetId)) return;
  e.preventDefault();
  e.dataTransfer.dropEffect='move';
  const zone=boxDropZone(e, targetId);
  boxClearDropMarks();
  e.currentTarget.classList.add(
    zone==='inside' ? 'task-drag-over' : (zone==='before' ? 'box-drop-before' : 'box-drop-after'));
}

function boxDragLeave(e){
  e.currentTarget.classList.remove('task-drag-over','box-drop-before','box-drop-after');
}

function boxDrop(e, targetId){
  e.preventDefault(); e.stopPropagation();
  const zone=boxDropZone(e, targetId);
  boxClearDropMarks();
  if(_boxDragId==null || _boxDragId===targetId) return;
  const moved=boxEntry(_boxDragId), target=boxEntry(targetId);
  if(!moved || !target) return;
  if(!boxCanMove(moved)) return;
  if(moved.type==='folder' && boxIsSelfOrAncestor(moved.id, targetId)) return;

  const arr=S.boxFiles;
  if(zone==='inside'){
    if(moved.type==='folder' && boxDepth(target.id)+boxSubtreeHeight(moved.id) > BOX_MAX_DEPTH){
      showToast('超出 '+BOX_MAX_DEPTH+' 层限制'); return;
    }
    moved.parentId = target.id;
    target.collapsed = false;
    arr.splice(arr.indexOf(moved),1);
    arr.push(moved);
  } else {
    // 成为 target 的同级，插到它前面或后面（根目录同样适用）
    const newParent = target.parentId==null ? null : target.parentId;
    if(moved.type==='folder'){
      const base = newParent==null ? 0 : boxDepth(newParent);
      if(base + boxSubtreeHeight(moved.id) > BOX_MAX_DEPTH){
        showToast('超出 '+BOX_MAX_DEPTH+' 层限制'); return;
      }
    }
    moved.parentId = newParent;
    arr.splice(arr.indexOf(moved),1);
    const ti=arr.indexOf(target);
    arr.splice(zone==='before' ? ti : ti+1, 0, moved);
  }
  saveState();
  renderBoxSidebar();
}

// 拖到目录空白处 = 移到根目录末尾（把条目从文件夹里拿出来）
function boxRootDragOver(e){
  if(_boxDragId==null) return;
  const moved=boxEntry(_boxDragId);
  if(!boxCanMove(moved)) return;
  e.preventDefault();
  e.dataTransfer.dropEffect='move';
  e.currentTarget.classList.add('box-root-drop');
}
function boxRootDragLeave(e){ e.currentTarget.classList.remove('box-root-drop'); }
function boxRootDrop(e){
  e.preventDefault();
  e.currentTarget.classList.remove('box-root-drop');
  const moved=boxEntry(_boxDragId);
  if(!moved || !boxCanMove(moved)) return;
  if(moved.type==='folder' && boxSubtreeHeight(moved.id) > BOX_MAX_DEPTH){ showToast('超出层级限制'); return; }
  if((moved.parentId==null?null:moved.parentId)===null){
    // 已在根目录：仅移到末尾
    const arr=S.boxFiles; arr.splice(arr.indexOf(moved),1); arr.push(moved);
  } else {
    moved.parentId=null;
    const arr=S.boxFiles; arr.splice(arr.indexOf(moved),1); arr.push(moved);
  }
  saveState(); renderBoxSidebar();
}

// 子树的“文件夹层数”（只有自己=1）。层级上限只约束文件夹嵌套，
// 盒子可以放在任意一层，因此计算时必须忽略文件条目，
// 否则第4层文件夹里放了盒子后，这个文件夹就再也移动不了。
function boxSubtreeHeight(id){
  let h=1;
  boxDescendantIds(id).forEach(d=>{
    const e=boxEntry(d);
    if(!e || e.type!=='folder') return;
    h=Math.max(h, boxDepth(d)-boxDepth(id)+1);
  });
  return h;
}

// ── document viewer / editor ──
function boxOpenDoc(){
  return (S.boxFiles||[]).find(x=>x.id==_boxOpenId && x.type==='file') || null;
}

function renderBoxDoc(){
  const main = document.getElementById('boxMain');
  const header = document.getElementById('boxDocHeader');
  if(!main) return;
  const f = boxOpenDoc();
  if(!f){
    _boxOpenId = null;
    if(header) header.innerHTML = '';
    main.innerHTML = '<div class="empty-state"><div class="empty-icon">📦</div>从左侧选择或导入一个 BOX 文件</div>';
    renderBoxDocToc();
    return;
  }
  const doc = f.doc || (f.doc = {project:f.name, items:[]});
  if(!Array.isArray(doc.items)) doc.items = [];

  // header is OUTSIDE the scroll container, so the format toolbar is always
  // in view while writing — no sticky offsets, no content peeking above it
  let headHtml = '<div class="box-doc-titlebar">'
    + '<input class="box-doc-title-input" value="'+escAttr(doc.project||f.name||'')+'" oninput="boxSyncTitle(this)" title="盒子标题"/>'
    + '<button class="pxl-btn" onclick="boxAddSection()">+ 分组</button>'
    + '<button class="pxl-btn" onclick="boxExportCurrent()">📄 导出JSON</button>'
    + '<button class="pxl-btn" onclick="boxExportCurrentMd()" title="导出为可直接阅读的 Markdown 文档">📃 导出MD</button>'
    + '<button class="pxl-btn" onclick="boxExportPdf()" title="按屏幕上的样式导出 PDF，用于物理存档">🖨️ 导出PDF</button>'
    + '</div>';
  headHtml += renderBoxFmtToolbar();
  if(header) header.innerHTML = headHtml;

  let html = '';
  let curCollapsed = false;
  doc.items.forEach(it=>{
    if(it.type==='section'){
      curCollapsed = !!it.collapsed;
      html += '<div class="box-sec-hdr" id="boxitem-'+escAttr(it.id)+'"'
        + ' ondragover="boxItemDragOver(event,\''+escAttr(it.id)+'\')" ondragleave="boxItemDragLeave(event)" ondrop="boxItemDrop(event,\''+escAttr(it.id)+'\')">'
        + '<span class="box-drag-handle" title="拖拽调整顺序" draggable="true" onmousedown="boxItemDragArm(\''+escAttr(it.id)+'\')" ondragstart="boxItemDragStart(event,\''+escAttr(it.id)+'\')" ondragend="boxItemDragEnd(event)">⠿</span>'
        + '<button class="icon-btn" onclick="boxToggleSection(\''+escAttr(it.id)+'\')">'+(it.collapsed?'▸':'▾')+'</button>'
        + '<span class="box-sec-title" ondblclick="startEditBoxItemText(\''+escAttr(it.id)+'\',this)" title="双击编辑标题">'+escHtml(it.text||'未命名分组')+'</span>'
        + '<button class="icon-btn" onclick="boxAddQuestionToSection(\''+escAttr(it.id)+'\')" title="在这个分组下添加问题">＋</button>'
        + '<button class="icon-btn" onclick="boxDeleteItem(\''+escAttr(it.id)+'\')" title="删除分组（问题保留）">✕</button>'
        + '</div>';
      return;
    }
    if(curCollapsed) return;
    const answers = it.answers||[];
    const answered = answers.some(a=>a.text && a.text.trim());
    html += '<div class="box-q-card'+(answered?' answered':'')+'" id="boxitem-'+escAttr(it.id)+'"'
      + ' ondragover="boxItemDragOver(event,\''+escAttr(it.id)+'\')" ondragleave="boxItemDragLeave(event)" ondrop="boxItemDrop(event,\''+escAttr(it.id)+'\')">';
    html += '<div style="display:flex;align-items:flex-start;gap:6px;">';
    html += '<span class="box-drag-handle" title="拖拽调整顺序" draggable="true" onmousedown="boxItemDragArm(\''+escAttr(it.id)+'\')" ondragstart="boxItemDragStart(event,\''+escAttr(it.id)+'\')" ondragend="boxItemDragEnd(event)">⠿</span>';
    html += '<div class="box-q-title" style="flex:1;" ondblclick="startEditBoxItemText(\''+escAttr(it.id)+'\',this)" title="双击编辑问题">'+escHtml(it.text||'（空问题）')+'</div>';
    html += '<button class="icon-btn" onclick="boxDeleteItem(\''+escAttr(it.id)+'\')" style="color:#cc0000;flex-shrink:0;">✕</button>';
    html += '</div>';
    html += '<div class="box-field-label">答案</div>';
    html += '<div class="box-answers-list">';
    if(!answers.length){
      html += '<div class="box-answers-empty">还没有答案，点击下方"添加答案"开始作答</div>';
    }
    answers.forEach((a,ai)=>{
      const num = String(ai+1).padStart(2,'0');
      html += '<div class="box-answer-block">'
        + '<div class="box-answer-num">'+num+'</div>'
        + '<div class="box-answer-input" id="boxansinp-'+escAttr(a.id)+'" data-item="'+escAttr(it.id)+'" contenteditable="true" data-placeholder="在这里写下你的答案..." '
          + 'oninput="boxSyncAnswer(\''+escAttr(it.id)+'\',\''+escAttr(a.id)+'\',this)" onpaste="boxAnswerPaste(event)">'
          + (a.html ? boxSanitizeAnswerHtml(a.html) : escHtml(a.text||''))
        + '</div>'
        + '<button class="icon-btn box-answer-del" onclick="boxDeleteAnswer(\''+escAttr(it.id)+'\',\''+escAttr(a.id)+'\')" title="删除答案">✕</button>'
        + '</div>';
    });
    html += '</div>';
    html += '<button class="pxl-btn" style="font-size:10px;padding:1px 8px;margin-top:4px;" onclick="boxAddAnswer(\''+escAttr(it.id)+'\')">+ 添加答案</button>';
    html += '</div>';
  });

  html += '<input class="form-input" id="boxAddQInput" placeholder="+ 添加问题，回车确认" style="width:100%;font-size:12px;padding:5px 8px;margin-top:8px;" onkeydown="if(event.key===\'Enter\'){event.preventDefault();boxAddQuestion();}"/>';

  main.innerHTML = html;
  renderBoxDocToc();
}

// ── format toolbar (ported from box.html — acts on whichever answer box has focus) ──
const BOX_FMT_TEXT_COLORS = ['#000000','#cc0000','#000080','#008000','#800080','#e08000'];
const BOX_FMT_MARK_COLORS = ['#fff59d','#c8f7c5','#ffd0e0','#bde0ff'];

function renderBoxFmtToolbar(){
  let h = '<div class="box-fmt-toolbar">';
  h += '<div class="box-fmt-group">';
  h += '<button class="box-fmt-btn" style="font-weight:bold;" onmousedown="event.preventDefault()" onclick="boxFmtToggle(\'bold\')" title="加粗">B</button>';

function boxFmtGetActive(){
  const el = document.activeElement;
  if(el && el.classList && el.classList.contains('box-answer-input')) return el;
  return null;
}

function boxFmtSyncFromEl(el){
  const ansId = el.id.replace('boxansinp-','');
  const itemId = el.getAttribute('data-item');
  boxSyncAnswer(itemId, ansId, el);
}

function boxFmtToggle(cmd){
  const el = boxFmtGetActive();
  if(!el){ showToast('请先点击一个答案框'); return; }
  document.execCommand(cmd, false, null);
  boxFmtSyncFromEl(el);
}

function boxFmtWrapSelection(styleFn){
  const el = boxFmtGetActive();
  if(!el){ showToast('请先点击一个答案框'); return null; }
  const sel = window.getSelection();
  if(!sel || sel.rangeCount===0 || sel.getRangeAt(0).collapsed){ showToast('请先划选要处理的文字'); return null; }
  const range = sel.getRangeAt(0);
  const span = document.createElement('span');
  styleFn(span);
  const frag = range.extractContents();
  span.appendChild(frag);
  range.insertNode(span);
  sel.removeAllRanges();
  const nr = document.createRange();
  nr.selectNodeContents(span);
  sel.addRange(nr);
  boxFmtSyncFromEl(el);
  return span;
}

function boxFmtColor(mode, color){
  boxFmtWrapSelection(span=>{
    if(mode==='text'){ span.style.color = color||'inherit'; }
    else { span.style.backgroundColor = color||'transparent'; }
  });
}

function boxFmtFontSize(delta){
  boxFmtWrapSelection(span=>{
    const sel = window.getSelection();
    let node = sel.rangeCount ? sel.getRangeAt(0).startContainer : null;
    if(node && node.nodeType===3) node = node.parentNode;
    const base = node ? parseFloat(window.getComputedStyle(node).fontSize)||13 : 13;
    const next = Math.max(10, Math.min(40, base + delta*2));
    span.style.fontSize = next+'px';
  });
}

function boxAnswerPaste(e){
  // paste as plain text so external formatting junk never enters the data
  e.preventDefault();
  const text = (e.clipboardData||window.clipboardData).getData('text/plain');
  document.execCommand('insertText', false, text);
}

// sanitize rich-text HTML (ported from box.html): strip scripts/handlers, keep only safe formatting
function boxSanitizeAnswerHtml(html){
  if(!html) return '';
  const allowedTags = new Set(['SPAN','B','STRONG','I','EM','U','S','STRIKE','BR','DIV']);
  const allowedStyleProps = ['color','background-color','font-size','font-weight','font-style','text-decoration'];
  let root;
  try{
    const d = new DOMParser().parseFromString('<div>'+html+'</div>','text/html');
    root = d.body.firstChild;
  }catch(e){ return escHtml(html); }
  function clean(node){
    [...node.childNodes].forEach(child=>{
      if(child.nodeType===1){
        if(!allowedTags.has(child.tagName)){
          while(child.firstChild) node.insertBefore(child.firstChild, child);
          node.removeChild(child);
          return;
        }
        const styleVal = child.getAttribute('style');
        [...child.attributes].forEach(attr=>child.removeAttribute(attr.name));
        if(styleVal){
          const kept = styleVal.split(';').map(s=>s.trim()).filter(Boolean).filter(rule=>{
            const prop = rule.split(':')[0].trim().toLowerCase();
            return allowedStyleProps.includes(prop);
          });
          if(kept.length) child.setAttribute('style', kept.join(';'));
        }
        clean(child);
      } else if(child.nodeType!==3){
        node.removeChild(child);
      }
    });
  }
  clean(root);
  return root.innerHTML;
}

// ── item drag reordering (ported from box.html: handle-only drag,
// drop above/below depending on which half of the target you release over) ──
let _boxItemDragId = null;

function boxItemDragArm(id){
  // mousedown on the handle arms the drag before dragstart fires
  _boxItemDragId = id;
}

function boxItemDragStart(e, id){
  _boxItemDragId = id;
  e.dataTransfer.effectAllowed = 'move';
  try{ e.dataTransfer.setData('text/plain', String(id)); }catch(err){}
  const card = document.getElementById('boxitem-'+id);
  if(card) card.classList.add('box-item-dragging');
}

function boxItemDragEnd(e){
  boxClearDropIndicators();
  document.querySelectorAll('.box-item-dragging').forEach(el=>el.classList.remove('box-item-dragging'));
  _boxItemDragId = null;
}

function boxClearDropIndicators(){
  document.querySelectorAll('.box-drop-before,.box-drop-after').forEach(el=>{
    el.classList.remove('box-drop-before','box-drop-after');
  });
}

function boxItemDragOver(e, targetId){
  // only react to a drag started from one of our handles, so dragging text
  // inside an answer box never triggers a reorder
  if(_boxItemDragId==null || _boxItemDragId===targetId) return;
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  boxClearDropIndicators();
  const el = e.currentTarget;
  const rect = el.getBoundingClientRect();
  const before = e.clientY < rect.top + rect.height/2;
  el.classList.add(before ? 'box-drop-before' : 'box-drop-after');
}

function boxItemDragLeave(e){
  e.currentTarget.classList.remove('box-drop-before','box-drop-after');
}

function boxItemDrop(e, targetId){
  e.preventDefault();
  e.stopPropagation();
  const before = e.clientY < e.currentTarget.getBoundingClientRect().top + e.currentTarget.getBoundingClientRect().height/2;
  boxClearDropIndicators();
  if(_boxItemDragId==null || _boxItemDragId===targetId) return;
  const f = boxOpenDoc(); if(!f) return;
  const arr = f.doc.items||[];
  const fromIdx = arr.findIndex(x=>x.id==_boxItemDragId);
  if(fromIdx<0) return;
  const [moved] = arr.splice(fromIdx,1);
  const newTo = arr.findIndex(x=>x.id==targetId);
  if(newTo<0){ arr.splice(fromIdx,0,moved); return; } // target vanished — put it back
  arr.splice(before ? newTo : newTo+1, 0, moved);
  _boxItemDragId = null;
  saveState();
  renderBoxDoc();
}

// ── per-file document TOC (like box.html's 目录 sidebar):
// sections with answered counts, questions with ✓/•, click to jump ──
function renderBoxDocTocTree(tree){
  const f = boxOpenDoc();
  if(!f){
    tree.innerHTML = '<div class="ttoc-empty">打开一个盒子后，这里显示它的分级目录</div>';
    return;
  }
  const q = ''; // panel view is unfiltered; searching switches to global results
  const items = f.doc.items||[];
  if(!items.length){
    tree.innerHTML = '<div class="ttoc-empty">这个盒子还没有内容</div>';
    return;
  }

  // group positionally: tasks before the first section form a headless group
  const groups = [{section:null, tasks:[]}];
  items.forEach(it=>{
    if(it.type==='section') groups.push({section:it, tasks:[]});
    else groups[groups.length-1].tasks.push(it);
  });

  const hasAns = it => (it.answers||[]).some(a=>a.text && a.text.trim());
  const match = it => !q || (it.text||'').toLowerCase().includes(q);

  let html='';
  let anyRendered=false;
  groups.forEach(grp=>{
    const visTasks = q ? grp.tasks.filter(match) : grp.tasks;
    if(q && grp.section && !visTasks.length && !match(grp.section)) return;
    if(grp.section){
      const done = grp.tasks.filter(hasAns).length;
      html += '<div class="btoc-sec-row" onclick="boxGotoItem(\''+escAttr(grp.section.id)+'\')" title="'+escAttr(grp.section.text)+'">'
        + '<span class="btoc-sec-name">'+escHtml(grp.section.text||'未命名分组')+'</span>'
        + '<span class="ttoc-count">'+done+'/'+grp.tasks.length+'</span>'
        + '</div>';
      anyRendered=true;
    }
    visTasks.forEach(it=>{
      const answered = hasAns(it);
      html += '<div class="ttoc-item btoc-q'+(answered?' answered':'')+'" onclick="boxGotoItem(\''+escAttr(it.id)+'\')" title="'+escAttr(it.text)+'">'
        + '<span class="ttoc-dot">'+(answered?'✓':'•')+'</span>'
        + '<span class="ttoc-item-text">'+escHtml(it.text||'（空问题）')+'</span>'
        + '</div>';
      anyRendered=true;
    });
  });
  tree.innerHTML = anyRendered ? html : '<div class="ttoc-empty">没有匹配的结果</div>';
}

function boxGotoItem(itemId){
  const f = boxOpenDoc(); if(!f) return;
  const items = f.doc.items||[];
  const idx = items.findIndex(x=>x.id==itemId);
  if(idx<0) return;
  // if the target question sits inside a collapsed section, expand it first
  let needRender=false;
  if(items[idx].type!=='section'){
    for(let i=idx-1;i>=0;i--){
      if(items[i].type==='section'){
        if(items[i].collapsed){ items[i].collapsed=false; needRender=true; saveState(); }
        break;
      }
    }
  }
  if(needRender) renderBoxDoc();
  setTimeout(()=>{
    const el = document.getElementById('boxitem-'+itemId);
    if(!el) return;
    el.scrollIntoView({behavior:'smooth', block:'center'});
    el.classList.remove('ttoc-flash'); void el.offsetWidth; el.classList.add('ttoc-flash');
    setTimeout(()=>el.classList.remove('ttoc-flash'), 1500);
  }, needRender?60:0);
}

function startEditBoxItemText(itemId, el){
  const f = boxOpenDoc(); if(!f) return;
  const it = f.doc.items.find(x=>x.id==itemId); if(!it) return;
  const inp = document.createElement('input');
  inp.className = 'task-title-input';
  inp.value = it.text || '';
  el.replaceWith(inp);
  inp.focus(); inp.select();
  function save(){
    it.text = inp.value.trim() || it.text || '';
    saveState();
    renderBoxDoc();
  }
  inp.addEventListener('blur', save);
  inp.addEventListener('keydown', e=>{
    if(e.key==='Enter'){ e.preventDefault(); inp.blur(); }
    if(e.key==='Escape'){ inp.value=it.text; inp.blur(); }
  });
}

// 人类可读版导出：Markdown 排版，适合直接阅读/打印/发给别人
function boxDocToMarkdown(doc){
  let md = '# ' + (doc.project||'未命名盒子') + '\n';
  (doc.items||[]).forEach(it=>{
    if(it.type==='section'){
      md += '\n## ' + (it.text||'未命名分组') + '\n';
      return;
    }
    md += '\n**Q: ' + (it.text||'（空问题）') + '**\n\n';
    const answers = (it.answers||[]).filter(a=>a.text && a.text.trim());
    if(!answers.length){ md += '_（暂无答案）_\n'; return; }
    answers.forEach(a=>{
      // multi-line answers keep their line breaks, indented under the bullet
      const lines = a.text.trim().split('\n');
      md += '- ' + lines[0] + '\n';
      for(let i=1;i<lines.length;i++) md += '  ' + lines[i] + '\n';
    });
  });
  return md;
}

// ── PDF export (physical archiving) ──
// Renders the open box into a hidden iframe that reuses the app's own
// stylesheet, so section colours, highlights and the numbered answer blocks
// look exactly like they do on screen. Sidebar, toolbars and all interactive
// affordances are left out. Purely local: nothing is written to Supabase.
function boxExportPdf(){
  const f = boxOpenDoc();
  if(!f){ showToast('请先打开一个盒子'); return; }
  const doc = f.doc || {};
  const items = doc.items || [];
  const title = boxSanitizeName(doc.project || f.name || 'box');

  let body = '<div class="pdfdoc">';
  body += '<h1 class="pdfdoc-title">' + escHtml(doc.project || f.name || '') + '</h1>';
  if(doc.createdAt) body += '<div class="pdfdoc-meta">创建于 ' + fmtDT(doc.createdAt) + ' · 导出于 ' + fmtDT(new Date().toISOString()) + '</div>';
  else body += '<div class="pdfdoc-meta">导出于 ' + fmtDT(new Date().toISOString()) + '</div>';

  items.forEach(it=>{
    if(it.type==='section'){
      // archive prints every section expanded, regardless of collapse state
      body += '<div class="box-sec-hdr pdf-keep"><span class="box-sec-title">'
        + escHtml(it.text||'未命名分组') + '</span></div>';
      return;
    }
    const answers = (it.answers||[]).filter(a=>(a.text||'').trim() || (a.html||'').trim());
    const answered = answers.length>0;
    body += '<div class="box-q-card pdf-keep'+(answered?' answered':'')+'">';
    body += '<div class="box-q-title">' + escHtml(it.text||'（空问题）') + '</div>';
    if(answered){
      body += '<div class="box-field-label">答案</div><div class="box-answers-list">';
      answers.forEach((a,ai)=>{
        body += '<div class="box-answer-block">'
          + '<div class="box-answer-num">'+String(ai+1).padStart(2,'0')+'</div>'
          + '<div class="box-answer-input">'+(a.html ? boxSanitizeAnswerHtml(a.html) : escHtml(a.text||''))+'</div>'
          + '</div>';
      });
      body += '</div>';
    }
    body += '</div>';
  });
  body += '</div>';

  // reuse the live stylesheet so the print output tracks the app's look
  const appCss = [...document.querySelectorAll('style')].map(s=>s.textContent).join('\n');
  // <base> makes the relative unifont.ttf url in @font-face resolve correctly
  const baseHref = location.href.replace(/[^/]*$/, '');

  const printCss = `
    @page { margin: 14mm 12mm; }
    html,body{
      background:#fff !important;height:auto !important;overflow:visible !important;
      margin:0;padding:0;
    }
    /* make sure background colours actually reach the paper */
    *{ -webkit-print-color-adjust:exact !important; print-color-adjust:exact !important; }
    .pdfdoc{padding:0;}
    .pdfdoc-title{
      font-family:var(--font-ui);font-size:17px;font-weight:bold;color:#000080;
      margin:0 0 2px;line-height:1.35;
    }
    .pdfdoc-meta{
      font-family:var(--font-ui);font-size:10px;color:#606060;
      margin-bottom:10px;padding-bottom:6px;border-bottom:2px solid #000080;
    }
    /* keep a question and its answers on one page where possible */
    .pdf-keep{break-inside:avoid;page-break-inside:avoid;}
    .box-sec-hdr{break-after:avoid;page-break-after:avoid;margin:10px 0 5px;}
    .box-q-card{margin-bottom:7px;}
    /* on screen an answer box is 44px tall so it's easy to click — on paper
       it should hug its content */
    .box-answer-input{min-height:0 !important;}
  `;

  const html = '<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"/>'
    + '<base href="'+escAttr(baseHref)+'"/>'
    + '<title>'+escHtml(title)+'</title>'
    + '<style>'+appCss+'</style>'
    + '<style>'+printCss+'</style>'
    + '</head><body>' + body
    + '<script>(function(){var done=false;function go(){if(done)return;done=true;'
    + 'try{window.focus();window.print();}catch(e){}}'
    + 'if(document.fonts&&document.fonts.ready){document.fonts.ready.then(function(){setTimeout(go,150);});setTimeout(go,2500);}'
    + 'else{setTimeout(go,400);}})();<\/script>'
    + '</body></html>';

  // an iframe avoids popup blockers entirely, unlike window.open
  const frame = document.createElement('iframe');
  frame.setAttribute('aria-hidden','true');
  frame.style.cssText = 'position:fixed;right:0;bottom:0;width:0;height:0;border:0;visibility:hidden;';
  document.body.appendChild(frame);
  const fdoc = frame.contentDocument || (frame.contentWindow && frame.contentWindow.document);
  if(!fdoc){ document.body.removeChild(frame); alert('无法创建打印视图，请重试'); return; }
  fdoc.open(); fdoc.write(html); fdoc.close();
  showToast('已生成打印视图，在弹出的对话框中选择"另存为 PDF"');
  // clean up once the dialog has had time to open (onafterprint is unreliable in Safari)
  setTimeout(()=>{ if(frame.parentNode) frame.parentNode.removeChild(frame); }, 60000);
}

// ── export everything as a ZIP mirroring the folder hierarchy ──
// minimal ZIP writer (STORE method, no compression, UTF-8 filenames) — no
// external libraries, works offline, output opens on any OS / any unzip tool
const _crcTable = (()=>{
  const t = new Uint32Array(256);
  for(let n=0;n<256;n++){
    let c=n;
    for(let k=0;k<8;k++) c = (c&1) ? (0xEDB88320 ^ (c>>>1)) : (c>>>1);
    t[n]=c>>>0;
  }
  return t;
})();
function crc32(u8){
  let c=0xFFFFFFFF;
  for(let i=0;i<u8.length;i++) c = _crcTable[(c ^ u8[i]) & 0xFF] ^ (c>>>8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}
function dosTimeDate(d){
  const time = (d.getHours()<<11) | (d.getMinutes()<<5) | (d.getSeconds()>>1);
  const date = ((d.getFullYear()-1980)<<9) | ((d.getMonth()+1)<<5) | d.getDate();
  return {time, date};
}
function buildZip(entries){
  // entries: [{name:'a/b/c.json' (or 'a/' for a folder), data:Uint8Array|null}]
  const enc = new TextEncoder();
  const now = dosTimeDate(new Date());
  const parts = [];
  const central = [];
  let offset = 0;
  entries.forEach(en=>{
    const nameU8 = enc.encode(en.name);
    const data = en.data || new Uint8Array(0);
    const crc = data.length ? crc32(data) : 0;
    const isDir = en.name.endsWith('/');

    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true);
    lh.setUint16(4, 20, true);          // version needed
    lh.setUint16(6, 0x0800, true);      // flags: UTF-8 names
    lh.setUint16(8, 0, true);           // method: stored
    lh.setUint16(10, now.time, true);
    lh.setUint16(12, now.date, true);
    lh.setUint32(14, crc, true);
    lh.setUint32(18, data.length, true);
    lh.setUint32(22, data.length, true);
    lh.setUint16(26, nameU8.length, true);
    lh.setUint16(28, 0, true);
    parts.push(new Uint8Array(lh.buffer), nameU8, data);

    const cd = new DataView(new ArrayBuffer(46));
    cd.setUint32(0, 0x02014b50, true);
    cd.setUint16(4, 20, true);          // version made by
    cd.setUint16(6, 20, true);          // version needed
    cd.setUint16(8, 0x0800, true);
    cd.setUint16(10, 0, true);
    cd.setUint16(12, now.time, true);
    cd.setUint16(14, now.date, true);
    cd.setUint32(16, crc, true);
    cd.setUint32(20, data.length, true);
    cd.setUint32(24, data.length, true);
    cd.setUint16(28, nameU8.length, true);
    cd.setUint16(30, 0, true);          // extra len
    cd.setUint16(32, 0, true);          // comment len
    cd.setUint16(34, 0, true);          // disk
    cd.setUint16(36, 0, true);          // internal attrs
    cd.setUint32(38, isDir ? 0x10 : 0, true); // external attrs: MS-DOS dir bit
    cd.setUint32(42, offset, true);
    central.push(new Uint8Array(cd.buffer), nameU8);

    offset += 30 + nameU8.length + data.length;
  });

  let cdSize = 0;
  central.forEach(u8=>{ cdSize += u8.length; });
  const eocd = new DataView(new ArrayBuffer(22));
  eocd.setUint32(0, 0x06054b50, true);
  eocd.setUint16(4, 0, true);
  eocd.setUint16(6, 0, true);
  eocd.setUint16(8, entries.length, true);
  eocd.setUint16(10, entries.length, true);
  eocd.setUint32(12, cdSize, true);
  eocd.setUint32(16, offset, true);
  eocd.setUint16(20, 0, true);
  return new Blob([...parts, ...central, new Uint8Array(eocd.buffer)], {type:'application/zip'});
}

function boxSanitizeName(s){
  return String(s||'未命名').replace(/[\\/:*?"<>|]/g,'_').trim() || '未命名';
}

function boxExportAll(){
  const arr = S.boxFiles||[];
  if(!arr.length){ showToast('没有可导出的文件'); return; }
  const enc = new TextEncoder();
  const entries = [];
  const used = new Set();
  const uniq = base=>{
    let p=base, n=2;
    while(used.has(p)) p = base.replace(/(\.json)?$/, m=>('-'+(n++)+(m||'')));
    used.add(p);
    return p;
  };
  // 递归还原目录层级，任意层级的盒子都会落在对应文件夹里
  const seenExp=new Set();
  (function walk(parentId, prefix){
    boxChildren(parentId).forEach(en=>{
      if(seenExp.has(en.id)) return;
      seenExp.add(en.id);
      if(en.type==='folder'){
        const dir = prefix + boxSanitizeName(en.name) + '/';
        entries.push({name: uniq(dir), data:null});
        walk(en.id, dir);
      } else {
        entries.push({name: uniq(prefix + boxSanitizeName(en.name) + '.json'),
                      data: enc.encode(JSON.stringify(en.doc||{}, null, 2))});
      }
    });
  })(null, '');

  const blob = buildZip(entries);
  const d = new Date();
  const fname = 'box-export-'+d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())+'.zip';
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.download = fname; a.href = url; a.click();
  setTimeout(()=>URL.revokeObjectURL(url), 5000);
  showToast('已导出 '+arr.filter(x=>x.type==='file').length+' 个文件');
}

      if(h){
        const p = await h.queryPermission({mode:'readwrite'});
        if(p==='granted'){
          _fileHandle = h;
          const d = await readFileData(h);
          if(adoptFileData(d)) renderBoxTab(); else await writeBoundFile();
        } else _pendingHandle = h;
        renderFileBtn();
      }
    }catch(e){}
  }
})();
