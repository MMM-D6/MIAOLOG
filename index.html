<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
<title>MMM</title>
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)"/>
<meta name="theme-color" content="#0b0b0b" media="(prefers-color-scheme: dark)"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="MMM"/>
<link rel="apple-touch-icon" href="icons/mmm-180.png"/>
<link rel="icon" type="image/png" sizes="192x192" href="icons/mmm-192.png"/>
<link rel="manifest" href="manifest.json"/>
<script>
(function(){ try{ var t=localStorage.getItem('mmm-theme'); if(t==='light'||t==='dark') document.documentElement.setAttribute('data-theme',t); }catch(e){} })();
</script>
<style>
:root{
  --bg:#ffffff; --fg:#101010; --mut:#8e8e8e; --faint:#c9c9c9; --line:#ededed;
  --fill:#f2f2f2; --fill2:#e6e6e6; --sel:#101010; --selfg:#ffffff;
  --sheet:#ffffff; --group:#f5f5f5; --backdrop:rgba(0,0,0,.32); --danger:#e5484d;
  --favbg:#fbf7f0; --tile:#f4f5f6; --blk1:#eef0f2; --blk2:#e5e7ea; --popbg:rgba(255,255,255,.5); --popsh:rgba(0,0,0,.22);
  --kb:0px; --tabh:52px;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0b0b0b; --fg:#f2f2f2; --mut:#8a8a8a; --faint:#4b4b4b; --line:#1f1f1f;
    --fill:#1a1a1a; --fill2:#262626; --sel:#f2f2f2; --selfg:#0b0b0b;
    --sheet:#171717; --group:#141414; --backdrop:rgba(0,0,0,.55);
    --favbg:#16130f; --tile:#151515; --blk1:#242424; --blk2:#1e1e1e; --popbg:rgba(70,70,70,.5); --popsh:rgba(0,0,0,.7);
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0b0b0b; --fg:#f2f2f2; --mut:#8a8a8a; --faint:#4b4b4b; --line:#1f1f1f;
  --fill:#1a1a1a; --fill2:#262626; --sel:#f2f2f2; --selfg:#0b0b0b;
  --sheet:#171717; --group:#141414; --backdrop:rgba(0,0,0,.55);
  --favbg:#16130f; --tile:#151515; --blk1:#242424; --blk2:#1e1e1e; --popbg:rgba(70,70,70,.5); --popsh:rgba(0,0,0,.7);
  color-scheme: dark;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--fg);}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;}
input,textarea{font:inherit;color:inherit;background:none;border:none;outline:none;}
textarea{resize:none;}

#auth{position:fixed;inset:0;z-index:90;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px;}
.auth-box{width:100%;max-width:320px;display:flex;flex-direction:column;gap:12px;}
.auth-box h2{font-size:20px;font-weight:700;margin-bottom:4px;}
.auth-box p{font-size:14px;color:var(--mut);line-height:1.6;}
.auth-box p.warn{color:var(--fg);background:var(--fill);border-radius:12px;padding:10px 12px;}
.auth-box input{width:100%;font-size:16px;padding:12px;border-radius:12px;background:var(--fill);}
.auth-box button{padding:12px;border-radius:12px;background:var(--sel);color:var(--selfg);font-weight:600;font-size:16px;}
.auth-box button:disabled{opacity:.4;}
.auth-box .err{color:var(--danger);font-size:13px;min-height:18px;}
.shake{animation:shake .32s;}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}

/* layout */
#app{position:fixed;inset:0;display:flex;justify-content:center;}
#main{position:relative;flex:1;max-width:640px;height:100%;}
.view{position:absolute;left:0;right:0;top:0;bottom:0;overflow-y:auto;-webkit-overflow-scrolling:touch;display:none;overscroll-behavior:contain;}
.view.active{display:block;}
body.mac #main{max-width:none;border:none;}

/* tab bar：悬浮、滑动时收起 */
#tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:10px 0 max(0px, calc(var(--safe-b) - 36px));pointer-events:none;
  background:linear-gradient(to bottom, transparent, var(--bg) 58%);transition:transform .32s cubic-bezier(.2,.8,.2,1),opacity .25s;}
#tabbar.hide{transform:translateY(110%);opacity:0;}
.tabs{display:flex;justify-content:center;align-items:center;gap:38px;}
.tab{pointer-events:auto;width:46px;height:40px;display:flex;align-items:center;justify-content:center;color:var(--faint);}
.tab svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s;}
.tab.on{color:var(--fg);}
.tab.on svg{transform:scale(1.18);stroke-width:1.9;}
.tab[data-tab="plus"] svg{stroke-width:2.3;}
body:not(.wide) .tab[data-tab="plus"]{margin-left:72px;}
.tab:active svg{transform:scale(.88);}

/* timeline */
#feed{padding:6px 18px 40vh;}
#tlBar{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(var(--safe-t) + 8px) 0 4px;}
#tlBar .search{margin:0 16px;}
input[type=search]{-webkit-appearance:none;appearance:none;}
input[type=search]::-webkit-search-cancel-button,input[type=search]::-webkit-search-decoration{-webkit-appearance:none;display:none;}
#tlx{display:none;color:var(--mut);font-size:13px;padding:0 2px;}
#tlBar.on #tlx{display:block;}
#tlRes{display:none;padding-bottom:40vh;}
#v-timeline.searching #feed{display:none;}
#v-timeline.searching #tlRes{display:block;}
.day{font-size:12px;font-weight:600;color:var(--mut);text-align:center;margin:26px 0 10px;letter-spacing:.04em;}
.day:first-child{margin-top:4px;}
.blk{display:flex;align-items:center;gap:10px;margin:18px 0 6px;font-size:13px;}
.blk .tm{color:var(--mut);font-variant-numeric:tabular-nums;width:40px;flex-shrink:0;}
.blk .bn{font-weight:600;}
.blk::after{content:"";flex:1;height:1px;background:var(--line);}
.blk-end{height:1px;background:var(--line);margin:8px 0 8px 50px;opacity:.6;}
.dot{display:flex;gap:10px;padding:5px 0;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;border-radius:8px;transition:background .2s;}
.dot .tm{width:40px;flex-shrink:0;color:var(--faint);font-size:12px;padding-top:3px;font-variant-numeric:tabular-nums;}
.dot .tx{flex:1;min-width:0;white-space:pre-wrap;word-break:break-word;}
.dot.pressed,.dot.flash{background:var(--fill);}
.now{display:flex;align-items:center;gap:10px;margin:18px 0;cursor:pointer;}
.now::before,.now::after{content:"";flex:1;height:1px;background:var(--fg);opacity:.85;}
.now span{font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;border:1px solid var(--fg);font-variant-numeric:tabular-nums;}
.now:active span{background:var(--fill);}
.fut{display:flex;align-items:center;gap:10px;margin:14px 0 4px;font-size:13px;color:var(--mut);}
.fut .tm{width:40px;flex-shrink:0;font-variant-numeric:tabular-nums;}
.fut .du{color:var(--faint);font-size:12px;}
.fut::after{content:"";flex:1;border-top:1px dashed var(--faint);}
.feed-top{height:1px;}
#toNow{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tabh) + var(--safe-b) + 8px);transition:bottom .3s;background:var(--sel);color:var(--selfg);font-size:13px;font-weight:600;padding:8px 16px;border-radius:999px;z-index:15;display:none;box-shadow:0 4px 16px rgba(0,0,0,.18);}
#toNow.show{display:block;}
body.navhide #toNow{bottom:calc(var(--safe-b) + 16px);}

/* draw */
#v-draw{overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;}
#v-draw *{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;}
#meBtn{position:absolute;top:calc(var(--safe-t) + 8px);right:10px;z-index:3;width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:var(--faint);}
#meBtn svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;}
body.wide #meBtn{display:none;}
#drawStage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:calc(var(--safe-t) + 24px) 28px 24px;}
.card{width:100%;max-width:520px;display:flex;flex-direction:column;gap:22px;transition:transform .28s cubic-bezier(.2,.8,.2,1),opacity .28s;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;}
.card.out-up{transform:translateY(-40%);opacity:0;}
.card.out-down{transform:translateY(40%);opacity:0;}
.card.from-below{transform:translateY(40%);opacity:0;transition:none;}
.card.from-above{transform:translateY(-40%);opacity:0;transition:none;}
.cwhen{align-self:flex-start;font-size:13px;color:var(--mut);padding:2px 0;}
.ctext{font-size:21px;line-height:1.65;white-space:pre-wrap;word-break:break-word;max-height:60vh;overflow-y:auto;touch-action:pan-y;}
.ctext.long{font-size:17px;}
.cfav{align-self:flex-start;color:var(--faint);padding:4px 4px 4px 0;margin-left:-2px;}
.cfav svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linejoin:round;transition:transform .18s;}
.cfav.on{color:var(--fg);}
.cfav.on svg{fill:currentColor;}
.cfav:active svg{transform:scale(.85);}
.cfav.pop svg{animation:favpop .3s ease-out;}
@keyframes favpop{40%{transform:scale(1.25)}100%{transform:scale(1)}}
#v-draw{transition:background-color .35s;}
#v-draw.fav{background:var(--favbg);}
body.favbg #tabbar{background:linear-gradient(to bottom, transparent, var(--favbg) 58%);}
body.favbg{background:var(--favbg);}
body.favbg #tabbar{background:linear-gradient(to bottom, transparent, var(--favbg) 58%);}
body.favbg{background:var(--favbg);}
#drawTabs{position:absolute;top:calc(var(--safe-t) + 14px);left:0;right:0;display:flex;justify-content:center;gap:22px;z-index:3;pointer-events:none;}
#drawTabs button{pointer-events:auto;font-size:14px;color:var(--faint);padding:4px 2px;}
#drawTabs button.on{color:var(--fg);font-weight:600;}
.card.out-left{transform:translateX(-35%);opacity:0;}
.card.out-right{transform:translateX(35%);opacity:0;}
.card.from-left{transform:translateX(-35%);opacity:0;transition:none;}
.card.from-right{transform:translateX(35%);opacity:0;transition:none;}
.empty{color:var(--faint);font-size:14px;text-align:center;}

/* me / sub pages */
.page{padding:calc(var(--safe-t) + 10px) 0 130px;}
.phead{position:sticky;top:0;z-index:2;background:var(--bg);display:flex;align-items:center;gap:6px;height:48px;padding:0 10px;margin-top:calc(-1 * var(--safe-t) - 10px);padding-top:var(--safe-t);box-sizing:content-box;}
.phead .back{font-size:26px;line-height:1;padding:4px 10px 6px 6px;color:var(--fg);}
.phead .ttl{font-weight:600;font-size:16px;flex:1;}
.phead .act{padding:6px 8px;font-weight:600;}
.phead .act svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;display:block;}
.bigt{font-size:28px;font-weight:700;padding:8px 20px 14px;}
.grp{margin:0 16px 22px;border-radius:14px;background:var(--group);overflow:hidden;}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:13px 16px;font-size:16px;color:var(--fg);text-decoration:none;}
.row + .row{border-top:1px solid var(--line);}
.row .rt{flex:1;min-width:0;}
.row .rv{color:var(--mut);font-size:14px;}
.row .chev{color:var(--faint);}
.row:active{background:var(--fill2);}
.row.red{color:var(--danger);}
.seg{display:flex;background:var(--fill2);border-radius:9px;padding:2px;gap:2px;}
.seg button{font-size:13px;padding:4px 10px;border-radius:7px;color:var(--mut);}
.seg button.on{background:var(--bg);color:var(--fg);font-weight:600;}
.foot{color:var(--faint);font-size:12px;text-align:center;padding:8px 16px 30px;white-space:pre-wrap;word-break:break-all;}
.only-wide{display:none !important;}
body.wide .only-wide{display:flex !important;}
body.wide .only-narrow{display:none !important;}

/* lists: search / trash / notes */
.search{margin:4px 16px 10px;display:flex;align-items:center;gap:8px;background:var(--fill);border-radius:10px;padding:8px 12px;}
.search input{flex:1;font-size:16px;}
.search svg{width:16px;height:16px;stroke:var(--mut);fill:none;stroke-width:2;flex-shrink:0;}
.li{display:block;width:100%;text-align:left;padding:12px 20px;border-bottom:1px solid var(--line);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;}
.li:active,.li.pressed{background:var(--fill);}
.li .l1{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.li .l2{font-size:14px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.li .l2 b{color:var(--mut);font-weight:400;margin-right:8px;}
.li .tx{white-space:pre-wrap;word-break:break-word;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;}
.li .meta{font-size:12px;color:var(--mut);margin-bottom:2px;}
mark{background:var(--fill2);color:var(--fg);border-radius:3px;padding:0 1px;}
.li.sel{background:var(--fill);}
.note-ed{display:flex;flex-direction:column;height:100%;}
.note-ed textarea{flex:1;padding:6px 20px 40vh;font-size:16px;line-height:1.6;}
.notes-scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;}
.mac-notes{display:flex;height:100%;}
.mac-notes .nl{width:320px;flex-shrink:0;border-right:1px solid var(--line);display:flex;flex-direction:column;height:100%;overflow:hidden;transition:width .22s cubic-bezier(.2,.8,.2,1),border-color .22s;}
.mac-notes.folded .nl{width:0;border-right-color:transparent;}
.mac-notes .nl-in{width:320px;display:flex;flex-direction:column;height:100%;flex-shrink:0;}
.ne-head{display:flex;align-items:center;justify-content:space-between;height:48px;padding:0 10px;flex-shrink:0;}
.ne-head button{padding:6px 8px;color:var(--mut);}
.ne-head svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;display:block;}
.ne-head button:hover{color:var(--fg);}
.mac-notes .ne{flex:1;display:flex;flex-direction:column;height:100%;min-width:0;}
.mac-notes .ne textarea{flex:1;padding:8px max(40px, calc((100% - 820px) / 2)) 40vh;font-size:16px;line-height:1.7;width:100%;}
.mac-notes .ne .empty{margin:auto;}
.mac-notes .phead{margin-top:0;}
.notes-root .phead{margin-top:0;}

/* sheets */
.backdrop{position:fixed;inset:0;background:var(--backdrop);z-index:40;opacity:0;transition:opacity .22s;}
.backdrop.show{opacity:1;}
.sheet{position:fixed;left:0;right:0;bottom:var(--kb);z-index:41;background:var(--sheet);border-radius:18px 18px 0 0;transform:translateY(105%);transition:transform .26s cubic-bezier(.2,.8,.2,1);max-width:640px;margin:0 auto;}
.sheet.show{transform:none;}
.sheet.center{left:50%;right:auto;top:50%;bottom:auto;width:min(580px,90vw);max-width:none;margin:0;border-radius:18px;padding-bottom:0 !important;
  transform:translate(-50%,-46%) scale(.97);opacity:0;transition:transform .22s cubic-bezier(.2,.8,.2,1),opacity .18s;box-shadow:0 30px 80px -20px rgba(0,0,0,.35);}
.sheet.center.show{transform:translate(-50%,-50%);opacity:1;}
.sheet.center .grab{display:none;}
.sheet.center .compose-head{padding:16px 16px 4px 22px;}
.sheet.center .compose-ta{min-height:150px;padding:10px 22px 22px;}
.sheet.kb{padding-bottom:0;}
.sheet:not(.kb){padding-bottom:var(--safe-b);}
.grab{height:22px;display:flex;align-items:center;justify-content:center;touch-action:none;}
.grab::before{content:"";width:36px;height:5px;border-radius:3px;background:var(--fill2);}
.compose-head{display:flex;align-items:center;padding:0 16px 4px 20px;touch-action:none;}
.compose-head .where{flex:1;font-size:13px;color:var(--mut);}
.send{font-weight:700;padding:6px 14px;border-radius:999px;background:var(--sel);color:var(--selfg);font-size:14px;}
.send:disabled{opacity:.25;}
.compose-ta{display:block;width:100%;padding:8px 20px 18px;font-size:17px;line-height:1.55;min-height:96px;max-height:50vh;}
.acts{padding:8px 10px 10px;}
.acts .ag{background:var(--group);border-radius:14px;overflow:hidden;margin-bottom:8px;}
.acts button{display:block;width:100%;padding:15px;font-size:17px;text-align:center;}
.acts .ag button + button{border-top:1px solid var(--line);}
.acts .red{color:var(--danger);}
.acts .cancel{font-weight:600;background:var(--group);border-radius:14px;}
.full{position:fixed;inset:0;z-index:45;background:var(--bg);display:flex;flex-direction:column;transform:translateY(100%);transition:transform .26s cubic-bezier(.2,.8,.2,1);}
.full.show{transform:none;}
.full.fade{transform:none;opacity:0;transition:opacity .16s;}
.full.fade.show{opacity:1;}
.full.side{transform:translateX(-100%);}
.full.side.show{transform:none;}
.full-head{display:flex;align-items:center;justify-content:space-between;height:52px;padding:var(--safe-t) 8px 0;box-sizing:content-box;border-bottom:1px solid var(--line);flex-shrink:0;}
.full-head .ttl{font-weight:600;font-size:15px;}
.full-head button{padding:8px 12px;font-size:16px;}
.full-head .done{font-weight:700;}
.compose-full .where{font-size:13px;color:var(--mut);font-weight:400;}
.compose-full .send{margin-right:6px;}
.full textarea.ed{flex:1;padding:16px 20px calc(var(--kb) + 20px);font-size:17px;line-height:1.6;}

/* planner */
.plan-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 16px calc(var(--kb) + 170px);}
.pgrid{position:relative;}
.pt{position:absolute;left:0;width:44px;font-size:12px;color:var(--mut);font-variant-numeric:tabular-nums;}
.pt.half{color:var(--faint);}
.pday{position:absolute;left:54px;font-size:12px;font-weight:600;color:var(--mut);}
.ptile{position:absolute;left:54px;right:0;border-radius:12px;background:var(--tile);box-shadow:inset 0 0 0 1px rgba(0,0,0,.025);padding:11px 14px;font-size:14px;cursor:pointer;-webkit-user-select:none;user-select:none;transition:transform .16s,box-shadow .16s;}
.ptile.pblk{background:linear-gradient(180deg,var(--blk1),var(--blk2));box-shadow:inset 0 1px 0 rgba(255,255,255,.9),inset 0 0 0 1px rgba(0,0,0,.045);font-weight:600;}
.psel{position:absolute;left:54px;right:0;border-radius:12px;background:var(--popbg);-webkit-backdrop-filter:blur(1px);backdrop-filter:blur(1px);
  box-shadow:0 12px 24px -10px var(--popsh),0 3px 7px -2px rgba(0,0,0,.07),inset 0 1px 0 rgba(255,255,255,.85),inset 0 0 0 1px rgba(0,0,0,.06);
  transform:translateY(-2px);z-index:2;padding:11px 14px;font-size:13px;color:var(--mut);font-variant-numeric:tabular-nums;cursor:pointer;}
.pmore{position:absolute;left:54px;right:0;margin:0 auto;width:max-content;font-size:14px;color:var(--mut);padding:10px 18px;border-radius:999px;background:var(--fill);}
.pbar{position:fixed;left:0;right:0;bottom:var(--kb);z-index:46;background:var(--sheet);border-top:1px solid var(--line);padding:10px 16px calc(10px + var(--safe-b));max-width:640px;margin:0 auto;transform:translateY(110%);transition:transform .2s;}
.pbar.kb{padding-bottom:10px;}
.pbar.show{transform:none;}
.pbar .pr{font-size:13px;color:var(--mut);margin-bottom:8px;font-variant-numeric:tabular-nums;}
.pbar .pin{display:flex;gap:8px;}
.pbar input{flex:1;background:var(--fill);border-radius:10px;padding:10px 12px;font-size:16px;}
.pbar .ok{font-weight:700;padding:0 16px;border-radius:10px;background:var(--sel);color:var(--selfg);}

/* export */
.exp{padding:0 16px 30px;}
.exp .opts{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 12px;}
.exp .opts button{padding:6px 12px;border-radius:999px;background:var(--fill);font-size:14px;}
.exp .opts button.on{background:var(--sel);color:var(--selfg);}
.exp .line{display:flex;gap:8px;align-items:center;margin-bottom:10px;font-size:14px;color:var(--mut);flex-wrap:wrap;}
.exp .line input{background:var(--fill);border-radius:8px;padding:6px 10px;color:var(--fg);}
.exp textarea{width:100%;height:46vh;background:var(--group);border-radius:12px;padding:12px;font-size:13px;line-height:1.55;font-family:ui-monospace,Menlo,monospace;}

<script>
'use strict';
// ═══════════════════════════════════════
// 常量

const SB_URL = 'https://mtrxasnouojkgsedudhs.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im10cnhhc25vdW9qa2dzZWR1ZGhzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYzNzI4NzYsImV4cCI6MjA5MTk0ODg3Nn0.qV783OBRfd8X03s_UnciFGJRW5WG9LpJzEcNcgG-Kgg';

const OLD_ROW = 'state';     // 旧版数据：原封不动，只读
const LS = 'mmm3', LS_DIRTY = 'mmm3-dirty', LS_DRAFT = 'mmm3-draft', OLD_LS = 'adhd-rpg-v2';
const MIN = 60e3, HALF = 30*MIN, DAY = 864e5, TRASH_MS = 30*DAY;
const EXTENSIONS = [['anchor','anchor.html'],['anchorbox','anchorbox.html'],['BOX','box.html'],['task-paint','task-paint.html']];

const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

const p2 = n => String(n).padStart(2,'0');
const WK = ['周日','周一','周二','周三','周四','周五','周六'];

// ═══════════════════════════════════════
// 数据
// dots:  打点 {id, t, x, u, fav?, nt?, d?, p?, tr?}   fav = 收藏的时间
// notes: 备忘录 {id, x, c, m, u, d?, p?, tr?}
// plan:  框架的每一次起名 {id, at, s, e, n}，后面的覆盖前面的，全部保留就是版本历史
// d = 删除时间（进最近删除），p = 已彻底清除
// ═══════════════════════════════════════
function blank(){ return {v:3, dots:[], notes:[], plan:[], rev:0, migratedAt:null, oldMerged:false}; }
let D = blank();
let C = {};                                  // 计算缓存
function touch(){ C = {}; }

function liveDots(){
  return C.ld || (C.ld = D.dots.filter(d => !d.d).sort((a,b) => a.t - b.t));
}
function opsSorted(){
  return C.ops || (C.ops = D.plan.slice().sort((a,b) => a.at - b.at || (a.id < b.id ? -1 : 1)));
}
function segments(){
  if(C.seg) return C.seg;
  let segs = [];
  for(const op of opsSorted()){
    const out = [];
    for(const g of segs){
      if(g.e <= op.s || g.s >= op.e){ out.push(g); continue; }
      if(g.s < op.s) out.push({s:g.s, e:op.s, n:g.n});
      if(g.e > op.e) out.push({s:op.e, e:g.e, n:g.n});
    }
    out.push({s:op.s, e:op.e, n:op.n});
    out.sort((a,b) => a.s - b.s);
    segs = out;
  }
  const m = [];
  for(const g of segs){ const l = m[m.length-1]; if(l && l.e === g.s && l.n === g.n) l.e = g.e; else m.push({...g}); }
  return C.seg = m;
}
function finalNameAt(t){
  for(const g of segments()){ if(g.s <= t && t < g.e) return g.n; if(g.s > t) break; }
  return null;
}
function nameAsOf(t, asOf){
  let n = null;
  for(const op of opsSorted()){ if(op.at > asOf) break; if(op.s <= t && t < op.e) n = op.n; }
  return n;
}

// ── 时间工具 ──
function slotStart(ms){ const d = new Date(ms); d.setSeconds(0,0); d.setMinutes(d.getMinutes() < 30 ? 0 : 30); return +d; }
function dayStart(ms){ const d = new Date(ms); d.setHours(0,0,0,0); return +d; }
function addDays(ms, n){ const d = new Date(ms); d.setDate(d.getDate()+n); return +d; }
function hm(ms){ const d = new Date(ms); return p2(d.getHours())+':'+p2(d.getMinutes()); }
function ymd(ms){ const d = new Date(ms); return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate()); }
function dayLabel(ms){
  const t0 = dayStart(Date.now()), d0 = dayStart(ms);
  if(d0 === t0) return '今天';
  if(d0 === addDays(t0,-1)) return '昨天';
  if(d0 === addDays(t0,1)) return '明天';
  const d = new Date(ms), y = d.getFullYear() !== new Date().getFullYear() ? d.getFullYear()+'年' : '';
  return y + (d.getMonth()+1)+'月'+d.getDate()+'日 '+WK[d.getDay()];
}
function longDate(ms, noTime){ const d = new Date(ms); return d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日 '+WK[d.getDay()]+(noTime ? '' : ' · '+hm(ms)); }
function dotTime(d){ return d.nt ? '' : hm(d.t); }
function durText(ms){ const h = ms/3600e3; return h < 1 ? Math.round(ms/MIN)+' 分钟' : (Number.isInteger(h) ? h : h.toFixed(1))+' 小时'; }
function endLabel(s, e){ return (dayStart(e-1) === dayStart(s) ? '' : dayLabel(e-1)+' ') + (hm(e) === '00:00' ? '24:00' : hm(e)); }

// ═══════════════════════════════════════
// 本地保存 + Supabase 同步
// ═══════════════════════════════════════
let _syncTimer = null, _syncing = false, _syncAgain = false, _loadDone = false;
let _cloudRev = 0, lastSyncAt = 0, syncOk = true, syncErr = '';
const WRITER = Math.random().toString(36).slice(2,10);

function persistLocal(){ try { localStorage.setItem(LS, JSON.stringify(D)); } catch(e) {} }
function markDirty(){ try { localStorage.setItem(LS_DIRTY,'1'); } catch(e) {} }
function clearDirty(){ try { localStorage.removeItem(LS_DIRTY); } catch(e) {} }
function isDirty(){ try { return localStorage.getItem(LS_DIRTY) === '1'; } catch(e) { return false; } }
function save(){
  touch(); persistLocal(); markDirty();
  clearTimeout(_syncTimer); _syncTimer = setTimeout(syncToCloud, 1500);
}
let _soonTimer = null;
function saveSoon(){ clearTimeout(_soonTimer); _soonTimer = setTimeout(() => { _soonTimer = null; save(); }, 600); }
function flush(){ if(_soonTimer){ clearTimeout(_soonTimer); _soonTimer = null; save(); } }
window.addEventListener('pagehide', () => { flush(); if(isDirty()) syncToCloud(); });
window.addEventListener('beforeunload', flush);

// ═══════════════════════════════════════
// 登录：Supabase 账号。之后每一次读写云端都带着「我是谁」，数据库只认你本人
// ═══════════════════════════════════════
const LS_AUTH = 'mmm3-auth';
let AUTH = (() => { try { return JSON.parse(localStorage.getItem(LS_AUTH) || 'null'); } catch(e) { return null; } })();
function saveAuth(a){ AUTH = a; try { if(a) localStorage.setItem(LS_AUTH, JSON.stringify(a)); else localStorage.removeItem(LS_AUTH); } catch(e) {} }
function authFromResp(j){ return {access_token: j.access_token, refresh_token: j.refresh_token, expires_at: Date.now() + (Number(j.expires_in) || 3600) * 1000, user: {id: j.user && j.user.id, email: j.user && j.user.email}}; }
async function authLogin(email, password){
  const r = await fetch(SB_URL + '/auth/v1/token?grant_type=password', {method: 'POST', headers: {'Content-Type': 'application/json', apikey: SB_KEY}, body: JSON.stringify({email, password})});
  const j = await r.json().catch(() => ({}));
  if(!r.ok) throw new Error(j.error_description || j.msg || j.message || ('登录失败 HTTP ' + r.status));
  saveAuth(authFromResp(j));
}
let _refreshP = null;
function authRefresh(){
  if(_refreshP) return _refreshP;
  _refreshP = (async () => {
    if(!AUTH || !AUTH.refresh_token) throw new Error('还没登录');
    const r = await fetch(SB_URL + '/auth/v1/token?grant_type=refresh_token', {method: 'POST', headers: {'Content-Type': 'application/json', apikey: SB_KEY}, body: JSON.stringify({refresh_token: AUTH.refresh_token})});
    const j = await r.json().catch(() => ({}));
    if(!r.ok){
      if(r.status === 400 || r.status === 401){ saveAuth(null); needLogin(); }   // 登录失效，需要重新登录
      throw new Error('登录已过期，请重新登录');
    }
    saveAuth(authFromResp(j));
  })().finally(() => { _refreshP = null; });
  return _refreshP;
}
async function authHeaders(){
  if(!AUTH) throw new Error('还没登录');
  if(Date.now() > (AUTH.expires_at || 0) - 60e3) await authRefresh();
  return {apikey: SB_KEY, Authorization: 'Bearer ' + AUTH.access_token};
}
async function sbFetch(path, opts){
  opts = opts || {};
  let h = await authHeaders();
  let r = await fetch(SB_URL + path, Object.assign({}, opts, {headers: Object.assign({}, opts.headers || {}, h), cache: 'no-store'}));
  if(r.status === 401){ await authRefresh(); h = await authHeaders(); r = await fetch(SB_URL + path, Object.assign({}, opts, {headers: Object.assign({}, opts.headers || {}, h), cache: 'no-store'})); }
  return r;
}
async function fetchRow(key){
  const r = await sbFetch('/rest/v1/'+SB_TABLE+'?key=eq.'+key+'&select=value');
  if(!r.ok) throw new Error('读取失败 HTTP '+r.status+' '+(await r.text().catch(() => '')).slice(0,160));
  const rows = await r.json();
  return rows && rows[0] && rows[0].value ? JSON.parse(rows[0].value) : null;
}

// ═══════════════════════════════════════
// 端到端加密：上传前在本机加密，云端只存乱码。口令只在你脑子里和各台设备本地
// AES-GCM 256，密钥由口令经 PBKDF2-SHA256 推导
// ═══════════════════════════════════════
const LS_KEY = 'mmm3-key';
const TE = new TextEncoder(), TD = new TextDecoder();
let CK = null, CK_SALT = '', PENDING_ENC = null;
function b64(buf){ const a = new Uint8Array(buf); let s = ''; for(let i = 0; i < a.length; i += 0x8000) s += String.fromCharCode.apply(null, a.subarray(i, i + 0x8000)); return btoa(s); }
function unb64(str){ const s = atob(str); const a = new Uint8Array(s.length); for(let i = 0; i < s.length; i++) a[i] = s.charCodeAt(i); return a; }
async function deriveKey(pass, saltB64, iter){
  const base = await crypto.subtle.importKey('raw', TE.encode(pass), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name: 'PBKDF2', salt: unb64(saltB64), iterations: iter, hash: 'SHA-256'}, base, {name: 'AES-GCM', length: 256}, true, ['encrypt', 'decrypt']);
}
async function encJSON(obj, key){
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({name: 'AES-GCM', iv}, key || CK, TE.encode(JSON.stringify(obj)));
  return {iv: b64(iv), ct: b64(ct)};
}
async function decJSON(o, key){
  const pt = await crypto.subtle.decrypt({name: 'AES-GCM', iv: unb64(o.iv)}, key || CK, unb64(o.ct));
  return JSON.parse(TD.decode(pt));
}
async function loadLocalKey(){
  try {
    const k = JSON.parse(localStorage.getItem(LS_KEY) || 'null'); if(!k) return;
    CK = await crypto.subtle.importKey('raw', unb64(k.k), {name: 'AES-GCM'}, true, ['encrypt', 'decrypt']);
    CK_SALT = k.salt;
  } catch(e) { CK = null; }
}
async function keepKey(key, salt){
  CK = key; CK_SALT = salt;
  try { localStorage.setItem(LS_KEY, JSON.stringify({k: b64(await crypto.subtle.exportKey('raw', key)), salt})); } catch(e) {}
}
function forgetKey(){ CK = null; CK_SALT = ''; try { localStorage.removeItem(LS_KEY); } catch(e) {} }

// 两份数据合并：同一条以最后修改（u）为准；「见过」的时间取较晚；框架记录取并集
function mergeItems(a, b){
  const map = new Map();
  (a||[]).forEach(x => { if(x && x.id) map.set(x.id, x); });
  (b||[]).forEach(y => {
    if(!y || !y.id) return;
    const x = map.get(y.id);
    if(!x){ map.set(y.id, y); return; }
    const w = (y.u||0) > (x.u||0) ? y : x;
    const o = Object.assign({}, w);
    const sn = Math.max(x.sn||0, y.sn||0); if(sn) o.sn = sn;
    if((x.u||0) === (y.u||0)){ const lk = Math.max(x.lk||0, y.lk||0); if(lk) o.lk = lk; }
    map.set(y.id, o);
  });
  return [...map.values()];
}
function mergeState(o){
  if(!o) return;
  D.dots = mergeItems(D.dots, o.dots);
  D.notes = mergeItems(D.notes, o.notes);
  const ids = new Set(D.plan.map(p => p.id));
  (o.plan||[]).forEach(p => { if(p && p.id && !ids.has(p.id)){ D.plan.push(p); ids.add(p.id); } });
  D.migratedAt = D.migratedAt || o.migratedAt || null;
  D.oldMerged = !!(D.oldMerged || o.oldMerged);
  touch();
}
// ═══════════════════════════════════════
// 只传改动：数据按月份拆成很多小行
//   mmm3          目录：每一小行的版本号 + 框架记录
//   mmm3:d:2026-10  这个月的打点
//   mmm3:n        备忘录
// 同步时先看目录，只下载版本变了的；再只上传本机改过的
// ═══════════════════════════════════════
const PART_NOTES = ROW + ':n';
function partOfDot(d){ const x = new Date(d.t); return ROW + ':d:' + x.getFullYear() + '-' + p2(x.getMonth() + 1); }
function partitions(){
  const m = {};
  D.dots.forEach(d => { const k = partOfDot(d); (m[k] || (m[k] = [])).push(d); });
  m[PART_NOTES] = D.notes.slice();
  return m;
}
function stampTime(v){ return parseInt(String(v || '').split('.').pop(), 36) || 0; }
function itemsHash(items){ const a = items.slice().sort((x, y) => x.id < y.id ? -1 : x.id > y.id ? 1 : 0); return hashStr(JSON.stringify(a)); }
function metaCore(){ return {plan: D.plan, migratedAt: D.migratedAt, oldMerged: D.oldMerged}; }
const LS_SYNC = 'mmm3-sync';
let SY = (() => { try { return JSON.parse(localStorage.getItem(LS_SYNC) || 'null') || {}; } catch(e) { return {}; } })();
SY.known = SY.known || {}; SY.hashes = SY.hashes || {};
function saveSY(){ try { localStorage.setItem(LS_SYNC, JSON.stringify(SY)); } catch(e) {} }

async function fetchRows(keys){
  const out = [];
  for(let i = 0; i < keys.length; i += 40){
    const list = keys.slice(i, i + 40).map(k => '"' + k + '"').join(',');
    const r = await sbFetch('/rest/v1/' + SB_TABLE + '?select=key,value&key=in.(' + encodeURIComponent(list) + ')');
    if(!r.ok) throw new Error('读取失败 HTTP ' + r.status + ' ' + (await r.text().catch(() => '')).slice(0, 160));
    (await r.json()).forEach(row => { try { out.push({key: row.key, value: JSON.parse(row.value)}); } catch(e) {} });
  }
  return out;
}
async function pushRows(rows){
  const r = await sbFetch('/rest/v1/' + SB_TABLE, {method: 'POST',
    headers: {'Content-Type': 'application/json', Prefer: 'resolution=merge-duplicates'},
    body: JSON.stringify(rows)});
  if(!r.ok) throw new Error('上传失败 HTTP ' + r.status + ' ' + (await r.text().catch(() => '')).slice(0, 160));
}
// 下载：看目录，只拿版本变了的那几行
class NeedKey extends Error {}
async function pull(){
  const meta = await fetchRow(ROW);
  if(!meta) return null;
  if(meta.enc){
    if(!CK || CK_SALT !== meta.enc.salt){ forgetKey(); throw new NeedKey('需要加密口令'); }
  }
  if(Array.isArray(meta.dots) || Array.isArray(meta.notes)) mergeState(meta);   // 旧格式（一整份），合并进来
  else if(meta.core) mergeState(await decJSON(meta.core));
  else mergeState({plan: meta.plan, migratedAt: meta.migratedAt, oldMerged: meta.oldMerged});
  const parts = meta.parts || {};
  const need = Object.keys(parts).filter(k => parts[k] !== SY.known[k]);
  if(need.length){
    const rows = await fetchRows(need);
    for(const r of rows){
      const v = r.value || {};
      let items = v.items || [];
      if(v.e) items = await decJSON(v.e);
      if(r.key === PART_NOTES) mergeState({notes: items}); else mergeState({dots: items});
      SY.known[r.key] = v.v;
      SY.hashes[r.key] = v.e ? itemsHash(items) : '';     // 云端还是明文的，下次一定重新加密上传
    }
    saveSY();
  }
  return meta;
}
// 上传：只传本机内容和上次同步时不一样的那几行，最后连同目录一起提交
async function pushDirty(meta){
  if(!CK) throw new NeedKey('需要加密口令');
  const enc = (meta && meta.enc) || PENDING_ENC;
  if(!enc) throw new NeedKey('需要加密口令');
  const parts = partitions(), stamp = WRITER + '.' + Date.now().toString(36);
  const cloudParts = (meta && meta.parts) || {}, metaParts = {};
  new Set([...Object.keys(SY.known), ...Object.keys(cloudParts)]).forEach(k => {   // 两边各记了一个版本号时，取较新的
    const a = SY.known[k], c = cloudParts[k];
    metaParts[k] = !a ? c : !c ? a : (stampTime(a) >= stampTime(c) ? a : c);
  });
  const rows = [], newHashes = {};
  for(const k of Object.keys(parts)){
    const h = itemsHash(parts[k]);
    if(h !== SY.hashes[k]){ rows.push({key: k, value: JSON.stringify({v: stamp, e: await encJSON(parts[k])})}); metaParts[k] = stamp; newHashes[k] = h; }
  }
  const core = metaCore(), coreH = hashStr(JSON.stringify(core));
  const legacy = meta && (Array.isArray(meta.dots) || Array.isArray(meta.notes));
  const stale = Object.keys(metaParts).some(k => metaParts[k] !== cloudParts[k]);   // 云端目录过期了，要修正
  if(meta && !rows.length && !stale && coreH === SY.coreH && !legacy && meta.parts && meta.core) return {pushed: false};
  rows.push({key: ROW, value: JSON.stringify({fmt: 3, v: stamp, parts: metaParts, enc, core: await encJSON(core)})});
  await pushRows(rows);
  let ok = true;
  try { const after = await fetchRow(ROW); ok = !!after && after.v === stamp; } catch(e) { ok = true; }
  if(ok){
    Object.keys(newHashes).forEach(k => { SY.hashes[k] = newHashes[k]; SY.known[k] = stamp; });
    SY.coreH = coreH; saveSY();
    if(PENDING_ENC){ PENDING_ENC = null; }
  }
  return {pushed: true, ok, n: rows.length - 1};
}
async function syncToCloud(){
  if(!_loadDone) return;
  if(_syncing){ _syncAgain = true; return; }
  _syncing = true;
  let changed = false;
  try{
    for(let i = 0; i < 3; i++){
      const before = sig();
      const meta = await pull();
      if(sig() !== before) changed = true;
      const r = await pushDirty(meta);
      if(!r.pushed || r.ok){
        clearDirty(); persistLocal();
        lastSyncAt = Date.now(); syncOk = true; syncErr = '';
        if(changed) rerenderAll();
        if(curView === 'me') renderMe();
        return;
      }
    }
    throw new Error('别的设备也在同时写入，稍后会自动再试');
  }catch(e){
    syncOk = false; syncErr = String(e && e.message || e); if(curView === 'me') renderMe();
    if(e instanceof NeedKey){ _loadDone = false; setTimeout(startCloud, 0); }
  }
  finally{
    _syncing = false;
    if(_syncAgain){ _syncAgain = false; setTimeout(syncToCloud, 400); }
  }
}
function sig(){ return D.dots.length+'|'+D.notes.length+'|'+D.plan.length+'|'+D.dots.reduce((s,d)=>s+(d.u||0)%997+(d.sn||0)%991,0)+'|'+D.notes.reduce((s,d)=>s+(d.u||0)%997,0); }
let _refreshing = false;
async function refreshFromCloud(){
  if(!_loadDone || _refreshing) return;
  _refreshing = true;
  try{
    flush();
    if(isDirty()){ await syncToCloud(); return; }
    const before = sig();
    await pull();
    persistLocal(); lastSyncAt = Date.now(); syncOk = true; syncErr = '';
    if(sig() !== before) rerenderAll();
  }catch(e){} finally{ _refreshing = false; }
}

// 旧数据搬家（只读旧数据，不改动旧数据）
// 编号由旧编号决定，所以重复搬也不会重复；删掉过的不会复活
// ═══════════════════════════════════════
function oldTime(iso, id){
  const t = Date.parse(iso||'');
  if(t) return t;
  const n = Number(id);
  if(n > 1e15) return Math.floor(n/1000);
  if(n > 1e12) return n;
  return Date.now();
}
function buildFromOld(srcs){
  const tomb = {};
  srcs.forEach(s => { const tb = s && s.tombs; if(tb && typeof tb === 'object') Object.keys(tb).forEach(k => { const v = Number(tb[k])||0; if(!(k in tomb) || Math.abs(v) > Math.abs(tomb[k])) tomb[k] = v; }); });
  const dead = (coll, id) => (Number(tomb[coll+':'+String(id)])||0) > 0;
  const union = coll => {
    const m = new Map();
    srcs.forEach(s => (Array.isArray(s[coll]) ? s[coll] : []).forEach(x => {
      if(!x || x.id == null || dead(coll, x.id)) return;
      const k = String(x.id), y = m.get(k);
      if(!y) m.set(k, x);
      else { const tx = Date.parse(x.editedAt||x.createdAt||'')||0, ty = Date.parse(y.editedAt||y.createdAt||'')||0; if(tx > ty) m.set(k, x); }
    }));
    return [...m.values()];
  };
  const dots = [], notes = [];
  union('journal').forEach(j => {
    const x = String(j.text||'').trim(); if(!x) return;
    const t = oldTime(j.createdAt, j.id);
    const d = {id:'j'+j.id, t, x, u:t};
    const tr = {};
    if(Array.isArray(j.tags) && j.tags.length) tr.tags = j.tags;
    if(j.src) tr.src = j.src;
    if(Array.isArray(j.replies) && j.replies.length) tr.replies = j.replies;
    if(Object.keys(tr).length) d.tr = tr;
    dots.push(d);
  });
  union('tasks').forEach(tk => (Array.isArray(tk.tlMarks) ? tk.tlMarks : []).forEach(m => {
    if(!m || m.imported) return;
    const x = String(m.text||'').trim(); if(!x) return;
    const t = oldTime(m.ts, m.id);
    dots.push({id:'m'+tk.id+'_'+m.id, t, x, u:t, tr:{src:{task:tk.name||'', pct:m.pct||0}}});
  }));
  union('cards').forEach(c => {
    const x = [String(c.quote||'').trim(), String(c.body||'').trim()].filter(Boolean).join('\n\n'); if(!x) return;
    const ct = oldTime(c.createdAt, c.id), mt = Date.parse(c.editedAt||'') || ct;
    const n = {id:'c'+c.id, x, c:ct, m:mt, u:ct};
    if(Array.isArray(c.tags) && c.tags.length) n.tr = {tags:c.tags};
    notes.push(n);
  });
  return {dots, notes};
}
async function mergeOldData(){
  let local = null, cloud = null, cloudOk = false;
  try { local = JSON.parse(localStorage.getItem(OLD_LS)||'null'); } catch(e) {}
  try { cloud = await fetchRow(OLD_ROW); cloudOk = true; } catch(e) {}
  const srcs = [local, cloud].filter(Boolean);
  if(!srcs.length){ if(cloudOk) D.oldMerged = true; return; }
  const b = buildFromOld(srcs);
  D.dots = mergeItems(b.dots, D.dots);       // 已有的（可能删过、改过）优先
  D.notes = mergeItems(b.notes, D.notes);
  if(!D.migratedAt) D.migratedAt = Date.now();
  if(cloudOk) D.oldMerged = true;
  touch();
}

function askPassphrase(enc){
  return new Promise(done => {
    if(enc){
      authScreen('<h2>输入加密口令</h2><p>你的记录在云端是加密的。输入你设置过的加密口令，这台设备以后就不用再输了。</p>'
        + '<input id="kp1" type="password" autocomplete="off" placeholder="加密口令"/><div class="err" id="kErr"></div><button id="kGo">解锁</button>');
      const go = async () => {
        const b = $('#kGo'); b.disabled = true; $('#kErr').textContent = '正在解锁…';
        try {
          const key = await deriveKey($('#kp1').value, enc.salt, enc.iter);
          const chk = await decJSON(enc.check, key);
          if(chk !== 'mmm-ok') throw new Error();
          await keepKey(key, enc.salt); closeAuth(); done();
        } catch(e) { $('#kErr').textContent = '口令不对'; b.disabled = false; }
      };
      $('#kGo').onclick = go; $('#kp1').addEventListener('keydown', e => { if(e.key === 'Enter') go(); });
    } else {
      authScreen('<h2>设置加密口令</h2><p>以后你的记录会先在设备上加密，再上传到云端。云端只存乱码，别人拿到也看不懂。</p>'
        + '<p class="warn">这个口令忘了，云端的数据就再也解不开，没有任何人能帮你找回。请记在一个安全的地方。</p>'
        + '<input id="kp1" type="password" autocomplete="new-password" placeholder="加密口令（至少 8 位）"/><input id="kp2" type="password" autocomplete="new-password" placeholder="再输一次"/>'
        + '<div class="err" id="kErr"></div><button id="kGo">设置并加密上传</button>');
      $('#kGo').onclick = async () => {
        const a = $('#kp1').value, b2 = $('#kp2').value, er = $('#kErr');
        if(a.length < 8){ er.textContent = '至少 8 位'; return; }
        if(a !== b2){ er.textContent = '两次不一样'; return; }
        $('#kGo').disabled = true; er.textContent = '正在生成密钥…';
        const salt = b64(crypto.getRandomValues(new Uint8Array(16))), iter = 310000;
        const key = await deriveKey(a, salt, iter);
        PENDING_ENC = {salt, iter, check: await encJSON('mmm-ok', key)};
        await keepKey(key, salt);
        SY.known = {}; SY.hashes = {}; SY.coreH = ''; saveSY();     // 全部重新加密上传
        closeAuth(); done();
      };
    }
  });
}

let _starting = false;
async function startCloud(){
  if(_starting) return; _starting = true;
  try{
    if(!AUTH) await needLogin();
    let meta = null;
    for(;;){
      try { meta = await fetchRow(ROW); break; }
      catch(e){ syncOk = false; syncErr = String(e && e.message || e); if(!AUTH){ await needLogin(); continue; } return; }
    }
    if(!CK || (meta && meta.enc && CK_SALT !== meta.enc.salt)){ forgetKey(); await askPassphrase(meta && meta.enc); }
    try { await pull(); lastSyncAt = Date.now(); syncOk = true; syncErr = ''; }
    catch(e){ syncOk = false; syncErr = String(e && e.message || e); if(e instanceof NeedKey){ _starting = false; return startCloud(); } }
    if(!D.oldMerged) await mergeOldData();
    purgeOld(); clearLikes(); persistLocal();
    _loadDone = true;
    await syncToCloud();
    feedFrom = null; rerenderAll(); renderFeed('now');
  } finally { _starting = false; }
}
function logout(){
  saveAuth(null); forgetKey();
  SY.known = {}; SY.hashes = {}; SY.coreH = ''; saveSY();
  _loadDone = false; syncOk = false; syncErr = '已退出登录';
  startCloud();
}

const feedEl = $('#feed'), tlEl = $('#v-timeline');
let feedFrom = null, flashId = null, flashUntil = 0;
function initFeedFrom(){
  const ld = liveDots(), k = Math.max(0, ld.length - 150);
  const t = ld.length ? Math.min(ld[k].t, Date.now() - 2*DAY) : Date.now() - 2*DAY;
  feedFrom = dayStart(t);
}
function hasOlder(){ const ld = liveDots(); return ld.length && ld[0].t < feedFrom; }
function loadOlder(){
  const ld = liveDots(); let i = ld.findIndex(d => d.t >= feedFrom); if(i < 0) i = ld.length;
  if(i === 0) return;
  feedFrom = dayStart(ld[Math.max(0, i - 150)].t);
  renderFeed('bottom');
}
function renderFeed(keep){
  if(feedFrom == null) initFeedFrom();
  const now = Date.now(), items = [];
  liveDots().forEach(d => { if(d.t >= feedFrom) items.push({k:2, t:d.t, d}); });
  const segs = segments();
  segs.forEach((g, i) => {
    if(g.e <= feedFrom) return;
    if(g.s <= now){
      if(g.s >= feedFrom) items.push({k:1, t:g.s, g});
      const nx = segs[i+1];
      if(g.e <= now && !(nx && nx.s === g.e)) items.push({k:0, t:g.e});
    } else items.push({k:4, t:g.s, g});
  });
  items.push({k:3, t:now});
  items.sort((a,b) => a.t - b.t || a.k - b.k);
  let h = '<div class="feed-top"></div>', lastDay = null;
  for(const it of items){
    const dd = dayStart(it.t);
    if(it.k !== 0 && dd !== lastDay){ h += '<div class="day">'+dayLabel(it.t)+'</div>'; lastDay = dd; }
    if(it.k === 2) h += '<div class="dot'+(it.d.id === flashId && Date.now() < flashUntil ? ' flash' : '')+'" data-id="'+esc(it.d.id)+'"><span class="tm">'+dotTime(it.d)+'</span><div class="tx">'+esc(it.d.x)+'</div></div>';
    else if(it.k === 1) h += '<div class="blk"><span class="tm">'+hm(it.g.s)+'</span><span class="bn">'+esc(it.g.n)+'</span></div>';
    else if(it.k === 0) h += '<div class="blk-end"></div>';
    else if(it.k === 3) h += '<div class="now" id="nowLine"><span>现在 '+hm(now)+'</span></div>';
    else h += '<div class="fut"><span class="tm">'+hm(it.g.s)+'</span><span class="bn">'+esc(it.g.n)+'</span><span class="du">'+durText(it.g.e - it.g.s)+'</span></div>';
  }
  const fromBottom = tlEl.scrollHeight - tlEl.scrollTop;
  _progScroll = Date.now() + 120;
  feedEl.innerHTML = h;
  if(keep === 'bottom') tlEl.scrollTop = tlEl.scrollHeight - fromBottom;
  else if(keep === 'now') scrollToNow(false);
  observeNow();
}

function longPress(root, selector, cb){
  let timer = null, sx = 0, sy = 0, fired = false;
  root.addEventListener('pointerdown', e => {
    if(e.pointerType === 'mouse' && e.button !== 0) return;
    const el = e.target.closest(selector); if(!el || !root.contains(el)) return;
    sx = e.clientX; sy = e.clientY; fired = false; clearTimeout(timer);
    timer = setTimeout(() => { timer = null; fired = true; el._lpAt = Date.now(); el.classList.add('pressed'); setTimeout(() => el.classList.remove('pressed'), 300); cb(el); }, 480);
  });
  const cancel = () => { clearTimeout(timer); timer = null; };
  root.addEventListener('pointermove', e => { if(timer && (Math.abs(e.clientX-sx) > 8 || Math.abs(e.clientY-sy) > 8)) cancel(); });
  root.addEventListener('pointerup', cancel);
  root.addEventListener('pointercancel', cancel);
  root.addEventListener('scroll', cancel, true);
  root.addEventListener('contextmenu', e => {
    const el = e.target.closest(selector); if(!el || !root.contains(el)) return;
    e.preventDefault(); if(!fired) cb(el); fired = false;
  });
}

function openLayer(cls, html){
  const bd = document.createElement('div'); bd.className = 'backdrop';
  const sh = document.createElement('div'); sh.className = cls; sh.innerHTML = html;
  document.body.append(bd, sh);
  requestAnimationFrame(() => { bd.classList.add('show'); sh.classList.add('show'); });
  const close = () => {
    bd.classList.remove('show'); sh.classList.remove('show');
    setTimeout(() => { bd.remove(); sh.remove(); }, 260);
    document.activeElement && document.activeElement.blur && document.activeElement.blur();
  };
  bd.addEventListener('click', close);
  return {sh, close};
}
function swipeToClose(handle, sheet, close){
  let y0 = null;
  handle.addEventListener('touchstart', e => { y0 = e.touches[0].clientY; sheet.style.transition = 'none'; }, {passive:true});
  handle.addEventListener('touchmove', e => { if(y0 == null) return; const dy = Math.max(0, e.touches[0].clientY - y0); sheet.style.transform = 'translateY('+dy+'px)'; }, {passive:true});
  handle.addEventListener('touchend', e => {
    if(y0 == null) return; const dy = e.changedTouches[0].clientY - y0; y0 = null;
    sheet.style.transition = ''; sheet.style.transform = '';
    if(dy > 80) close();

let planOpen = false, P = null;
function openPlanner(){
  planOpen = true;
  const s0 = slotStart(Date.now());
  P = {a:null, b:null, from:s0, until:addDays(dayStart(Date.now()), 2)};
  const el = document.createElement('div'); el.className = 'full side'; el.id = 'planner';
  hSwipe(el, dx => { if(dx < -70) closePlanner(); });
  el.innerHTML = '<div class="full-head"><span style="width:60px"></span><span class="ttl"></span><button class="done">完成</button></div><div class="plan-body"></div>';
  const bar = document.createElement('div'); bar.className = 'pbar';
  bar.innerHTML = '<div class="pr"></div><div class="pin"><input enterkeyhint="done" autocomplete="off" placeholder="这段时间做什么"/><button class="ok">好</button></div>';
  document.body.append(el, bar);
  requestAnimationFrame(() => el.classList.add('show'));
  $('.done', el).onclick = closePlanner;
  $('.plan-body', el).addEventListener('click', e => {
    if(e.target.closest('.pmore')){ P.until = addDays(P.until, 1); renderPlanner(); return; }
    const g = e.target.closest('.pgrid'); if(!g || !e.target.closest('.ptile,.psel')) return;
    const y = e.clientY - g.getBoundingClientRect().top;
    const hit = P.ys.find(([t, ty]) => y >= ty - 3 && y < ty + PROW - 3);
    if(hit) tapSlot(hit[0]);
  });
  const inp = $('input', bar);
  inp.addEventListener('keydown', e => { if(e.key === 'Enter'){ e.preventDefault(); commitPlan(); } });
  $('.ok', bar).addEventListener('click', commitPlan);
  renderPlanner();
  fitKeyboard();
}
function closePlanner(){
  const el = $('#planner'), bar = $('.pbar');
  if(bar){ $('input', bar).blur(); bar.remove(); }
  if(el){ el.classList.remove('show'); setTimeout(() => el.remove(), 280); }
  planOpen = false; P = null;
  renderFeed('now');
}
function tapSlot(t){
  const bar = $('.pbar'), inp = $('input', bar);
  if(P.a == null || P.b != null){ P.a = t; P.b = null; bar.classList.remove('show'); inp.blur(); renderPlanner(); return; }
  P.b = t;
  const s = Math.min(P.a, P.b), e = Math.max(P.a, P.b) + HALF;
  $('.pr', bar).textContent = hm(s)+' 到 '+endLabel(s, e)+' · '+durText(e - s);
  inp.value = '';
  bar.classList.add('show');
  renderPlanner();
}
function commitPlan(){
  if(P.a == null || P.b == null) return;
  const bar = $('.pbar'), inp = $('input', bar), n = inp.value.trim();
  if(!n){ inp.focus(); return; }
  const s = Math.min(P.a, P.b), e = Math.max(P.a, P.b) + HALF;
  D.plan.push({id: uid(), at: Date.now(), s, e, n});
  save();
  P.a = P.b = null; inp.value = ''; inp.blur(); bar.classList.remove('show');
  renderPlanner();
}
const PROW = 46, PTILE = 40;
function renderPlanner(){
  const body = $('#planner .plan-body'); if(!body) return;
  const st = body.scrollTop;
  const lo = P.a == null ? null : (P.b == null ? P.a : Math.min(P.a, P.b));
  const hi = P.a == null ? null : (P.b == null ? P.a : Math.max(P.a, P.b));
  const slots = [];
  for(let t = P.from; t < P.until; ){ slots.push(t); t = slotStart(t + HALF + 60e3); }
  const key = t => finalNameAt(t) != null ? 'n:' + finalNameAt(t) : 'e' + t;
  let h = '', y = 0, lastDay = null, i = 0;
  P.ys = [];
  while(i < slots.length){
    const t = slots[i], dd = dayStart(t);
    if(dd !== lastDay){ if(lastDay !== null) y += 12; h += '<div class="pday" style="top:'+y+'px">'+dayLabel(t)+'</div>'; y += 26; lastDay = dd; }
    const k = key(t); let j = i + 1;
    if(k[0] !== 'e') while(j < slots.length && dayStart(slots[j]) === dd && key(slots[j]) === k) j++;
    for(let m = i; m < j; m++){
      const ty = y + (m - i) * PROW; P.ys.push([slots[m], ty]);
      h += '<div class="pt'+(new Date(slots[m]).getMinutes() === 30 ? ' half' : '')+'" style="top:'+(ty + 11)+'px">'+hm(slots[m])+'</div>';
    }
    let cls = 'ptile', label = '';
    if(k[0] === 'n'){ cls += ' pblk'; label = esc(k.slice(2)); }
    h += '<div class="'+cls+'" style="top:'+y+'px;height:'+((j - i) * PROW - (PROW - PTILE))+'px">'+label+'</div>';
    y += (j - i) * PROW; i = j;
  }
  if(lo != null){                                  // 选中的那段：半透明地浮在块上面，按天分开
    let run = null; const runs = [];
    P.ys.forEach(([t, ty]) => {
      if(t < lo || t > hi){ run = null; return; }
      if(!run || dayStart(t) !== run.d){ run = {d: dayStart(t), t0: t, y0: ty, y1: ty}; runs.push(run); }
      run.y1 = ty;
    });
    runs.forEach((r, n) => {
      const label = n === 0 && P.b != null ? hm(lo)+' 到 '+endLabel(lo, hi + HALF)+' · '+durText(hi + HALF - lo) : '';
      h += '<div class="psel" style="top:'+r.y0+'px;height:'+(r.y1 - r.y0 + PTILE)+'px">'+label+'</div>';
    });
  }
  h += '<button class="pmore" style="top:'+(y + 14)+'px">再往后一天</button>';
  body.innerHTML = '<div class="pgrid" style="height:'+(y + 70)+'px">'+h+'</div>';
  body.scrollTop = st;
}

// 抽一条
// ═══════════════════════════════════════
let curDraw = null, drawHist = [], drawIdx = -1, drawMode = 'all';
const drawState = {all: {cur: null, hist: [], idx: -1}, fav: {cur: null, hist: [], idx: -1}};
const stage = $('#drawStage'), drawView = $('#v-draw');
const HEART_SVG = '<svg viewBox="0 0 24 24"><path d="M12 20.3s-7.6-4.6-7.6-10.2A4.2 4.2 0 0 1 12 7.7a4.2 4.2 0 0 1 7.6 2.4c0 5.6-7.6 10.2-7.6 10.2z"/></svg>';
function poolOf(mode){ return liveDots().filter(d => d.x && d.x.trim() && (mode !== 'fav' || d.fav)); }
function pickDot(){
  const pool = poolOf(drawMode), ld = pool.filter(d => !(curDraw && d.id === curDraw.id));   // 每一条机会完全相同，只排除眼前这张
  if(!ld.length) return curDraw && pool.some(d => d.id === curDraw.id) ? curDraw : null;
  return ld[Math.floor(Math.random() * ld.length)];
}
function resetDraw(){
  ['all','fav'].forEach(m => drawState[m] = {cur: null, hist: [], idx: -1});
  drawMode = 'all'; curDraw = null; drawHist = []; drawIdx = -1; stage.innerHTML = ''; paintMode();
}
function paintMode(){
  drawView.classList.toggle('fav', drawMode === 'fav');
  document.body.classList.toggle('favbg', curView === 'draw' && drawMode === 'fav');
  document.body.classList.toggle('favbg', curView === 'draw' && drawMode === 'fav');
  document.querySelectorAll('#drawTabs [data-dm]').forEach(b => b.classList.toggle('on', b.dataset.dm === drawMode));
}
function switchMode(m){
  if(m === drawMode) return;
  drawState[drawMode] = {cur: curDraw, hist: drawHist, idx: drawIdx};
  const dir = m === 'fav' ? 'left' : 'right';
  drawMode = m; paintMode();
  const st = drawState[m];
  curDraw = st.cur && D.dots.find(x => x.id === st.cur.id && !x.d && (m !== 'fav' || x.fav)) || null;
  drawHist = st.hist; drawIdx = st.idx;
  const old = $('.card', stage) || $('.empty', stage);
  const show = () => { if(curDraw) renderDraw(dir); else { drawHist = []; drawIdx = -1; const d = pickDot(); if(d){ curDraw = d; drawHist.push(d.id); drawIdx = 0; } renderDraw(dir); } };
  if(old && old.classList.contains('card')){ old.classList.add(dir === 'left' ? 'out-left' : 'out-right'); setTimeout(show, 170); } else show();
}
function drawNext(){
  if(drawIdx < drawHist.length - 1){
    const d = D.dots.find(x => x.id === drawHist[drawIdx + 1] && !x.d);
    drawIdx++;
    if(d){ curDraw = d; return animDraw('up'); }
    drawHist.splice(drawIdx, 1); drawIdx--;
  }
  const d = pickDot();
  if(!d){ curDraw = null; return renderDraw(''); }
  if(curDraw && d.id === curDraw.id) return;
  curDraw = d; drawHist.push(d.id); drawIdx = drawHist.length - 1;
  animDraw(drawHist.length > 1 ? 'up' : '');
}
function drawPrev(){
  while(drawIdx > 0){
    drawIdx--;
    const d = D.dots.find(x => x.id === drawHist[drawIdx] && !x.d);
    if(d){ curDraw = d; return animDraw('down'); }
  }
}
function animDraw(dir){
  const old = $('.card', stage);
  if(old && dir){ old.classList.add(dir === 'up' ? 'out-up' : 'out-down'); setTimeout(() => renderDraw(dir), 190); }
  else renderDraw('');
}
function renderDraw(dir){
  if(!curDraw){ stage.innerHTML = '<div class="empty">'+(drawMode === 'fav' ? '还没有收藏，在「全部」里点一下心就会出现在这里' : '还没有记录')+'</div>'; return; }
  const d = curDraw, long = (d.x||'').length > 220;
  const from = {up: ' from-below', down: ' from-above', left: ' from-right', right: ' from-left'}[dir] || '';
  stage.innerHTML = '<div class="card'+from+'"><button class="cwhen">'+longDate(d.t, d.nt)+'</button><div class="ctext'+(long?' long':'')+'">'+esc(d.x)+'</div>'
    + '<button class="cfav'+(d.fav ? ' on' : '')+'" aria-label="收藏">'+HEART_SVG+'</button></div>';
  if(from) requestAnimationFrame(() => requestAnimationFrame(() => { const c = $('.card', stage); if(c){ c.style.transition = ''; c.classList.remove('from-below','from-above','from-left','from-right'); } }));
  $('.cwhen', stage).onclick = () => jumpToDot(d.id);
  $('.cfav', stage).onclick = e => {
    e.stopPropagation();
    if(d.fav) delete d.fav; else d.fav = Date.now();
    d.u = Date.now(); save();
    const b = e.currentTarget; b.classList.toggle('on', !!d.fav); b.classList.remove('pop'); void b.offsetWidth; b.classList.add('pop');
  };
}
$('#drawTabs').addEventListener('click', e => { const b = e.target.closest('[data-dm]'); if(b) switchMode(b.dataset.dm); });
(function(){
  let y0 = null, x0 = 0, inText = false, axis = null;
  drawView.addEventListener('touchstart', e => {
    const t = e.touches[0]; y0 = t.clientY; x0 = t.clientX; axis = null;
    const tx = e.target.closest('.ctext'); inText = !!(tx && tx.scrollHeight > tx.clientHeight + 2);
  }, {passive:true});
  drawView.addEventListener('touchmove', e => {
    if(y0 == null) return;
    const dx = e.touches[0].clientX - x0, dy = e.touches[0].clientY - y0;
    if(!axis && (Math.abs(dx) > 8 || Math.abs(dy) > 8)) axis = Math.abs(dx) > Math.abs(dy) ? 'x' : 'y';
    if(axis === 'y' && inText) return;
    const c = $('.card', stage); if(!c || !axis) return;
    c.style.transition = 'none';
    if(axis === 'y'){ c.style.transform = 'translateY('+(dy*0.5)+'px)'; c.style.opacity = String(1 - Math.min(Math.abs(dy)/500, .5)); }
    else { c.style.transform = 'translateX('+(dx*0.45)+'px)'; c.style.opacity = String(1 - Math.min(Math.abs(dx)/600, .4)); }
  }, {passive:true});
  drawView.addEventListener('touchend', e => {
    if(y0 == null) return;
    const t = e.changedTouches[0], dy = t.clientY - y0, dx = t.clientX - x0, ax = axis;
    y0 = null; axis = null;
    const c = $('.card', stage);
    if(c){ c.style.transition = ''; c.style.transform = ''; c.style.opacity = ''; }
    if(ax === 'x' && Math.abs(dx) > 70){ switchMode(dx < 0 ? 'fav' : 'all'); return; }
    if(ax === 'y' && !inText && dy < -60){ drawNext(); return; }
    if(ax === 'y' && !inText && dy > 60){ drawPrev(); return; }
  });
  drawView.addEventListener('selectstart', e => e.preventDefault());
  let wheelLock = 0;
  drawView.addEventListener('wheel', e => {
    const tx = e.target.closest('.ctext'); if(tx && tx.scrollHeight > tx.clientHeight) return;
    if(Date.now() < wheelLock) return;
    if(Math.abs(e.deltaX) > 30 && Math.abs(e.deltaX) > Math.abs(e.deltaY)){ wheelLock = Date.now() + 700; switchMode(e.deltaX > 0 ? 'fav' : 'all'); return; }
    if(Math.abs(e.deltaY) < 25) return;
    wheelLock = Date.now() + 700;
    if(e.deltaY > 0) drawNext(); else drawPrev();
  }, {passive:true});
  longPress(drawView, '.ctext,.cwhen', () => { if(curDraw) dotMenu(curDraw.id, () => { drawHist.splice(drawIdx, 1); drawIdx--; drawNext(); }); });
})();
document.addEventListener('keydown', e => {
  if(curView !== 'draw' || document.querySelector('.full,.sheet')) return;
  if(e.key === ' ' || e.key === 'ArrowDown'){ e.preventDefault(); drawNext(); }
  if(e.key === 'ArrowUp'){ e.preventDefault(); drawPrev(); }
  if(e.key === 'ArrowRight'){ e.preventDefault(); switchMode('fav'); }
  if(e.key === 'ArrowLeft'){ e.preventDefault(); switchMode('all'); }
});
function jumpToDot(id){

// ── 搜索：原样查找，空格分开的词都要包含 ──
function terms(q){ return q.trim().toLowerCase().split(/\s+/).filter(Boolean); }
function matches(text, ts){ const l = String(text||'').toLowerCase(); return ts.every(t => l.includes(t)); }
function snippet(text, ts, before=24, after=70){
  const s = String(text||''), l = s.toLowerCase();
  let i = ts.length ? l.indexOf(ts[0]) : 0; if(i < 0) i = 0;
  const a = Math.max(0, i - before), b = Math.min(s.length, i + after);
  let out = (a > 0 ? '…' : '') + s.slice(a, b) + (b < s.length ? '…' : '');
  out = esc(out.replace(/\s+/g,' '));
  ts.forEach(t => { const re = new RegExp(esc(t).replace(/[.*+?^${}()|[\]\\]/g,'\\$&'), 'gi'); out = out.replace(re, m => '<mark>'+m+'</mark>'); });
  return out;
}
let searchQ = '';
function renderSearch(){
  subEl.innerHTML = '<div class="page">'+pageHead('搜索')+'<div class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg><input id="sq" type="search" enterkeyhint="search" placeholder="搜索打点" autocomplete="off"/></div><div id="sres"></div></div>';
  const inp = $('#sq', subEl); inp.value = searchQ;
  const run = () => {
    searchQ = inp.value; const ts = terms(searchQ), box = $('#sres', subEl);

    const res = liveDots().filter(d => matches(d.x, ts)).slice().reverse();
    box.innerHTML = res.slice(0, 300).map(d => '<button class="li" data-jump="'+esc(d.id)+'"><div class="meta">'+dayLabel(d.t)+' '+dotTime(d)+'</div><div class="tx">'+snippet(d.x, ts)+'</div></button>').join('')
      + '<div class="foot">'+(res.length ? res.length+' 条' : '没有找到')+'</div>';
  };
  inp.addEventListener('input', run); run();
  setTimeout(() => inp.focus(), 50);
}

// ── 最近删除 ──
function purgeOld(){
  const cut = Date.now() - TRASH_MS; let n = 0;
  D.dots.concat(D.notes).forEach(x => { if(x.d && !x.p && x.d < cut){ x.x = ''; x.p = 1; x.u = Date.now(); delete x.tr; n++; } });
  if(n) save();
}
function renderTrash(){
  const items = [];
  D.dots.forEach(x => { if(x.d && !x.p && x.x && x.x.trim()) items.push({k:'dot', x}); });
  D.notes.forEach(x => { if(x.d && !x.p && x.x && x.x.trim()) items.push({k:'note', x}); });
  items.sort((a,b) => b.x.d - a.x.d);
  subEl.innerHTML = '<div class="page">'+pageHead('最近删除')
    + (items.length ? items.map(it => {
        const left = Math.max(1, Math.ceil((it.x.d + TRASH_MS - Date.now()) / DAY));
        return '<button class="li" data-trash="'+it.k+':'+esc(it.x.id)+'"><div class="meta">'+(it.k==='dot' ? '打点 · '+dayLabel(it.x.t)+' '+dotTime(it.x) : '备忘录')+' · 还剩 '+left+' 天</div><div class="tx">'+esc(it.x.x)+'</div></button>';
      }).join('') : '<div class="foot" style="padding-top:40px">空的</div>')
    + '</div>';
}
subEl.addEventListener('click', e => {
  const b = e.target.closest('[data-trash]'); if(!b) return;
  const [k, ...rest] = b.dataset.trash.split(':'), id = rest.join(':');
  const x = (k === 'dot' ? D.dots : D.notes).find(y => y.id === id); if(!x) return;
  actionSheet([
    {label:'恢复', fn: () => { delete x.d; x.u = Date.now(); save(); rerenderAll(); renderTrash(); }},
    {label:'彻底删除', red:true, fn: () => { x.x = ''; x.p = 1; delete x.tr; x.u = Date.now(); save(); renderTrash(); }}
  ]);
});

const EX = {mode:'7', from:'', to:'', q:''};
const EXPORT_NOTE = '说明：这是我在 MMM 里的原始记录，没有经过整理。\n「计划的变化」是我随手排的粗略打算，不是承诺；每一行是一次排列或改动，后排的会覆盖先排的同一段时间。\n「念头」是当时随手写下的话，按写下那一刻我原本打算做的事分组；如果那段时间后来被改成了别的，会注明「后改为」。\n★ 是我收藏的。';
function exportRange(){
  const now = Date.now(), t0 = dayStart(now);
  if(EX.mode === 'today') return [t0, addDays(t0,1), '今天'];
  if(EX.mode === '7') return [addDays(t0,-6), addDays(t0,1), '最近 7 天'];
  if(EX.mode === '30') return [addDays(t0,-29), addDays(t0,1), '最近 30 天'];
  if(EX.mode === 'range'){
    const a = EX.from ? dayStart(Date.parse(EX.from+'T00:00')) : 0, b = EX.to ? addDays(dayStart(Date.parse(EX.to+'T00:00')),1) : addDays(t0,1);
    return [a, b, (EX.from||'最早')+' 至 '+(EX.to||'今天')];
  }
  return [0, Infinity, '全部'];
}
function buildExport(){
  const [a, b, label] = exportRange(), ts = terms(EX.q);
  const dots = liveDots().filter(d => d.t >= a && d.t < b && (!ts.length || matches(d.x, ts)));
  const days = new Set(dots.map(d => dayStart(d.t)));
  if(!ts.length) opsSorted().forEach(op => { for(let t = dayStart(op.s); t < op.e; t = addDays(t,1)){ if(t >= a && t < b && (b !== Infinity || t <= Date.now() + 7*DAY)) days.add(t); } });
  const dayList = [...days].sort((x,y) => x - y);
  let out = '# MMM 导出 · '+label+(ts.length ? ' · 搜索「'+EX.q.trim()+'」' : '')+'\n导出时间：'+ymd(Date.now())+' '+hm(Date.now())+'\n\n'+EXPORT_NOTE+'\n';
  const range = (s, e) => hm(s)+' 至 '+(dayStart(e-1) !== dayStart(s) ? '次日 ' : '')+(hm(e) === '00:00' ? '24:00' : hm(e));
  for(const d0 of dayList){
    const d1 = addDays(d0, 1), dd = new Date(d0);
    out += '\n## '+ymd(d0)+' '+WK[dd.getDay()]+'\n';
    const ops = opsSorted().filter(op => op.s < d1 && op.e > d0);
    if(ops.length){
      out += '\n### 计划的变化\n';
      ops.forEach(op => { out += '['+ymd(op.at).slice(5)+' '+hm(op.at)+' 排下] '+range(op.s, op.e)+' '+op.n+'\n'; });
      const fin = segments().filter(g => g.s < d1 && g.e > d0);
      if(fin.length) out += '最后的样子：'+fin.map(g => range(Math.max(g.s,d0), Math.min(g.e,d1))+' '+g.n).join(' · ')+'\n';
    }
    const ds = dots.filter(d => d.t >= d0 && d.t < d1);
    if(ds.length){
      out += '\n### 念头\n';
      let lastLabel = null;
      ds.forEach(d => {
        const then = nameAsOf(d.t, d.t), fin = finalNameAt(d.t);
        let lab = then ? then : '没有安排';
        if((fin||null) !== (then||null)) lab += ' → 后改为：'+(fin || '没有安排');
        if(!ops.length) lab = '';
        if(lab && lab !== lastLabel) out += '['+lab+']\n';
        lastLabel = lab;
        out += (d.nt ? '' : hm(d.t)+' ')+d.x.replace(/\n/g, d.nt ? '\n' : '\n      ')+(d.fav ? ' ★' : '')+'\n';
      });
    }
  }
  return {text: out, n: dots.length, days: dayList.length};
}

// 导入过去的记录（电脑）
// ═══════════════════════════════════════
const IMPORT_TEMPLATE = `# MMM 导入模板
#
# 规则：
# 1. 每一条记录以「日期」开头，日期单独占一行
#      2023-05-04          只有日期
#      2023-05-04 21:30    日期加时间
#    日期也可以写成 2023/5/4 或 2023年5月4日
# 2. 日期下面就是这一条的内容，可以有很多行，可以有空行
# 3. 出现下一个日期行，就是下一条记录
# 4. 以 # 开头的行会被忽略，可以用来写备注
# 5. 只写日期不写时间的，在 MMM 里时间那一栏会空着；同一天的几条按这里的先后顺序排
# 6. 同一个日期、同样内容的记录，重复导入时会自动跳过
#
# 下面是例子，可以删掉

2023-05-04 21:30
今天又在图书馆坐了一下午，什么都没写出来。

2023-05-05
只知道是哪天，不知道几点。
内容可以有好几行。

2023年5月6日 08:15
写法也可以这样。
`;
const DATE_LINE = /^\s*(\d{4})\s*[-/.年]\s*(\d{1,2})\s*[-/.月]\s*(\d{1,2})\s*日?(?:\s+(\d{1,2})\s*[:：]\s*(\d{2}))?\s*$/;
function hashStr(str){ let h1 = 0x811c9dc5, h2 = 0; for(let i = 0; i < str.length; i++){ const c = str.charCodeAt(i); h1 = Math.imul(h1 ^ c, 16777619); h2 = (h2 * 31 + c) | 0; } return (h1 >>> 0).toString(36) + (h2 >>> 0).toString(36); }
function mkEntry(y, mo, d, hh, mm){
  y = +y; mo = +mo; d = +d;
  const dt = new Date(y, mo - 1, d, hh != null ? +hh : 0, hh != null ? +mm : 0);
  if(dt.getFullYear() !== y || dt.getMonth() !== mo - 1 || dt.getDate() !== d) return null;
  if(hh != null && (+hh > 23 || +mm > 59)) return null;
  return {t: +dt, nt: hh == null, lines: []};
}
function parseImport(text){
  const out = [], bad = [];
  const raw = String(text||'').replace(/\r\n?/g, '\n');
  if(/^\s*\[/.test(raw)){                         // 也认 JSON：[{ "date": "2023-05-04 21:30", "text": "..." }]
    let arr; try { arr = JSON.parse(raw); } catch(e) { return {entries: [], bad: ['JSON 格式不对：'+e.message]}; }
    (Array.isArray(arr) ? arr : []).forEach((o, i) => {
      const m = String(o && (o.date || o.time) || '').match(DATE_LINE), x = String(o && o.text || '').trim();
      const e = m && mkEntry(m[1], m[2], m[3], m[4], m[5]);
      if(!e || !x){ bad.push('第 '+(i+1)+' 条：'+(e ? '没有内容' : '日期看不懂')); return; }
      e.x = x; out.push(e);
    });
  } else {
    let cur = null;
    raw.split('\n').forEach((line, i) => {
      if(/^\s*#/.test(line)) return;
      const m = line.match(DATE_LINE);
      if(m){
        const e = mkEntry(m[1], m[2], m[3], m[4], m[5]);
        if(!e){ bad.push('第 '+(i+1)+' 行：日期不存在「'+line.trim()+'」'); cur = null; return; }
        cur = e; out.push(e); return;
      }
      if(cur) cur.lines.push(line);
      else if(line.trim()) bad.push('第 '+(i+1)+' 行：前面没有日期，跳过了「'+line.trim().slice(0, 30)+'」');
    });
    out.forEach(e => { e.x = e.lines.join('\n').replace(/^\n+|\s+$/g, ''); delete e.lines; });
  }
  const entries = out.filter(e => e.x && e.x.trim());
  out.filter(e => !e.x || !e.x.trim()).forEach(e => bad.push(ymd(e.t)+(e.nt ? '' : ' '+hm(e.t))+'：日期下面没有内容'));
  const perDay = {};                               // 同一天只写日期的几条，按原本顺序排
  entries.forEach(e => {
    e.id = 'i' + hashStr(ymd(e.t) + (e.nt ? '' : hm(e.t)) + '|' + e.x);
    if(e.nt){ const k = ymd(e.t); perDay[k] = (perDay[k] || 0) + 1; e.t += perDay[k]; }
  });
  return {entries, bad};
}
let IMP = {text: '', lastBatch: null};

    + '<textarea id="imta" placeholder="2023-05-04 21:30&#10;那天的念头……" style="font-family:inherit;font-size:14px"></textarea>'

function previewImport(){
  const box = $('#imprev'); if(!box) return;
  let h = '';
  if(IMP.lastBatch){
    h += '<div style="margin-bottom:14px">已导入 '+IMP.lastBatch.n+' 条。 <button class="okb" id="imundo" style="width:auto;padding:6px 14px;border-radius:999px;background:var(--fill);color:var(--fg);font-weight:600">撤销这次导入</button></div>';
  }
  if(!IMP.text.trim()){ box.innerHTML = h; bindUndo(); return; }
  const {entries, bad} = parseImport(IMP.text);
  const have = new Set(D.dots.filter(d => !d.d).map(d => d.id));
  const fresh = entries.filter(e => !have.has(e.id));
  const sorted = entries.slice().sort((a,b) => a.t - b.t);
  h += '<div>识别出 <b>'+entries.length+'</b> 条'
    + (entries.length ? '，从 '+ymd(sorted[0].t)+' 到 '+ymd(sorted[sorted.length-1].t) : '')
    + (entries.length - fresh.length ? '，其中 '+(entries.length - fresh.length)+' 条已经导入过，会跳过' : '') + '。</div>';
  if(bad.length) h += '<div style="color:var(--danger);margin-top:8px">'+bad.slice(0, 12).map(esc).join('<br>')+(bad.length > 12 ? '<br>还有 '+(bad.length - 12)+' 处……' : '')+'</div>';
  if(fresh.length){
    h += '<div style="margin-top:12px;color:var(--mut)">预览前几条：</div>'
      + fresh.slice(0, 5).map(e => '<div class="li" style="padding:10px 0"><div class="meta">'+ymd(e.t)+(e.nt ? '' : ' '+hm(e.t))+'</div><div class="tx">'+esc(e.x)+'</div></div>').join('')
      + '<div class="btns"><button id="imgo">导入 '+fresh.length+' 条</button></div>';
  }
  box.innerHTML = h;
  bindUndo();
  const go = $('#imgo');
  if(go) go.onclick = () => {
    const batch = uid(), now = Date.now();
    fresh.forEach(e => {
      let d = D.dots.find(x => x.id === e.id);                    // 以前导入又撤销过的，原地复活，不重复
      if(!d){ d = {id: e.id}; D.dots.push(d); }
      Object.assign(d, {t: e.t, x: e.x, u: now, tr: {imp: batch}}); delete d.d; delete d.p; delete d.sn;
      if(e.nt) d.nt = 1; else delete d.nt;
    });
    IMP.lastBatch = {id: batch, n: fresh.length};
    IMP.text = ''; save(); feedFrom = null; renderFeed('now'); renderImport();
  };
}
function bindUndo(){
  const u = $('#imundo'); if(!u) return;
  u.onclick = () => {
    const b = IMP.lastBatch; if(!b) return;
    const now = Date.now();
    D.dots.forEach(d => { if(d.tr && d.tr.imp === b.id && !d.d){ d.x = ''; d.p = 1; d.d = now; d.u = now; } });
    IMP.lastBatch = null; save(); feedFrom = null; renderFeed('now'); renderImport();
  };
}

function renderExport(){
  const opts = [['today','今天'],['7','最近 7 天'],['30','最近 30 天'],['range','日期范围'],['all','全部']];
  subEl.innerHTML = '<div class="page">'+pageHead('导出')+'<div class="exp">'
    + '<div class="opts">'+opts.map(o => '<button data-em="'+o[0]+'" class="'+(EX.mode===o[0]?'on':'')+'">'+o[1]+'</button>').join('')+'</div>'
    + (EX.mode === 'range' ? '<div class="line">从 <input type="date" id="exf" value="'+EX.from+'"/> 到 <input type="date" id="ext" value="'+EX.to+'"/></div>' : '')
    + '<div class="line">只要包含 <input id="exq" placeholder="搜索词（可留空）" value="'+esc(EX.q)+'" style="flex:1;min-width:160px"/></div>'
    + '<textarea readonly id="exo"></textarea>'
    + '<div class="btns"><button id="excp">复制</button><button id="exdl">下载</button><span id="exn"></span></div></div></div>';
  const upd = () => { const r = buildExport(); $('#exo').value = r.text; $('#exn').textContent = r.days+' 天 · '+r.n+' 条念头'; };
  upd();
  const f = $('#exf'), t = $('#ext'), q = $('#exq');
  if(f) f.onchange = () => { EX.from = f.value; upd(); };
  if(t) t.onchange = () => { EX.to = t.value; upd(); };
  q.oninput = () => { EX.q = q.value; upd(); };
  $('#excp').onclick = async () => { const v = $('#exo').value; try { await navigator.clipboard.writeText(v); } catch(e) { $('#exo').select(); document.execCommand('copy'); } $('#exn').textContent = '已复制'; };
  $('#exdl').onclick = () => downloadText('MMM-导出-'+ymd(Date.now())+'.txt', $('#exo').value);
}
subEl.addEventListener('click', e => { const b = e.target.closest('[data-em]'); if(b){ EX.mode = b.dataset.em; renderExport(); } });

// ═══════════════════════════════════════
// 布局：电脑宽屏时备忘录常驻右侧
// ═══════════════════════════════════════
const wideMQ = window.matchMedia('(min-width: 1000px)');
function applyWide(){
  document.body.classList.toggle('wide', wideMQ.matches);
  if(curView === 'sub' && subName === 'notes'){ if(NS.open) closeNote(); notesHost = subEl; renderNotes(); }
  document.body.classList.toggle('mac', curView === 'sub' && subName === 'notes' && isWide());
  if(curView === 'me') renderMe();
}
wideMQ.addEventListener ? wideMQ.addEventListener('change', applyWide) : wideMQ.addListener(applyWide);

function rerenderAll(){
  touch();
  if(!planOpen) renderFeed('bottom');
  if(curView === 'draw' && curDraw){ const d = D.dots.find(x => x.id === curDraw.id); if(!d || d.d) drawNext(); else { curDraw = d; renderDraw(''); } }
  else if(curView === 'draw' && !curDraw) drawNext();
  if(curView === 'me') renderMe();
  if(curView === 'sub' && subName === 'trash') renderTrash();
  if(curView === 'sub' && subName === 'notes' && notesHost && !NS.open) renderNotes();
}

// ═══════════════════════════════════════
// 启动
// ═══════════════════════════════════════
(async function init(){
  let local = null;
  try { local = JSON.parse(localStorage.getItem(LS)||'null'); } catch(e) {}
  if(local && Array.isArray(local.dots)){ D = Object.assign(blank(), local); delete D.rev; delete D.writer; }
  touch();
  applyWide();
  renderFeed('now');
  await loadLocalKey();
  startCloud();
})();
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
